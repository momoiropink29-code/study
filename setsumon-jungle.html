<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0A2416">
<title>設問ジャングル</title>
<style>
  :root{
    --bg-deep:#0A2416; --bg-mid:#123822; --leaf:#2E7D4F; --leaf-l:#5DBB7F;
    --cream:#F7F3E3; --cream-d:#EFE8CF; --amber:#F5B62E; --amber-d:#D98E12;
    --red:#E4572E; --ink:#1E2E22; --ink-s:#4A5C4E;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    min-height:100vh;
    background:radial-gradient(ellipse at 50% -10%, var(--bg-mid) 0%, var(--bg-deep) 65%) fixed;
    font-family:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN W4","M PLUS Rounded 1c",
                "Hiragino Kaku Gothic ProN",sans-serif;
    color:var(--cream);
    -webkit-text-size-adjust:100%;
    -webkit-user-select:none; user-select:none;
  }
  #app{max-width:460px; margin:0 auto; padding:calc(18px + env(safe-area-inset-top)) 18px
        calc(40px + env(safe-area-inset-bottom)); position:relative; z-index:1;}
  .deco{position:fixed; pointer-events:none; z-index:0; opacity:.15;}
  .deco.tl{top:-30px; left:-30px; font-size:90px; transform:rotate(30deg);}
  .deco.br{bottom:-20px; right:-25px; font-size:100px; transform:rotate(-140deg);}
  .fly{position:fixed; border-radius:50%; background:var(--amber); pointer-events:none; z-index:0;
       animation:fly 5s ease-in-out infinite; opacity:.7;}
  @keyframes fly{0%,100%{transform:translate(0,0);opacity:.5}50%{transform:translate(12px,-18px);opacity:1}}
  @keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
  @keyframes wig{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
  @keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  h1{font-size:29px; font-weight:800; margin:6px 0 2px; letter-spacing:2px;}
  h2{font-size:21px; font-weight:800; text-align:center; margin:8px 0 4px;}
  .center{text-align:center}
  .rise{animation:rise .35s ease}
  .wig{display:inline-block; animation:wig 2.5s ease-in-out infinite}

  .panel{background:rgba(0,0,0,.3); border:1px solid rgba(93,187,127,.35);
         border-radius:20px; padding:15px 17px;}
  .row{display:flex; justify-content:space-between; font-weight:800; font-size:15px;}
  .bar{width:100%; height:12px; border-radius:12px; background:rgba(0,0,0,.35);
       overflow:hidden; border:1px solid rgba(93,187,127,.3);}
  .bar>i{display:block; height:100%; border-radius:12px;
         background:linear-gradient(90deg,var(--leaf-l),var(--amber));
         transition:width .6s cubic-bezier(.2,.8,.3,1);}

  button{font-family:inherit; cursor:pointer; border:none;}
  .btn{font-weight:800; font-size:17px; padding:15px 24px; border-radius:999px;
       background:var(--amber); color:#3A2A05; box-shadow:0 5px 0 rgba(0,0,0,.3);
       width:100%; display:block; margin-top:10px; transition:transform .1s;}
  .btn:active{transform:translateY(3px)}
  .btn.green{background:var(--leaf-l); color:#0A2416}
  .btn.ghost{background:rgba(93,187,127,.2); color:var(--cream); border:2px solid var(--leaf-l)}
  .btn.flat{background:transparent; color:var(--cream-d); box-shadow:none; font-size:14px; padding:8px}

  .course{font-family:inherit; font-weight:800; font-size:15px; text-align:left; width:100%;
          padding:13px 16px; border-radius:14px; border:2px solid rgba(93,187,127,.5);
          background:rgba(93,187,127,.14); color:var(--cream); margin-top:8px;}

  .card{background:var(--cream); color:var(--ink); border-radius:20px;
        padding:17px 18px 15px; box-shadow:0 6px 0 rgba(0,0,0,.35); margin-top:16px;}
  .passage{background:#E7F3E5; border:1.5px dashed var(--leaf); border-radius:12px;
           padding:10px 12px; font-size:15px; line-height:1.8; margin-bottom:12px;}
  .qlabel{font-size:12px; font-weight:800; color:var(--leaf); letter-spacing:1px;}
  .qtext{font-size:17px; font-weight:800; line-height:1.7; margin-top:4px;}

  .opt{font-weight:700; font-size:15px; line-height:1.6; text-align:left; width:100%;
       padding:13px 15px; border-radius:14px; border:2px solid transparent;
       background:rgba(247,243,227,.95); color:var(--ink); margin-top:9px;}
  .opt.ok{background:#DFF5D8; border-color:var(--leaf-l)}
  .opt.ng{background:#FBE0D6; border-color:var(--red); color:#8A2E12}
  .opt.dim{background:rgba(247,243,227,.45)}

  .fb{border-radius:16px; padding:12px 15px; font-weight:800; font-size:15px;
      line-height:1.7; margin-top:14px; animation:pop .35s ease;}
  .fb.good{background:rgba(93,187,127,.2); border:2px solid var(--leaf-l)}
  .fb.bad{background:rgba(228,87,46,.18); border:2px solid var(--red)}
  .hint{font-weight:700; font-size:13px; margin-top:6px; color:var(--cream-d)}

  .grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:8px;}
  .bug{border-radius:16px; padding:13px 9px; text-align:center;
       background:rgba(0,0,0,.35); color:var(--cream-d); border:1px solid rgba(93,187,127,.25);}
  .bug.got{background:var(--cream); color:var(--ink); border:2px solid var(--amber)}
  .bug .e{font-size:36px; filter:grayscale(1) brightness(.35)}
  .bug.got .e{filter:none}
  .bug .n{font-weight:800; font-size:13px; margin-top:4px}
  .bug .d{font-size:11px; margin-top:3px; line-height:1.5; min-height:30px}

  .pet{background:linear-gradient(160deg,#164A2C,#0D2E1B); border:2px solid var(--leaf);
       border-radius:20px; padding:14px 16px; margin-top:14px; text-align:center;}
  .pet .stage{font-size:11px; font-weight:800; color:var(--leaf-l); letter-spacing:1px}
  .pet .big{font-size:62px; line-height:1.15; margin:2px 0}
  .pet .nm{font-weight:800; font-size:17px}
  .pet .sz{font-size:12px; color:var(--cream-d); margin-bottom:8px}
  .jelly{display:inline-block; background:rgba(245,182,46,.16); border:1px solid var(--amber);
         border-radius:999px; padding:3px 13px; font-size:13px; font-weight:800; color:var(--amber);}
  .statrow{display:flex; align-items:center; gap:8px; margin-top:7px; font-size:12px; font-weight:700}
  .statrow .lbl{width:78px; flex:none; color:var(--cream-d)}
  .statrow .num{width:46px; flex:none; text-align:right; color:var(--amber)}
  .review{background:rgba(228,87,46,.16); border-color:var(--red)!important; color:var(--cream)}
  .rules{font-size:13px; line-height:1.8; color:var(--cream-d);
         background:rgba(0,0,0,.2); border-radius:14px; padding:12px 15px; margin-top:20px;}
  .amber{color:var(--amber)} .green{color:var(--leaf-l)}
  .mini{font-size:12px; color:#7FA891; text-align:center; margin-top:18px; line-height:1.9}
  .mini button{background:none; color:#7FA891; font-size:12px; text-decoration:underline; padding:2px 6px}
  textarea{width:100%; height:110px; font-size:12px; border-radius:10px; padding:8px;
           border:1px solid var(--leaf); background:#0F3020; color:var(--cream);
           font-family:monospace; -webkit-user-select:text; user-select:text;}
</style>
</head>
<body>
<div class="deco tl">🌿</div><div class="deco br">🌿</div>
<div id="app"></div>

/* ========= 状態 ========= */
const KEY="souma-jungle-v1";
let S={total:0, jelly:0, pet:{gen:0,exp:0}, dex:[], miss:{}, stats:{},
       screen:"home", course:"all", round:[], qi:0, step:0,
       opts:[], fb:null, roundPt:0, roundJelly:0, streak:0, newBugs:[], fixed:[], prev:0, mode:"quiz"};

Q.forEach(function(q,i){ q.id=i; });

function load(){
  try{
    const d=JSON.parse(localStorage.getItem(KEY)||"{}");
    S.total=d.total||0; S.jelly=d.jelly||0; S.dex=d.dex||[];
    S.miss=d.miss||{}; S.stats=d.stats||{};
    S.pet=d.pet||{gen:0,exp:0};
  }catch(e){}
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify({
    total:S.total, jelly:S.jelly, pet:S.pet, dex:S.dex, miss:S.miss, stats:S.stats,
    saved:new Date().toISOString()})); }catch(e){}
}

/* ---- ペット ---- */
function species(){ return SPECIES[S.pet.gen % SPECIES.length]; }
function stageOf(exp){
  if(exp>=GROWN) return {e:species().e, n:"成虫", need:GROWN, grown:true};
  let st=STAGES[0];
  for(let i=0;i<STAGES.length;i++) if(exp>=STAGES[i].need) st=STAGES[i];
  return st;
}
function feed(n){
  n=Math.min(n, S.jelly);
  if(n<=0) return;
  S.jelly-=n; S.pet.exp=Math.min(GROWN, S.pet.exp+n*5);
  save(); render();
}
function graduate(){
  const sp=species();
  S.dex.push(sp.n);
  S.pet={gen:S.pet.gen+1, exp:0};
  save(); render();
  alert(sp.n+" を図鑑にいれました！\nあたらしいたまごをもらいました🥚");
}

/* ---- 成績・復習 ---- */
function recordStat(type, ok){
  if(!S.stats[type]) S.stats[type]={a:0,c:0};
  S.stats[type].a++; if(ok) S.stats[type].c++;
}
function missCount(){ return Object.keys(S.miss).length; }
function startReview(){
  const ids=Object.keys(S.miss).sort(function(a,b){ return S.miss[b]-S.miss[a]; }).slice(0,5);
  if(!ids.length) return;
  S.course="review"; S.mode="quiz"; S.round=shuffle(ids.map(function(i){ return Q[+i]; }));
  S.qi=0; S.step=0; S.opts=buildOpts(S.round[0],0);
  S.fb=null; S.roundPt=0; S.roundJelly=0; S.streak=0; S.newBugs=[]; S.fixed=[]; S.marked=false; S.prev=S.total;
  S.screen="quiz"; render(); window.scrollTo(0,0);
}
const shuffle=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

/* ========= ロジック ========= */
function buildOpts(q,s){
  if(s<3){
    const key=STEP_KEY[s], i=TYPE_INDEX[q.t], pool=POOL[key];
    const wrong=shuffle(pool.filter((_,k)=>k!==i)).slice(0,3);
    return shuffle([{l:pool[i],ok:1}].concat(wrong.map(w=>({l:w,ok:0,n:"正解は「"+pool[i]+"」"}))));
  }
  return shuffle(q.a.map(x=>({l:x.t, ok:x.ok?1:0, n:x.n})));
}
function startRound(ck){
  const c=COURSES.find(x=>x.k===ck)||COURSES[0];
  const pool=c.t? Q.filter(x=>c.t.includes(x.t)) : Q;
  S.course=ck; S.mode="quiz"; S.round=shuffle(pool).slice(0,5);
  S.qi=0; S.step=0; S.opts=buildOpts(S.round[0],0);
  S.fb=null; S.roundPt=0; S.roundJelly=0; S.streak=0; S.newBugs=[]; S.fixed=[]; S.marked=false; S.prev=S.total;
  S.screen="quiz"; render();
}
function startVocab(){
  S.mode="vocab";
  S.round=shuffle(VOCAB).slice(0,10).map(v=>({
    q:v[0], opts:shuffle(v[1].map((t,i)=>({l:t, ok:i===0?1:0})))
  }));
  S.qi=0; S.fb=null; S.roundPt=0; S.roundJelly=0; S.streak=0; S.newBugs=[]; S.fixed=[]; S.prev=S.total;
  S.screen="vocab"; render();
}
function pick(i){
  if(S.fb) return;
  const o = S.mode==="vocab" ? S.round[S.qi].opts[i] : S.opts[i];
  const base = S.mode==="vocab" ? 8 : (S.step<3?10:20);
  const gain = o.ok ? base + (S.streak>=2?5:0) : 0;
  if(o.ok){ S.roundPt+=gain; S.streak++; S.total+=gain; } else { S.streak=0; }

  if(S.mode==="vocab"){
    if(o.ok) S.roundJelly++;
  } else {
    const q=S.round[S.qi];
    recordStat(q.t, !!o.ok);
    if(o.ok){
      if(S.step===3){
        S.roundJelly++;
        if(S.miss[q.id]){
          S.miss[q.id]--;
          if(S.miss[q.id]<=0){ delete S.miss[q.id]; S.fixed.push(q.t); }
        }
      }
    } else if(!S.marked){
      S.miss[q.id]=Math.min(2,(S.miss[q.id]||0)+1); S.marked=true;
    }
  }
  save();
  S.fb={ok:o.ok, i:i, n:o.n, gain:gain};
  render();
}
function next(){
  S.fb=null;
  if(S.mode==="vocab"){
    if(S.qi<S.round.length-1){ S.qi++; } else { finish(); return; }
  } else if(S.step<3){
    S.step++; S.opts=buildOpts(S.round[S.qi],S.step);
  } else if(S.qi<S.round.length-1){
    S.qi++; S.step=0; S.marked=false; S.opts=buildOpts(S.round[S.qi],0);
  } else { finish(); return; }
  render(); window.scrollTo(0,0);
}
function finish(){
  S.roundJelly+=1;
  S.jelly+=S.roundJelly; save();
  S.newBugs=BUGS.filter(b=>S.prev<b.p && S.total>=b.p);
  S.screen="result"; render(); window.scrollTo(0,0);
}

/* ========= バックアップ ========= */
function exportData(){
  const blob=new Blob([JSON.stringify({app:"setsumon-jungle",total:S.total,jelly:S.jelly,
    pet:S.pet,dex:S.dex,miss:S.miss,stats:S.stats,exported:new Date().toISOString()},null,2)],
    {type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="setsumon-jungle-backup.json";
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function importData(){
  const txt=prompt("バックアップのJSONを貼りつけてください");
  if(!txt) return;
  try{
    const d=JSON.parse(txt);
    if(typeof d.total!=="number") throw 0;
    S.total=d.total; S.jelly=d.jelly||0; S.pet=d.pet||{gen:0,exp:0};
    S.dex=d.dex||[]; S.miss=d.miss||{}; S.stats=d.stats||{};
    save(); render();
    alert("復元しました（"+d.total+" pt）");
  }catch(e){ alert("読みこめませんでした"); }
}
function resetData(){
  if(confirm("ポイント・図鑑・そだてた虫をぜんぶ消します。よろしいですか？")){
    S.total=0; S.jelly=0; S.pet={gen:0,exp:0}; S.dex=[]; S.miss={}; S.stats={};
    save(); render();
  }
}

/* ========= 描画 ========= */
function bar(v,m,h){
  h=h||12;
  const pct=Math.max(0,Math.min(100, m? v/m*100 : 0));
  return '<div class="bar" style="height:'+h+'px"><i style="width:'+pct+'%"></i></div>';
}
function optHTML(list, fb){
  return list.map((o,i)=>{
    let c="opt";
    if(fb){ if(o.ok) c+=" ok"; else if(i===fb.i) c+=" ng"; else c+=" dim"; }
    const mark = fb ? (o.ok?"✅ ":(i===fb.i?"❌ ":"")) : "";
    return '<button class="'+c+'" data-pick="'+i+'"'+(fb?" disabled":"")+'>'+mark+esc(o.l)+'</button>';
  }).join("");
}
function fbHTML(rule){
  const f=S.fb; if(!f) return "";
  const praise=PRAISE[Math.floor(Math.random()*PRAISE.length)];
  let body = f.ok
    ? praise+' <span class="amber">+'+f.gain+' pt</span>'+(S.streak>=3?' 🔥連続ボーナス中！':'')
    : 'ざんねん！ '+esc(f.n||"");
  return '<div class="fb '+(f.ok?"good":"bad")+'">'+body+
    (rule?'<div class="hint">💡 '+esc(rule)+'</div>':'')+'</div>'+
    '<button class="btn" data-next="1">'+nextLabel()+'</button>';
}
function nextLabel(){
  if(S.mode==="vocab") return S.qi<S.round.length-1 ? "つぎへ ▶" : "けっかを見る 🏆";
  if(S.step<3) return "つぎへ ▶";
  return S.qi<S.round.length-1 ? "つぎの問題へ ▶" : "けっかを見る 🏆";
}

function render(){
  const app=document.getElementById("app");
  const got=BUGS.filter(b=>S.total>=b.p).length;
  const nb=BUGS.find(b=>S.total<b.p);
  const prevP = nb ? (BUGS[BUGS.indexOf(nb)-1]||{p:0}).p : 0;
  let h="";

  if(S.screen==="home"){
    h+='<div class="rise"><div class="center" style="margin-top:18px">'+
       '<div class="wig" style="font-size:60px">🪲</div>'+
       '<h1>設問ジャングル</h1>'+
       '<div class="green" style="font-weight:700;font-size:13px">〜 そうまのぼうけん 〜</div></div>';
    h+='<div class="panel" style="margin-top:22px">'+
       '<div class="row"><span>🍃 ジャングルポイント</span><span class="amber">'+S.total+' pt</span></div>'+
       '<div class="row" style="margin-top:7px"><span>🎒 コレクション</span><span class="green">'+got+' / '+BUGS.length+' ひき</span></div>';
    if(nb){
      h+='<div style="margin-top:13px"><div style="font-size:12.5px;font-weight:700;margin-bottom:6px;color:var(--cream-d)">'+
         'つぎのなかま：'+nb.e+' '+nb.n+'（あと '+(nb.p-S.total)+' pt）</div>'+bar(S.total-prevP, nb.p-prevP)+'</div>';
    } else {
      h+='<div class="amber center" style="margin-top:12px;font-weight:800">👑 全部ゲット！きみがジャングルの王者だ！</div>';
    }
    h+='</div>';

    const sp=species(), st=stageOf(S.pet.exp);
    h+='<div class="pet"><div class="stage">そだてているムシ　第'+(S.pet.gen+1)+'代</div>'+
       '<div class="big wig">'+st.e+'</div>'+
       '<div class="nm">'+esc(sp.n)+'</div>'+
       '<div class="sz">'+esc(st.n)+'　'+Math.round(sp.max*Math.min(1,S.pet.exp/GROWN))+' / '+sp.max+' mm</div>'+
       bar(S.pet.exp, GROWN, 10)+
       '<div style="margin-top:10px"><span class="jelly">🍮 ゼリー '+S.jelly+'こ</span></div>'+
       (st.grown
         ? '<button class="btn" data-act="graduate" style="margin-top:10px">👑 成虫になった！図鑑にいれる</button>'
         : (S.jelly>0
            ? '<button class="btn green" data-feed="1" style="margin-top:10px">🍮 ゼリーをあげる（1こ）</button>'+
              (S.jelly>1?'<button class="btn ghost" data-feed="'+S.jelly+'">まとめて '+S.jelly+'こ あげる</button>':'')
            : '<div style="font-size:12px;color:var(--cream-d);margin-top:10px">ぼうけんに行くとゼリーがもらえる</div>'))+
       '</div>';

    h+='<div class="amber" style="margin-top:20px;font-size:13px;font-weight:800">▶ コースをえらぶ</div>';
    if(missCount()) h+='<button class="course review" data-act="review">🩹 まちがい直し（'+missCount()+'問たまってる）</button>';
    h+=COURSES.map(c=>'<button class="course" data-course="'+c.k+'">'+c.l+'</button>').join("");
    h+='<button class="btn green" data-vocab="1" style="margin-top:14px">🕯️ ことばの洞窟（10問・語彙）</button>';
    h+='<button class="btn ghost" data-screen="zukan">📖 いきもの図鑑</button>';
    h+='<button class="btn ghost" data-screen="stats">📊 じぶんのきろく</button>';
    h+='<div class="rules"><b class="amber">ルール</b>：設問を見たら3つに分ける！<br>'+
       '① なにを聞いてる？　② どこを見る？　③ どう答える？<br>'+
       '<span class="green">※ 選ぶ前にかならず口に出す！</span><br>'+
       '正解 <b class="amber">+10pt</b>／答えの文 <b class="amber">+20pt</b>／3連続で <b>🔥ボーナス</b></div>';
    h+='<div class="mini">きろくはこの端末に保存されます<br>'+
       '<button data-act="export">バックアップ保存</button>・'+
       '<button data-act="import">復元</button>・'+
       '<button data-act="reset">リセット</button></div></div>';
  }

  else if(S.screen==="zukan"){
    h+='<div class="rise"><h2>📖 エクアドル・いきもの図鑑</h2>'+
       '<div class="center green" style="font-weight:700;font-size:13px">'+got+' / '+BUGS.length+' ひき発見ずみ</div>'+
       '<div class="grid">'+BUGS.map(b=>{
         const g=S.total>=b.p;
         return '<div class="bug'+(g?" got":"")+'"><div class="e">'+(g?b.e:"❓")+'</div>'+
                '<div class="n">'+(g?b.n:"？？？")+'</div>'+
                '<div class="d">'+(g?b.d:b.p+" pt でゲット")+'</div></div>';
       }).join("")+'</div>'+
       '<button class="btn ghost" data-screen="home" style="margin-top:16px">← もどる</button></div>';
  }

  else if(S.screen==="stats"){
    h+='<div class="rise"><h2>📊 じぶんのきろく</h2>'+
       '<div class="center green" style="font-weight:700;font-size:13px;margin-bottom:10px">型べつの正かい率</div>'+
       '<div class="panel">';
    const types=["理由","気持ち","内容説明","抜き出し","指示語","つなぎ言葉"];
    let any=false;
    types.forEach(function(t){
      const d=S.stats[t];
      if(!d||!d.a) return;
      any=true;
      const pct=Math.round(d.c/d.a*100);
      h+='<div class="statrow"><span class="lbl">'+t+'</span>'+bar(pct,100,9)+'<span class="num">'+pct+'%</span></div>';
    });
    if(!any) h+='<div style="font-size:13px;color:var(--cream-d)">まだきろくがありません。ぼうけんに行こう！</div>';
    h+='</div>';
    h+='<div class="panel" style="margin-top:14px"><div class="row" style="font-size:14px">'+
       '<span>🩹 まちがい直しリスト</span><span class="amber">'+missCount()+' 問</span></div>'+
       '<div style="font-size:12px;color:var(--cream-d);margin-top:6px;line-height:1.7">'+
       'まちがえた問題がここにたまる。正かいするとリストから消える。<br>'+
       '2回まちがえた問題は、2回正かいするまで残るよ。1問につき1回ずつたまる。</div>'+
       (missCount()?'<button class="btn" data-act="review" style="margin-top:10px">🩹 まちがい直しをやる</button>':'')+
       '</div>';
    h+='<div class="panel" style="margin-top:14px"><div class="row" style="font-size:14px">'+
       '<span>🏅 そだてた虫</span><span class="green">'+S.dex.length+' ひき</span></div>'+
       '<div style="font-size:12.5px;color:var(--cream-d);margin-top:6px;line-height:1.8">'+
       (S.dex.length? S.dex.map(function(n){return "🪲 "+esc(n);}).join("<br>") : "まだいません")+
       '</div></div>';
    h+='<button class="btn ghost" data-screen="home" style="margin-top:16px">← もどる</button></div>';
  }

  else if(S.screen==="result"){
    h+='<div class="rise center" style="margin-top:26px"><div style="font-size:56px">🏆</div>'+
       '<h2>クリア！</h2>'+
       '<div class="amber" style="font-size:18px;font-weight:800">+'+S.roundPt+' pt ゲット！</div>'+
       '<div style="color:var(--cream-d);font-weight:700;font-size:14px;margin-top:4px">ごうけい '+S.total+' pt</div>'+
       '<div style="margin-top:10px"><span class="jelly">🍮 ゼリーを '+S.roundJelly+'こ ゲット！</span></div>';
    if(S.fixed.length){
      h+='<div style="margin-top:12px;font-size:13px;font-weight:800;color:var(--leaf-l)">'+
         '💪 「'+S.fixed.filter(function(v,i,a){return a.indexOf(v)===i;}).join("」「")+'」を克服！</div>';
    }
    if(missCount()){
      h+='<div style="margin-top:8px;font-size:12.5px;color:var(--cream-d)">🩹 まちがい直しリスト：'+missCount()+'問</div>';
    }
    if(S.newBugs.length){
      h+='<div style="margin-top:20px;background:var(--cream);color:var(--ink);border-radius:20px;'+
         'padding:18px 16px;border:3px solid var(--amber);animation:pop .5s ease">'+
         '<div style="font-weight:800;color:var(--amber-d);font-size:15px">✨ あたらしいなかま発見！ ✨</div>'+
         S.newBugs.map(b=>'<div style="margin-top:10px"><div class="wig" style="font-size:52px">'+b.e+'</div>'+
           '<div style="font-weight:800;font-size:17px">'+b.n+'</div>'+
           '<div style="font-size:12.5px;color:var(--ink-s)">'+b.d+'</div></div>').join("")+'</div>';
    }
    if(nb) h+='<div style="margin-top:18px;font-size:13px;font-weight:700;color:var(--cream-d)">つぎは '+nb.e+' '+nb.n+'！ あと '+(nb.p-S.total)+' pt！</div>';
    h+='<button class="btn" '+(S.course==="review"?'data-act="review"':'data-course="'+S.course+'"')+'>🔁 もう1回！</button>'+
       (missCount()&&S.course!=="review"?'<button class="btn ghost" data-act="review">🩹 まちがい直し（'+missCount()+'問）</button>':'')+
       '<button class="btn green" data-vocab="1">🕯️ ことばの洞窟へ</button>'+
       '<button class="btn flat" data-screen="home">ホームへ</button></div>';
  }

  else if(S.screen==="vocab"){
    const v=S.round[S.qi];
    h+='<div class="rise"><div class="row" style="font-size:13px"><span>🕯️ ことばの洞窟 '+(S.qi+1)+' / '+S.round.length+'</span>'+
       '<span class="amber">'+(S.streak>=3?"🔥🔥":S.streak>=2?"🔥":"")+' +'+S.roundPt+' pt</span></div>'+
       '<div style="margin-top:8px">'+bar(S.qi+(S.fb?1:0), S.round.length, 8)+'</div>'+
       '<div class="card center"><div class="qlabel">これは、なんのサイン？</div>'+
       '<div class="qtext">'+esc(v.q)+'</div></div>'+
       '<div style="margin-top:7px">'+optHTML(v.opts,S.fb)+'</div>'+
       (S.fb?fbHTML(null):"")+'</div>';
  }

  else { /* quiz */
    const q=S.round[S.qi], isAns=S.step===3;
    h+='<div class="rise"><div class="row" style="font-size:13px"><span>'+(S.course==="review"?"🩹 まちがい直し ":"もんだい ")+(S.qi+1)+' / '+S.round.length+'</span>'+
       '<span class="amber">'+(S.streak>=3?"🔥🔥":S.streak>=2?"🔥":"")+' +'+S.roundPt+' pt</span></div>'+
       '<div style="margin-top:8px">'+bar(S.qi*4+S.step+(S.fb?1:0), S.round.length*4, 8)+'</div>'+
       '<div class="card">'+
       (isAns?'<div class="passage">📜 '+esc(q.p)+'</div>':'')+
       '<div class="qlabel">設問</div><div class="qtext">'+esc(q.q)+'</div></div>'+
       '<div class="amber" style="margin-top:16px;font-weight:800;font-size:16px">'+
       (isAns?"🎯 答えをえらべ！":STEP_LABEL[S.step])+'</div>'+
       optHTML(S.opts,S.fb)+
       (S.fb?fbHTML(TYPE_RULES[q.t]):"")+'</div>';
  }

  app.innerHTML=h;
}

/* ========= イベント ========= */
document.addEventListener("click",function(ev){
  const b=ev.target.closest("button"); if(!b) return;
  if(b.dataset.pick!==undefined) return pick(+b.dataset.pick);
  if(b.dataset.next) return next();
  if(b.dataset.course) return startRound(b.dataset.course);
  if(b.dataset.vocab) return startVocab();
  if(b.dataset.screen){ S.screen=b.dataset.screen; render(); window.scrollTo(0,0); return; }
  if(b.dataset.feed) return feed(+b.dataset.feed);
  if(b.dataset.act==="graduate") return graduate();
  if(b.dataset.act==="review") return startReview();
  if(b.dataset.act==="export") return exportData();
  if(b.dataset.act==="import") return importData();
  if(b.dataset.act==="reset") return resetData();
});

/* ホタル */
[[8,18,0,6],[85,12,1.4,5],[70,70,.7,7],[18,82,2.1,5],[50,40,2.8,4]].forEach(f=>{
  const d=document.createElement("div");
  d.className="fly";
  d.style.cssText="left:"+f[0]+"%;top:"+f[1]+"%;width:"+f[3]+"px;height:"+f[3]+"px;"+
    "animation-delay:"+f[2]+"s;box-shadow:0 0 "+(f[3]*2)+"px "+f[3]+"px rgba(245,182,46,.35)";
  document.body.appendChild(d);
});

load(); render();
</script>
</body>
</html>
