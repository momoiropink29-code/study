<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --ink:#33302B; --red:#C2452D; --cream:#FCFAF3; --line:#E5E0CE; --green:#3E8E5F; --blue:#3A6EA5; --gray:#8d8871; --gold:#C99A2E; }
  body { background: var(--cream); color: var(--ink); font-family: 'Hiragino Maru Gothic ProN','ヒラギノ丸ゴ ProN W4','Hiragino Sans','Yu Gothic',sans-serif; -webkit-text-size-adjust: 100%; }
  button { font-family: inherit; cursor: pointer; }
  input, select { font-family: inherit; }
  header { border-bottom: 3px solid var(--ink); padding: 14px 16px; }
  .wrap { max-width: 660px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  h1 { font-weight: 900; font-size: 21px; }
  h1 .mark { background: var(--red); color: #fff; border-radius: 8px; padding: 3px 10px; margin-right: 8px; }
  h1 small { font-size: 12px; font-weight: 700; color: var(--gray); margin-left: 8px; }
  main { max-width: 660px; margin: 0 auto; padding: 18px 16px 60px; }
  .card { background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 14px; }
  .menuBtn { border: 2px solid var(--ink); background: #fff; border-radius: 999px; padding: 5px 14px; font-weight: 900; font-size: 12px; }
  .masu { background: #fff; background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 28px 28px; border: 3px solid var(--ink); border-radius: 16px; padding: 28px 18px; text-align: center; margin-bottom: 14px; }
  .btn { border: none; border-radius: 12px; font-weight: 900; color: #fff; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .bar-bg { background: #F1EDDD; border-radius: 999px; height: 18px; overflow: hidden; }
  .bar { height: 100%; background: var(--red); border-radius: 999px; transition: width .4s; }
  .judge { border-radius: 12px; margin-top: 8px; padding: 14px; text-align: center; }
  .pt { background: var(--gold); color: #fff; font-weight: 900; border-radius: 999px; padding: 4px 14px; font-size: 14px; display: inline-block; }
  .pet { background: #fff; border: 2px solid var(--line); border-radius: 14px; padding: 10px; text-align: center; width: 104px; }
  .pet .face { font-size: 40px; line-height: 1.2; }
  .pet .nm { font-weight: 900; font-size: 12px; }
  .pet .lv { font-size: 10px; font-weight: 700; color: var(--gray); }
  .feed { background: var(--green); color: #fff; border: none; border-radius: 8px; font-weight: 900; font-size: 11px; padding: 4px 8px; margin-top: 4px; }
  .weakItem { background: #fff; border: 2px solid var(--line); border-left: 8px solid var(--red); border-radius: 12px; padding: 10px 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; }
  .hidden { display: none; }
  select { border: 2px solid var(--ink); border-radius: 10px; padding: 9px 10px; font-weight: 900; font-size: 14px; background: #fff; width: 100%; }
  .sent { font-size: 20px; font-weight: 700; line-height: 1.9; text-align: left; }
  .sent b { color: var(--red); background: #FBECE8; border-radius: 6px; padding: 0 4px; }
  a.link { color: var(--blue); font-weight: 900; font-size: 13px; text-decoration: underline; background: none; border: none; }
</style>
</head>

const SAVE_KEY = "kanji5-save-v1";
const $ = (s,el=document)=>el.querySelector(s);
const shuffle=(arr)=>{const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const norm=(s)=>(s||"").trim().replace(/\s/g,"").replace(/[ァ-ン]/g,(c)=>String.fromCharCode(c.charCodeAt(0)-0x60));
const todayStr=()=>{const d=new Date();const p=(n)=>String(n).padStart(2,"0");return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;};
const escS=(s)=>String(s).replace(/</g,"&lt;");

let save = { stats:{}, pts:0, total:0, pets:[] };
const pad2=(n)=>String(n).padStart(2,"0");
const dayStr=()=>{const d=new Date();return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;};
const addDays=(n)=>{const d=new Date();d.setDate(d.getDate()+n);return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;};
// 間隔反復:正解ごとに 1日→3日→1週間→2週間→1か月 と間をあけて再出題
const IV=[1,3,7,14,30];
function schedule(st,ok){
  if(ok){ st.box=Math.min((st.box||0)+1,5); st.due=addDays(IV[Math.min(st.box-1,4)]); }
  else { st.box=0; st.due=dayStr(); }
}
function dueItems(){
  const t=dayStr();
  return ALL.filter(i=>!i.taisaku).filter(i=>{const s=save.stats[i.id];return s&&s.due&&s.due<=t;})
            .sort((a,b)=>(save.stats[a.id].box||0)-(save.stats[b.id].box||0));
}
function load(){
  try{ const r=localStorage.getItem(SAVE_KEY); if(r) save={...save,...JSON.parse(r)}; }catch(e){}
  // これまでの成績を間隔反復に引き継ぐ(box/dueが無いデータを変換)
  let migrated=false;
  Object.keys(save.stats).forEach(k=>{
    const st=save.stats[k];
    if(st && st.box===undefined){
      st.box = (st.c>st.w) ? Math.min(st.c,3) : 0;   // 正解が多い字はある程度進んだ状態から
      st.due = dayStr();                              // まずは一度チェックする
      migrated=true;
    }
  });
  if(migrated) persist();
}
function persist(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){} }

const EGG_N = 50, EGG_R = 150, FEED_COST = 30, MAX_LV = 9;
const petStage=(lv)=> lv>=7?2 : lv>=4?1 : 0;
function buyEgg(kind){
  const cost = kind==="rare" ? EGG_R : EGG_N;
  if(save.pts < cost) return;
  save.pts -= cost;
  const rareWanted = kind==="rare" ? Math.random()<0.65 : Math.random()<0.15;
  let cand = CHAINS.map((x,i)=>i).filter(i=>!!CHAINS[i].r===rareWanted);
  if(!cand.length) cand = CHAINS.map((x,i)=>i);
  const nw = cand.filter(i=>!save.pets.some(p=>p.c===i));
  const from = nw.length && Math.random()<0.8 ? nw : cand;
  const c = from[Math.floor(Math.random()*from.length)];
  save.pets.push({c, lv:1, n:CHAINS[c].n + (save.pets.filter(p=>p.c===c).length+1 > 1 ? save.pets.filter(p=>p.c===c).length+1 : "")});
  persist(); render();
  setTimeout(()=>alert("たまごがかえった!「"+save.pets[save.pets.length-1].n+"」がなかまになったよ "+CHAINS[c].e[0]),50);
}
function feed(i){
  const p = save.pets[i];
  if(!p || save.pts < FEED_COST || p.lv >= MAX_LV) return;
  const before = petStage(p.lv);
  save.pts -= FEED_COST; p.lv++;
  persist(); render();
  if(petStage(p.lv) > before) setTimeout(()=>alert("🎉 "+p.n+"がしんかした! "+CHAINS[p.c].e[petStage(p.lv)]),50);
}
function renamePet(i){
  const nm = prompt("なまえをかえる", save.pets[i].n);
  if(nm && nm.trim()){ save.pets[i].n = nm.trim().slice(0,8); persist(); render(); }
}

// ===== クイズ状態 =====
let screen="menu", mode="kaki", rangeV="taisaku";
let queue=[], idx=0, phase="ask", lastCorrect=null;
let isRetry=false, retryRound=0;
let session={c:0,w:0,wrongs:[],pt:0};

function pool(v){
  if(v==="taisaku") return ALL.filter(i=>i.taisaku);
  if(v==="t1all") return ALL.filter(i=>i.term===1);
  if(v==="t2all") return ALL.filter(i=>i.term===2);
  if(v==="all") return ALL.filter(i=>!i.taisaku);
  if(v==="weak") return ALL.filter(i=>{const s=save.stats[i.id];return s&&s.w>0&&s.w>=s.c;});
  if(v==="today"){
    let p=dueItems();
    if(p.length<10){ const rest=shuffle(ALL.filter(i=>!i.taisaku&&!save.stats[i.id])); p=p.concat(rest.slice(0,10-p.length)); }
    return p;
  }
  const u1=U1.find(u=>u.v===v); if(u1) return ALL.filter(i=>i.term===1).slice(u1.a,u1.b);
  const u2=U2.find(u=>u.v===v); if(u2) return ALL.filter(i=>i.term===2).slice(u2.a,u2.b);
  return [];
}
const pickWord=(it)=>{const x=it.ws[Math.floor(Math.random()*it.ws.length)];return {w:x[0],y:x[1]};};
function start(){
  rangeV = $("#rangeSel") ? $("#rangeSel").value : rangeV;
  mode = $("#modeSel") ? $("#modeSel").value : mode;
  let p = pool(rangeV);
  if(!p.length){ alert("このはんいには問題がありません。"); return; }
  const t=dayStr();
  if(rangeV!=="today"){
    p = shuffle(p).sort((a,b)=>{
      const sa=save.stats[a.id], sb=save.stats[b.id];
      const pa=sa?(sa.due&&sa.due<=t?0:2):1, pb=sb?(sb.due&&sb.due<=t?0:2):1; // 復習期限→未出題→まだ先
      return pa-pb;
    });
  }
  queue = shuffle(p.slice(0, Math.min(rangeV==="today"?10:20,p.length))).slice(0,10).map(it=> it.ws ? {...it, ...pickWord(it)} : it);
  isRetry=false; retryRound=0;
  idx=0; phase="ask"; lastCorrect=null; session={c:0,w:0,wrongs:[],pt:0};
  screen="quiz"; render();
}
function startRetry(){
  if(!session.wrongs.length) return;
  const items = session.wrongs.slice();
  isRetry=true; retryRound++;
  queue = items;                       // 出題は同じ言葉のまま
  idx=0; phase="ask"; lastCorrect=null;
  session={c:0,w:0,wrongs:[],pt:session.pt};
  screen="quiz"; render();
}
function record(item, ok){
  const s = save.stats[item.id]||{c:0,w:0,box:0,due:dayStr()};
  s.c+=ok?1:0; s.w+=ok?0:1;
  // なおしタイムの正解は「今おぼえただけ」なので間かくは進めず、明日また出す
  if(isRetry){ s.box=0; s.due=addDays(1); }
  else { schedule(s,ok); }
  save.stats[item.id]=s;
  if(ok){ session.c++; session.pt+=10; save.pts+=10; save.total+=10; }
  else { session.w++; session.wrongs.push(item); }
  persist();
}
function judgeYomi(){
  if(phase!=="ask") return;
  const cur=queue[idx];
  const ok = norm($("#ans").value)===cur.y;
  lastCorrect=ok; record(cur,ok); phase="judged"; render();
}
function judgeKaki(ok){ lastCorrect=ok; record(queue[idx],ok); phase="judged"; render(); }
function next(){
  if(idx+1>=queue.length){
    if(session.c===queue.length && queue.length>0){
      const b = isRetry?10:30;
      session.pt+=b; save.pts+=b; save.total+=b; persist();
    }
    screen="done";
  } else { idx++; phase="ask"; lastCorrect=null; }
  render();
}

// ===== 画面 =====
function petGarden(){
  let inner = save.pets.map((p,i)=>{
    const st=petStage(p.lv);
    return `<div class="pet">
      <div class="face">${CHAINS[p.c].e[st]}${p.lv>=MAX_LV?"✨":""}</div>
      <div class="nm" data-act="rename" data-i="${i}" style="cursor:pointer">${escS(p.n)}</div>
      <div class="lv">Lv.${p.lv}${p.lv>=MAX_LV?" マスター!":""}</div>
      ${p.lv<MAX_LV?`<button class="feed" data-act="feed" data-i="${i}" ${save.pts<FEED_COST?"disabled style='opacity:.5'":""}>えさ ${FEED_COST}pt</button>`:""}
    </div>`;
  }).join("");
  inner += `<div class="pet" style="border-style:dashed">
    <div class="face">🥚</div><div class="nm">たまご</div><div class="lv">なにがでるかな?</div>
    <button class="feed" style="background:var(--gold)" data-act="egg" data-kind="normal" ${save.pts<EGG_N?"disabled style='opacity:.5;background:var(--gold)'":""}>ふつう ${EGG_N}pt</button>
    <button class="feed" style="background:#8E5AA8;margin-top:2px" data-act="egg" data-kind="rare" ${save.pts<EGG_R?"disabled style='opacity:.5;background:#8E5AA8'":""}>レア ${EGG_R}pt</button>
  </div>`;
  return `<div class="card" style="margin-bottom:16px">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:8px">
      <p style="font-weight:900;font-size:14px">🌱 乙葉のまきば</p>
      <span class="pt">⭐ ${save.pts} pt</span>
    </div>
    <div class="row">${inner}</div>
    <div class="row" style="align-items:center;justify-content:space-between;margin-top:8px">
      <p style="font-size:11px;font-weight:700;color:var(--gray);flex:1;min-width:180px">正解1問=10pt・10問ぜんぶ正解=+30pt。えさでレベルアップ、Lv.4とLv.7でしんか!</p>
      <button class="feed" style="background:var(--blue)" data-act="zukan">ずかん ${new Set(save.pets.map(p=>p.c)).size}/${CHAINS.length}</button>
    </div>
  </div>`;
}

function renderMenu(){
  const items = ALL.filter(i=>!i.taisaku);
  const mastered = items.filter(i=>{const s=save.stats[i.id];return s&&(s.box||0)>=4;}).length;
  const dueCount = dueItems().length;
  const weakCount = pool("weak").length;
  const opts = `
    <optgroup label="★おすすめ">
      <option value="today">きょうの復習(わすれたころに出るおまかせ)</option>
      <option value="taisaku">夏やすみあけテスト対策(本番と同じ文)</option>
    </optgroup>
    <optgroup label="1学期のふくしゅう(常〜毒)">
      ${U1.map(u=>`<option value="${u.v}">${u.label}</option>`).join("")}
      <option value="t1all">1学期ぜんぶ(95字)</option>
    </optgroup>
    <optgroup label="2学期(提〜格)">
      ${U2.map(u=>`<option value="${u.v}">${u.label}</option>`).join("")}
      <option value="t2all">2学期ぜんぶ(98字)</option>
    </optgroup>
    <optgroup label="そのほか">
      <option value="all">5年生ぜんぶ(193字)</option>
      <option value="weak">にがてだけ(${weakCount}こ)</option>
    </optgroup>`;
  return `
  ${petGarden()}
  <div class="card" style="margin-bottom:16px">
    <p style="font-weight:900;font-size:14px;margin-bottom:6px">5年生の漢字 おぼえたじょうきょう</p>
    <div class="bar-bg"><div class="bar" style="width:${(mastered/193)*100}%;${mastered>0?"min-width:18px":""}"></div></div>
    <p style="font-weight:700;font-size:13px;margin-top:6px">おぼえた <b style="color:var(--red);font-size:18px">${mastered}</b> / 193字
      <span style="color:var(--gray);margin-left:8px">${dueCount>0?`復習まち ${dueCount}問`:"復習まちなし!"}</span></p>
    <p style="font-size:11px;font-weight:700;color:var(--gray);margin-top:2px">※1日→3日→1週間→2週間→1か月と間をあけて出題。4回連続で正解すると「おぼえた」!</p>
  </div>
  <div class="card">
    <p style="font-weight:900;font-size:14px;margin-bottom:6px">① 範囲</p>
    <select id="rangeSel" style="margin-bottom:12px">${opts}</select>
    <div id="modeWrap">
      <p style="font-weight:900;font-size:14px;margin-bottom:6px">② れんしゅうのしかた</p>
      <select id="modeSel">
        <option value="kaki" ${mode==="kaki"?"selected":""}>書きとり(読みを見て紙に書く)← テストはこっち!</option>
        <option value="yomi" ${mode==="yomi"?"selected":""}>読みクイズ(ひらがなで入力)</option>
      </select>
    </div>
    <p id="taisakuNote" class="hidden" style="font-size:12px;font-weight:700;color:var(--gray);margin-top:6px">※テスト対策は本番と同じ「書きとり」で出題されます</p>
    <button class="btn" style="width:100%;background:var(--red);padding:14px;font-size:16px;margin-top:12px" data-act="start">スタート!(10問)</button>
  </div>
  <div class="row" style="margin-top:14px;align-items:center">
    <button class="link" data-act="list">にがてリスト</button>
    <span style="color:var(--line)">|</span>
    <button class="link" data-act="backup">バックアップ・ふっかつ</button>
  </div>`;
}

function renderQuiz(){
  const cur=queue[idx];
  const isTaisaku = !!cur.taisaku;
  const isKaki = mode==="kaki" || isTaisaku; // 対策モードは常に書きとり
  let board="";
  if(isTaisaku){
    const sent = escS(cur.s).replace(/【(.+?)】/, '<b>$1</b>');
    board = `<p style="font-size:12px;font-weight:900;color:var(--gray);margin-bottom:10px">赤いところを漢字で紙に書こう(テストと同じ文!)</p>
      <p class="sent">${sent}</p>
      ${phase!=="ask"?`<p style="font-size:44px;font-weight:900;margin-top:12px;color:var(--red)">${cur.w}</p>`:""}`;
  } else if(isKaki){
    board = `<p style="font-size:12px;font-weight:900;color:var(--gray);margin-bottom:10px">紙に書いてみよう(「${cur.k}」の練習)</p>
      <p style="font-size:38px;font-weight:900;letter-spacing:.1em">${cur.y}</p>
      ${phase!=="ask"?`<p style="font-size:48px;font-weight:900;margin-top:12px;color:var(--red)">${cur.w}</p>`:""}`;
  } else {
    board = `<p style="font-size:12px;font-weight:900;color:var(--gray);margin-bottom:10px">この読みは?</p>
      <p style="font-size:48px;font-weight:900;letter-spacing:.08em;line-height:1.2">${cur.w}</p>`;
  }
  let controls="";
  if(!isKaki && phase==="ask"){
    controls = `<div class="row" style="flex-wrap:nowrap">
      <input id="ans" type="text" placeholder="ひらがなで入力" autocomplete="off"
        style="flex:1;border:3px solid var(--ink);border-radius:12px;padding:12px 14px;font-size:18px;font-weight:700;background:#fff;min-width:0">
      <button class="btn" style="background:var(--blue);padding:12px 20px;font-size:15px" data-act="judgeYomi">こたえる</button>
    </div>`;
  } else if(isKaki && phase==="ask"){
    controls = `<button class="btn" style="width:100%;background:var(--ink);padding:14px;font-size:16px" data-act="reveal">書けたら答えを見る</button>`;
  } else if(isKaki && phase==="reveal"){
    controls = `<div class="row" style="flex-wrap:nowrap">
      <button class="btn" style="flex:1;background:var(--green);padding:14px;font-size:16px" data-act="kakiOk">○ 書けた!</button>
      <button class="btn" style="flex:1;background:var(--red);padding:14px;font-size:16px" data-act="kakiNg">× まちがえた</button>
    </div>`;
  }
  let judged="";
  if(phase==="judged"){
    judged = `<div class="judge" style="background:${lastCorrect?"#EBF5EE":"#FBECE8"};border:3px solid ${lastCorrect?"var(--green)":"var(--red)"}">
      <p style="font-weight:900;font-size:20px;color:${lastCorrect?"var(--green)":"var(--red)"}">${lastCorrect?"せいかい! +10pt ⭐":"おしい!"}</p>
      ${!isKaki?`<p style="font-weight:900;font-size:16px;margin-top:4px">${cur.w} = 「${cur.y}」</p>`:""}
      <p style="font-size:11px;font-weight:700;color:var(--gray);margin-top:4px">${lastCorrect?(save.stats[cur.id]&&save.stats[cur.id].due?`つぎは ${save.stats[cur.id].due} ごろにまた出すよ`:""):"「にがて」に登録したよ。あとでまた出すね。"}</p>
      <button class="btn" style="margin-top:10px;background:var(--ink);padding:12px 36px;font-size:15px" data-act="next">${idx+1>=queue.length?"けっかを見る":"つぎの問題 →"}</button>
    </div>`;
  }
  return `
  <div class="row" style="justify-content:space-between;margin-bottom:10px">
    <span style="font-weight:900;font-size:13px;color:${isRetry?"var(--red)":"var(--gray)"}">${isRetry?`なおしタイム${retryRound>1?"("+retryRound+"かい目)":""} `:""}だい ${idx+1} 問 / ${queue.length} 問</span>
    <span style="font-weight:900;font-size:13px"><span style="color:var(--green)">○ ${session.c}</span>　<span style="color:var(--red)">× ${session.w}</span>　<span style="color:var(--gold)">⭐${session.pt}pt</span></span>
  </div>
  <div class="masu">${board}</div>
  ${phase!=="judged"?controls:judged}`;
}

function renderDone(){
  const perfect = session.c===queue.length && queue.length>0;
  const cleared = isRetry && perfect;
  const msg = cleared?"ぜんぶ なおせた!! ボーナス +10pt ⭐"
    : perfect?(isRetry?"":"パーフェクト!! ボーナス +30pt ⭐")
    : isRetry?"のこりを もう一回 なおそう!"
    : session.c>=9?"90点レベル!目標たっせい!":session.c>=7?"あと少しで90点!にがてをつぶそう"
    :"だいじょうぶ、くり返せば必ずおぼえられるよ";
  const color = perfect?"var(--green)":session.c>=7?"var(--blue)":"var(--red)";
  let wrongs="", retryBtn="";
  if(session.wrongs.length){
    wrongs = `<div style="background:#FBECE8;border:2px solid var(--red);border-radius:12px;padding:14px;margin-top:14px;text-align:left">
      <p style="font-weight:900;font-size:13px;color:var(--red);margin-bottom:6px">まちがえたもの(ノートに3回ずつ書いてから なおそう)</p>
      ${session.wrongs.map(w0=>`<p style="font-weight:900;font-size:16px">${w0.w}(${w0.y})</p>`).join("")}
    </div>`;
    retryBtn = `<button class="btn" style="width:100%;background:#B03A2E;padding:15px;font-size:17px;margin-top:14px" data-act="retryWrong">
      ✏️ なおしタイム(${session.wrongs.length}問)</button>
    <p style="font-size:11px;font-weight:700;color:var(--gray);margin-top:6px">まちがえたものだけ、ぜんぶ書けるまでくりかえすよ</p>`;
  }
  const clearMsg = cleared?`<div style="background:#EBF5EE;border:2px solid var(--green);border-radius:12px;padding:14px;margin-top:14px">
      <p style="font-weight:900;font-size:15px;color:var(--green)">きょうの積みのこし ゼロ! 🎉</p>
      <p style="font-size:11px;font-weight:700;color:var(--gray);margin-top:4px">なおした漢字は、明日また出してたしかめるよ。</p>
    </div>`:"";
  return `<div style="text-align:center">
    <div style="background:#fff;border:3px solid var(--ink);border-radius:16px;padding:24px">
      <p style="font-weight:900;font-size:16px">${isRetry?"なおしタイムの けっか":"けっか"}</p>
      <p style="font-weight:900;font-size:46px;color:${color}">${session.c} <span style="font-size:20px;color:var(--ink)">/ ${queue.length} 問</span></p>
      ${msg?`<p style="font-weight:900;font-size:15px">${msg}</p>`:""}
      <p class="pt" style="margin-top:8px">こんかい +${session.pt} pt(ぜんぶで ${save.pts} pt)</p>
    </div>
    ${clearMsg}
    ${wrongs}
    ${retryBtn}
    <div class="row" style="margin-top:14px;flex-wrap:nowrap">
      <button class="btn" style="flex:1;background:${session.wrongs.length?"var(--gray)":"var(--red)"};padding:13px;font-size:15px" data-act="retry">あたらしく10問</button>
      <button style="flex:1;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:12px;padding:13px;font-weight:900;font-size:15px" data-act="menu">まきばへもどる</button>
    </div>
  </div>`;
}

function renderZukan(){
  const got=new Set(save.pets.map(p=>p.c));
  const best=(c)=>Math.max(0,...save.pets.filter(p=>p.c===c).map(p=>petStage(p.lv)));
  const cells=CHAINS.map((ch,i)=>{
    const has=got.has(i); const st=has?best(i):0;
    return `<div class="pet" style="width:92px;${has?"":"opacity:.55;border-style:dashed"}">
      <div class="face">${has?ch.e[st]:"❓"}</div>
      <div class="nm" style="font-size:11px">${has?ch.n:"???"}</div>
      <div class="lv">${ch.r?"レア":"ふつう"}${has?"":"・みはっけん"}</div>
    </div>`;
  }).join("");
  return `<h2 style="font-weight:900;font-size:16px;margin-bottom:4px">🐾 いきものずかん</h2>
    <p style="font-weight:900;font-size:13px;color:var(--gray);margin-bottom:10px">あつめた種類 ${got.size} / ${CHAINS.length}(ぜんぶ集めたらマスター!)</p>
    <div class="row">${cells}</div>
    <p style="font-size:11px;font-weight:700;color:var(--gray);margin-top:10px">絵はいま育っているいちばん進化したすがた。レアはレアなたまごから出やすいよ。</p>`;
}
function renderBackup(){
  const txt=JSON.stringify({save,version:1});
  return `<h2 style="font-weight:900;font-size:16px;margin-bottom:10px">バックアップ・ふっかつ</h2>
  <div class="card" style="margin-bottom:16px">
    <p style="font-weight:900;font-size:14px;margin-bottom:4px">① いまの記ろくを保ぞんする</p>
    <p style="font-size:12px;font-weight:700;color:var(--gray);margin-bottom:8px">
      下のボタンをおしてコピーし、メモアプリやLINEの自分あてトークにはりつけて保管してください。</p>
    <button class="btn" style="background:var(--green);padding:12px 20px;font-size:14px" data-act="copyBackup">コピーする</button>
    <span id="copyMsg" style="font-weight:900;font-size:13px;color:var(--green);margin-left:10px"></span>
    <textarea id="backupOut" readonly style="width:100%;height:90px;margin-top:10px;border:2px solid var(--line);border-radius:8px;padding:8px;font-size:11px;font-family:monospace">${txt.replace(/</g,"&lt;")}</textarea>
    <p style="font-size:11px;font-weight:700;color:var(--gray);margin-top:4px">
      ⭐${save.pts}pt / いきもの${save.pets.length}ひき / 練習した漢字${Object.keys(save.stats).length}字</p>
  </div>
  <div class="card">
    <p style="font-weight:900;font-size:14px;margin-bottom:4px">② 保管した記ろくをもどす</p>
    <p style="font-size:12px;font-weight:700;color:var(--gray);margin-bottom:8px">
      コピーしておいた文字を下のわくにはりつけて、ボタンをおしてください。</p>
    <textarea id="backupIn" placeholder="ここに はりつける" style="width:100%;height:90px;border:2px solid var(--line);border-radius:8px;padding:8px;font-size:11px;font-family:monospace"></textarea>
    <button class="btn" style="background:var(--red);padding:12px 20px;font-size:14px;margin-top:8px" data-act="restoreBackup">この記ろくにもどす</button>
  </div>
  <p style="font-size:11px;font-weight:700;color:var(--gray);margin-top:10px">
    おうちの方へ:ふだんの更新はファイル名を同じにして上書きすれば自動で引き継がれます。
    別の端末に移すときや、念のための保管をしたいときにお使いください。</p>`;
}
function copyBackup(){
  const ta=$("#backupOut"); if(!ta) return;
  ta.select(); ta.setSelectionRange(0,999999);
  let ok=false;
  try{ ok=document.execCommand("copy"); }catch(e){}
  if(!ok && navigator.clipboard){ navigator.clipboard.writeText(ta.value).then(()=>{},()=>{}); ok=true; }
  const m=$("#copyMsg");
  if(m) m.textContent = ok ? "コピーしました!" : "上のわくを長おしして「コピー」してね";
}
function restoreBackup(){
  const ta=$("#backupIn"); if(!ta) return;
  const v=ta.value.trim();
  if(!v){ alert("はりつけてから ボタンをおしてください。"); return; }
  try{
    const data=JSON.parse(v);
    if(typeof data.save!=="object") throw new Error("形式エラー");
    if(!confirm("今の記ろくを、はりつけた内容で置きかえます。よろしいですか?")) return;
    save=data.save; persist(); screen="menu"; render(); alert("もどしました!");
  }catch(e){ alert("よみこめませんでした。コピーした文字がぜんぶ入っているか たしかめてください。"); }
}
function renderList(){
  const weak = pool("weak");
  let inner = weak.length ? weak.map(it=>{
    const s=save.stats[it.id]||{c:0,w:0};
    return `<div class="weakItem">
      <span style="font-weight:900;font-size:22px">${it.taisaku?"文":it.k}</span>
      <span style="flex:1;font-weight:700;font-size:14px">${it.ws ? it.ws.map(x=>x[0]+"("+x[1]+")").join("・") : it.w+"("+it.y+")"}</span>
      <span style="font-size:12px;font-weight:700;color:var(--gray)">○${s.c} ×${s.w}</span>
    </div>`;
  }).join("") : `<p style="background:#EBF5EE;border:2px solid var(--green);border-radius:12px;padding:14px;font-weight:700;font-size:13px">いまは「にがて」なし!すばらしい!</p>`;
  return `<h2 style="font-weight:900;font-size:16px;margin-bottom:10px">にがてリスト</h2>${inner}
    <p style="font-size:12px;font-weight:700;color:var(--gray);margin-top:10px">おうちの方へ:ここの漢字をノート練習→「にがてだけ」で再テスト、が定着の近道です。</p>`;
}

function toggleModeUI(){
  const rs=$("#rangeSel"); if(!rs) return;
  const isT = rs.value==="taisaku";
  if($("#modeWrap")) $("#modeWrap").classList.toggle("hidden", isT);
  if($("#taisakuNote")) $("#taisakuNote").classList.toggle("hidden", !isT);
}
function render(){
  $("#toMenu").classList.toggle("hidden", screen==="menu");
  const v=$("#view");
  if(screen==="menu"){ v.innerHTML=renderMenu(); const rs=$("#rangeSel"); if(rs){ rs.value=rangeV; toggleModeUI(); } }
  else if(screen==="quiz") v.innerHTML=renderQuiz();
  else if(screen==="done") v.innerHTML=renderDone();
  else if(screen==="list") v.innerHTML=renderList();
  else if(screen==="backup") v.innerHTML=renderBackup();
  else if(screen==="zukan") v.innerHTML=renderZukan();
  const ans=$("#ans");
  if(ans){ ans.focus(); ans.addEventListener("keydown",(e)=>{ if(e.key==="Enter") judgeYomi(); }); }
}

// ===== バックアップ =====
// ===== イベント =====
document.addEventListener("click",(e)=>{
  if(e.target.id==="toMenu"){ screen="menu"; render(); return; }
  const el=e.target.closest("[data-act]"); if(!el) return;
  switch(el.dataset.act){
    case "start": start(); break;
    case "judgeYomi": judgeYomi(); break;
    case "reveal": phase="reveal"; render(); break;
    case "kakiOk": judgeKaki(true); break;
    case "kakiNg": judgeKaki(false); break;
    case "next": next(); break;
    case "retry": screen="menu"; start(); break;
    case "retryWrong": startRetry(); break;
    case "menu": isRetry=false; retryRound=0; screen="menu"; render(); break;
    case "list": screen="list"; render(); break;
    case "egg": buyEgg(el.dataset.kind); break;
    case "zukan": screen="zukan"; render(); break;
    case "feed": feed(Number(el.dataset.i)); break;
    case "rename": renamePet(Number(el.dataset.i)); break;
    case "backup": screen="backup"; render(); break;
    case "copyBackup": copyBackup(); break;
    case "restoreBackup": restoreBackup(); break;
  }
});
document.addEventListener("change",(e)=>{
  if(e.target.id==="rangeSel"){ rangeV=e.target.value; toggleModeUI(); }
  if(e.target.id==="modeSel"){ mode=e.target.value; }
});

load();
render();
</script>
</body>
</html>
