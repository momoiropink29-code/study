<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>まいにちスタディ</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF7FD; --card:#FFFFFF; --ink:#4A4458; --sub:#8A82A0;
    --good:#2FA37A; --good-soft:#D9F3E6; --bad:#E0708A; --bad-soft:#FBE6EC;
    --line:#E9E2F2; --radius:14px;
    --p-pink:#F9C9DC; --p-lemon:#FBEFC3; --p-mint:#C9EED9; --p-sky:#C9E4F9; --p-lav:#E3D9F9;
    --primary:#A78BDB;
    --rainbow:linear-gradient(90deg,#F9C9DC,#FBEFC3,#C9EED9,#C9E4F9,#E3D9F9);
  }
  *{box-sizing:border-box; margin:0;}
  body{font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif; background:var(--bg); color:var(--ink); padding:16px; max-width:560px; margin:0 auto; line-height:1.7;}
  h1{font-size:22px; font-weight:700; letter-spacing:0.04em;}
  .sub{color:var(--sub); font-size:13px;}
  header{display:flex; align-items:center; gap:12px; margin:4px 0 4px;}
  .rainbowbar{height:6px; border-radius:3px; background:var(--rainbow); margin:6px 0 16px;}
  .card{background:var(--card); border:1.5px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:12px; overflow:hidden;}
  .card.hero{border:2px solid var(--primary); position:relative; padding-top:20px;}
  .card.hero::before{content:""; position:absolute; top:0; left:0; right:0; height:6px; background:var(--rainbow);}
  .badge{display:inline-block; background:var(--p-lav); color:#6C55A8; font-size:12px; font-weight:700; padding:2px 10px; border-radius:999px;}
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .grid .card{border-top:5px solid var(--line); margin-bottom:0;}
  .grid .card.t-pink{border-top-color:var(--p-pink);}
  .grid .card.t-mint{border-top-color:var(--p-mint);}
  .grid .card.t-sky{border-top-color:var(--p-sky);}
  .grid .card.t-lemon{border-top-color:var(--p-lemon);}
  button{font-family:inherit; font-size:15px; font-weight:700; color:var(--ink); background:var(--card); border:1.5px solid var(--ink); border-radius:12px; padding:10px 16px; cursor:pointer; transition:transform .06s;}
  button:active{transform:scale(.97);}
  button.primary{background:var(--primary); border-color:var(--primary); color:#fff;}
  button.ghost{border-color:var(--line); color:var(--sub); font-weight:500;}
  .stats{display:flex; gap:8px; margin-bottom:12px;}
  .stat{flex:1; background:var(--card); border:1.5px solid var(--line); border-radius:12px; padding:8px 12px; text-align:center;}
  .stat .label{font-size:11px; color:var(--sub);}
  .stat .val{font-size:20px; font-weight:700;}
  #passage{font-size:15px; background:var(--bg); border-radius:10px; padding:12px 14px; margin-bottom:14px; text-align:left;}
  #question{font-size:19px; font-weight:700; text-align:center; margin:4px 0 16px; line-height:1.6;}
  #choices{display:grid; grid-template-columns:1fr; gap:10px;}
  #choices.two{grid-template-columns:1fr 1fr;}
  #choices button{font-size:16px; padding:12px 10px; border-color:var(--line); font-weight:500;}
  #choices button.ok{background:var(--good-soft); border-color:var(--good); color:var(--good); font-weight:700;}
  #choices button.ng{background:var(--bad-soft); border-color:var(--bad); color:var(--bad); font-weight:700;}
  #feedback{min-height:48px; text-align:center; font-size:14px; margin-top:12px; font-weight:500;}
  #feedback.good{color:var(--good);}
  #feedback.bad{color:var(--bad);}
  .revtag{display:inline-block; background:var(--p-lemon); color:#8A6D1B; font-size:11px; font-weight:700; padding:1px 8px; border-radius:999px; margin-bottom:6px;}
  .stairs{display:flex; align-items:flex-end; margin:8px 0 4px;}
  .step{background:var(--p-sky); color:#3A6EA8; font-weight:700; border:1.5px solid #9CC4E8; border-radius:8px 8px 0 0; padding:6px 0; text-align:center; flex:1; font-size:14px;}
  .riser{font-size:11px; color:var(--sub); text-align:center; flex:0 0 52px; padding-bottom:4px;}
  .section-label{font-weight:700; font-size:15px; margin-bottom:2px;}
  .hidden{display:none;}
  .center{text-align:center;}
  .trophy{font-size:40px;}
  #reviewList{font-size:13px; color:var(--sub); text-align:left; background:var(--bg); border-radius:10px; padding:10px 14px; margin:12px 0;}
  footer{text-align:center; margin-top:16px;}
  .kiroku{display:flex; gap:8px; align-items:stretch;}
  .kiroku .big{flex:0 0 40%; background:var(--p-lav); border-radius:12px; text-align:center; padding:10px;}
  .kiroku .big .num{font-size:30px; font-weight:700; color:#6C55A8;}
  .rates{flex:1;}
  .rate{display:flex; align-items:center; gap:8px; font-size:12px; margin:3px 0;}
  .rate .nm{flex:0 0 44px; color:var(--sub);}
  .rate .barwrap{flex:1; background:var(--bg); border-radius:6px; height:12px; overflow:hidden;}
  .rate .bar{height:100%; border-radius:6px;}
  .rate .pc{flex:0 0 38px; text-align:right; font-weight:700;}
  @media (prefers-reduced-motion: reduce){ button{transition:none;} }
</style>
</head>
<body>

<div class="rainbowbar"></div>

<div id="menu">
  <div class="card hero">

    <p style="font-size:18px; font-weight:700; margin:8px 0 2px;">今日の10問</p>
    <p class="sub" style="margin-bottom:12px;">図形・漢字・読解・単位のミックス。前にまちがえた問題も出るよ!</p>

    <div class="card t-pink">
      <p class="section-label">漢字の書き</p>

    </div>
    <div class="card t-lemon">
      <p class="section-label">読解</p>

    </div>
    <div class="card t-mint">
      <p class="section-label">単位</p>

  <div class="card">
    <p class="section-label">おぼえなくていいコーナー</p>
    <p class="sub" style="margin-bottom:6px;">→に進むときは「かける」、もどるときは「わる」</p>
    <div id="chartBody"></div>
    <p class="sub" style="margin-top:10px;">📦 立方体のきまり: 面は6つ・辺は<b>12本</b>・頂点は8つ。「辺の長さの和」=1辺×12</p>
    <p class="sub">📖 読解のコツ: 「なぜ?」ときかれたら、文の中の「〜<b>から</b>」をさがす!</p>
  </div>
</div>

<div id="game" class="hidden">
  <div class="stats">
    <div class="stat"><div class="label">問題</div><div class="val" id="qnum">1/10</div></div>
    <div class="stat"><div class="label">スコア</div><div class="val" id="score">0</div></div>
    <div class="stat"><div class="label">コンボ</div><div class="val" id="combo">×0</div></div>
  </div>
  <div class="card">

</div>

<div id="result" class="hidden">
  <div class="card center">
    <div class="trophy" id="trophyMark">🏆</div>
    <p style="font-size:30px; font-weight:700;" id="finalScore"></p>
    <p class="sub" id="finalMsg"></p>
    <div id="reviewList" class="hidden"></div>
    <div style="display:flex; gap:10px; justify-content:center; margin-top:12px;">
      <button class="primary" onclick="startGame(lastMode)">もう一回</button>
      <button onclick="showMenu()">メニューへ</button>
    </div>
  </div>
</div>

<script>
document.getElementById('today').textContent = new Date().toLocaleDateString('ja-JP',{month:'long',day:'numeric',weekday:'short'});

function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function ri(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
function fmt(n){return Number(n).toLocaleString('ja-JP');}
function todayStr(){var d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
function yesterStr(){var d=new Date();d.setDate(d.getDate()-1);return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}

/* ---------- きろく(端末内に保存) ---------- */
var KEY="mainichiStudy.v1";
var canStore=true;
function loadDB(){
  try{ var s=localStorage.getItem(KEY); return s?JSON.parse(s):null; }
  catch(e){ canStore=false; return null; }
}
var DB = loadDB() || {streak:0, lastDaily:"", stats:{}, wrong:[]};
function saveDB(){
  if(!canStore) return;
  try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){ canStore=false; }
}
try{ localStorage.setItem(KEY+".test","1"); localStorage.removeItem(KEY+".test"); }
catch(e){ canStore=false; }

var MODE_NAMES={zukei:"図形", kanji:"漢字", dokkai:"読解", unit:"単位"};
var MODE_COLORS={zukei:"var(--p-sky)", kanji:"var(--p-pink)", dokkai:"var(--p-lemon)", unit:"var(--p-mint)"};

function renderKiroku(){
  document.getElementById('streakNum').textContent = DB.streak||0;
  var rows=document.getElementById('rateRows'); rows.innerHTML="";
  Object.keys(MODE_NAMES).forEach(function(m){
    var st=DB.stats[m]||{ok:0,ng:0};
    var total=st.ok+st.ng;
    var pc = total? Math.round(st.ok/total*100) : 0;
    var row=document.createElement('div'); row.className='rate';
    row.innerHTML='<span class="nm">'+MODE_NAMES[m]+'</span>'+
      '<span class="barwrap"><span class="bar" style="width:'+pc+'%; background:'+MODE_COLORS[m]+';"></span></span>'+
      '<span class="pc">'+(total? pc+"%":"—")+'</span>';
    rows.appendChild(row);
  });
  document.getElementById('storageNote').textContent = canStore
    ? "きろくはこの端末の中だけに保存されます"
    : "※この画面では保存できません。ファイルを端末に保存してブラウザで開くと、きろくが残ります";
}

/* ---------- 単位 ---------- */
var ladders=[
  ["長さ",[["mm","×10"],["cm","×100"],["m","×1000"],["km",""]]],
  ["重さ",[["g","×1000"],["kg","×1000"],["t",""]]],
  ["かさ",[["mL","×10"],["dL","×10"],["L",""]]],
  ["面積",[["m²","×100"],["a","×100"],["ha","×100"],["km²",""]]]
];
var unitRel={
  "km-m":[1000,"1km = 1000m"],"m-cm":[100,"1m = 100cm"],"cm-mm":[10,"1cm = 10mm"],
  "t-kg":[1000,"1t = 1000kg"],"kg-g":[1000,"1kg = 1000g"],
  "L-dL":[10,"1L = 10dL"],"dL-mL":[100,"1dL = 100mL"],"L-mL":[1000,"1L = 1000mL"],
  "ha-a":[100,"1ha = 100a"],"a-m²":[100,"1a = 100m²"]
};
function unitQ(){
  var keys=Object.keys(unitRel);
  var k=keys[ri(0,keys.length-1)];
  var p=k.split("-"),big=p[0],small=p[1];
  var f=unitRel[k][0],hint=unitRel[k][1];
  if(Math.random()<0.5){
    var v=ri(2,9),ans=v*f;
    return {q:v+big+" = ?"+small, a:fmt(ans)+small, c:uniq4(fmt(ans)+small,[fmt(ans*10)+small,fmt(Math.max(1,ans/10))+small,fmt(ans+f)+small]), h:hint, grid:'two', m:'unit'};
  }
  var v2=ri(2,9)*f,ans2=v2/f;
  return {q:fmt(v2)+small+" = ?"+big, a:fmt(ans2)+big, c:uniq4(fmt(ans2)+big,[fmt(ans2*10)+big,fmt(v2)+big,fmt(Math.max(1,Math.round(ans2/2)))+big]), h:hint, grid:'two', m:'unit'};
}

/* ---------- 図形 ---------- */
function zukeiQ(){
  var type=ri(0,4);
  if(type===0){
    var w=ri(3,12),h=ri(3,12),ans=w*h;
    return {q:"たて"+w+"cm、よこ"+h+"cmの長方形の面積は?", a:ans+"cm²", c:uniq4(ans+"cm²",[(w+h)*2+"cm²",(ans+w)+"cm²",(w+h)+"cm²"]), h:"面積 = たて×よこ", grid:'two', m:'zukei'};
  }
  if(type===1){
    var w2=ri(3,9),h2=ri(3,9),area=w2*h2;
    return {q:"面積が"+area+"cm²の長方形。たてが"+w2+"cmのとき、よこは何cm?", a:h2+"cm", c:uniq4(h2+"cm",[(area-w2)+"cm",(h2+2)+"cm",Math.max(1,h2-1)+"cm"]), h:"よこ = 面積÷たて("+area+"÷"+w2+")", grid:'two', m:'zukei'};
  }
  if(type===2){
    var w3=ri(3,12),h3=ri(3,12),ans3=(w3+h3)*2;
    return {q:"たて"+w3+"cm、よこ"+h3+"cmの長方形のまわりの長さは?", a:ans3+"cm", c:uniq4(ans3+"cm",[w3*h3+"cm",(w3+h3)+"cm",(ans3+2)+"cm"]), h:"まわり = (たて+よこ)×2", grid:'two', m:'zukei'};
  }
  if(type===3){
    var A=ri(8,15),B=ri(8,15),c1=ri(2,A-2),d1=ri(2,B-2);
    var ans4=A*B-c1*d1;
    return {q:"たて"+A+"cm、よこ"+B+"cmの長方形から、たて"+c1+"cm、よこ"+d1+"cmの長方形を切り取った。残りの面積は?", a:ans4+"cm²", c:uniq4(ans4+"cm²",[A*B+"cm²",c1*d1+"cm²",(ans4+10)+"cm²"]), h:"大きい面積("+A+"×"+B+") − 切り取った面積("+c1+"×"+d1+")", grid:'two', m:'zukei'};
  }
  var e=ri(3,9);
  if(Math.random()<0.5){
    return {q:"1辺が"+e+"cmの立方体。すべての辺の長さの和は何cm?", a:e*12+"cm", c:uniq4(e*12+"cm",[e*8+"cm",e*6+"cm",e*4+"cm"]), h:"立方体の辺は12本! 1辺×12", grid:'two', m:'zukei'};
  }
  return {q:"立方体のすべての辺の長さの和が"+(e*12)+"cmのとき、1辺は何cm?", a:e+"cm", c:uniq4(e+"cm",[(e*12/8)+"cm",(e*2)+"cm",(e+3)+"cm"]), h:"辺は12本だから "+(e*12)+"÷12", grid:'two', m:'zukei'};
}

var kakiBank=[

["手紙のヘンジを書く。","返事",["返事","変事","辺事","返時"],"返(かえ)す+事"],
["発表のキカイをもらう。","機会",["機会","機械","器械","気会"],"チャンス=機会。ロボットなどは機械"],

["野球のケイケンを積む。","経験",["経験","計験","経検","軽験"],"経(へ)て験(ため)す"],
["立ち入りキンシの場所。","禁止",["禁止","近止","金止","禁示"],"禁(きん)じて止(と)める"],

/* ---------- ゲーム進行 ---------- */
function uniq4(ans,wrongs){
  var s=[ans];
  wrongs.forEach(function(w){ if(s.indexOf(w)===-1&&s.length<4) s.push(w); });
  var pad=3;
  while(s.length<4){ var c=fmt(pad*7)+"?"; if(s.indexOf(c)===-1) s.push(c); pad++; }
  return shuffle(s.slice());
}

var lastMode='daily',qs=[],idx=0,sc=0,cb=0,locked=false,wrongs=[];

function startGame(mode){
  lastMode=mode; idx=0; sc=0; cb=0; wrongs=[]; qs=[];
  var kb=shuffle(kakiBank.slice()), db=shuffle(dokkaiBank.slice());
  if(mode==='unit'){ for(var i=0;i<10;i++) qs.push(unitQ()); }
  else if(mode==='zukei'){ for(var j=0;j<10;j++) qs.push(zukeiQ()); }
  else if(mode==='kanji'){ for(var k=0;k<10;k++) qs.push(kanjiQ(kb)); }
  else if(mode==='dokkai'){ for(var m=0;m<8;m++) qs.push(dokkaiQ(db)); }
  else {
    for(var a=0;a<3;a++) qs.push(zukeiQ());
    for(var b=0;b<3;b++) qs.push(kanjiQ(kb));
    for(var c=0;c<2;c++) qs.push(dokkaiQ(db));
    for(var d=0;d<2;d++) qs.push(unitQ());
    /* まちがい記録から最大2問をふくしゅうとして混ぜる */
    var pool=shuffle((DB.wrong||[]).slice()).slice(0,2);
    pool.forEach(function(w,i2){
      var rq={p:w.p, q:w.q, a:w.a, c:shuffle(w.c.slice()), h:w.h, grid:w.grid, m:w.m, rev:true};
      qs[i2]=rq;
    });
    qs=shuffle(qs);
  }
  swap('game'); render();
}

function render(){
  locked=false;
  document.getElementById('qnum').textContent=(idx+1)+"/"+qs.length;
  document.getElementById('score').textContent=sc;
  document.getElementById('combo').textContent="×"+cb;
  document.getElementById('revtag').classList.toggle('hidden', !qs[idx].rev);
  var pg=document.getElementById('passage');
  if(qs[idx].p){ pg.textContent=qs[idx].p; pg.classList.remove('hidden'); }
  else pg.classList.add('hidden');
  document.getElementById('question').textContent=qs[idx].q;
  var fb=document.getElementById('feedback'); fb.textContent=""; fb.className="";
  document.getElementById('hintBtn').style.visibility='visible';
  var c=document.getElementById('choices');
  c.className = qs[idx].grid==='two' ? 'two' : '';
  c.innerHTML="";
  qs[idx].c.forEach(function(opt){
    var b=document.createElement('button');
    b.textContent=opt;
    b.onclick=function(){answer(opt,b);};
    c.appendChild(b);
  });
}

function showHint(){
  if(locked) return;
  var fb=document.getElementById('feedback');
  fb.textContent="ヒント: "+qs[idx].h; fb.className="";
}

function answer(opt,btn){
  if(locked) return; locked=true;
  document.getElementById('hintBtn').style.visibility='hidden';
  var Q=qs[idx], correct=Q.a;
  var fb=document.getElementById('feedback');
  var st=DB.stats[Q.m]||(DB.stats[Q.m]={ok:0,ng:0});
  if(String(opt)===String(correct)){
    cb++; sc+=10+(cb-1)*2;
    st.ok++;
    if(Q.rev){ /* ふくしゅうで正解→記録から外す */
      DB.wrong=(DB.wrong||[]).filter(function(w){return w.q!==Q.q;});
    }
    btn.className="ok";
    fb.textContent="せいかい!"+(Q.rev?" ふくしゅうクリア!":"")+(cb>=3?" コンボ×"+cb+"!":"");
    fb.className="good";
  } else {
    cb=0; st.ng++;
    wrongs.push(Q.q+" → "+correct);
    DB.wrong=DB.wrong||[];
    if(!DB.wrong.some(function(w){return w.q===Q.q;})){
      DB.wrong.push({p:Q.p||"", q:Q.q, a:Q.a, c:Q.c.slice(), h:Q.h, grid:Q.grid, m:Q.m});
      if(DB.wrong.length>30) DB.wrong.shift();
    }
    btn.className="ng";
    fb.textContent="答えは「"+correct+"」。"+Q.h;
    fb.className="bad";
  }
  saveDB();
  document.getElementById('score').textContent=sc;
  document.getElementById('combo').textContent="×"+cb;
  var wait = Q.p ? 2600 : 1900;
  setTimeout(function(){ idx++; if(idx<qs.length) render(); else finish(); }, wait);
}

function finish(){
  if(lastMode==='daily'){
    var t=todayStr();
    if(DB.lastDaily!==t){
      DB.streak = (DB.lastDaily===yesterStr()) ? (DB.streak||0)+1 : 1;
      DB.lastDaily=t;
    }
    saveDB();
  }
  swap('result');
  document.getElementById('finalScore').textContent=sc+" 点";
  document.getElementById('trophyMark').textContent = wrongs.length===0?"🏆":wrongs.length<=2?"✨":"📖";
  var msg = wrongs.length===0?"全問せいかい!すごい!":wrongs.length<=2?"あと少しで満点!":"まちがえた問題は、また「今日の10問」に出るよ";
  if(lastMode==='daily') msg += " / れんぞく"+DB.streak+"日目!";
  document.getElementById('finalMsg').textContent=msg;
  var rl=document.getElementById('reviewList');
  if(wrongs.length){ rl.classList.remove('hidden'); rl.innerHTML="<b>ふくしゅう</b><br>"+wrongs.join("<br>"); }
  else rl.classList.add('hidden');
}

function swap(id){
  ['menu','game','result'].forEach(function(x){document.getElementById(x).classList.add('hidden');});
  document.getElementById(id).classList.remove('hidden');
  if(id==='menu') renderKiroku();
}
function showMenu(){ swap('menu'); }

(function buildChart(){
  var body=document.getElementById('chartBody');
  ladders.forEach(function(l){
    var wrap=document.createElement('div');
    wrap.innerHTML='<p class="sub" style="font-weight:700; color:var(--ink); margin-top:8px;">'+l[0]+'</p>';
    var row=document.createElement('div'); row.className='stairs';
    l[1].forEach(function(step,i){
      var s=document.createElement('div'); s.className='step';
      s.style.paddingBottom=(6+i*8)+'px';
      s.textContent=step[0];
      row.appendChild(s);
      if(step[1]){
        var r=document.createElement('div'); r.className='riser';
        r.textContent='—'+step[1]+'→';
        row.appendChild(r);
      }
    });
    wrap.appendChild(row);
    body.appendChild(wrap);
  });
})();
renderKiroku();
