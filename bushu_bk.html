<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ぶしゅさがし</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Parisienne&display=swap" rel="stylesheet">
<style>
:root{
  --kyokasho:"HG教科書体","HGP教科書体","HGS教科書体","UD デジタル 教科書体 NK-R","UD Digi Kyokasho NK-R","YuKyokasho","游教科書体","Klee One","Hiragino Mincho ProN",serif;
  --sky:#bfe0f2; --sky2:#e8f4fb; --paper:#fbfdff; --line:#cfe6f4;
  --ink:#4a5a66; --sub:#8fa7b6; --gold:#c9a961; --pink:#f6b9c8; --leaf:#8fc7e8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--kyokasho);
  padding:8px;min-height:100vh}
.frame{background:var(--sky2);border-radius:26px;padding:10px;box-shadow:0 6px 18px rgba(120,170,200,.25)}
.sheet{background:var(--paper);border-radius:20px;border:1px solid #fff;padding:0 0 26px;overflow:hidden;max-width:100%}
header{position:sticky;top:0;background:linear-gradient(180deg,var(--paper) 78%,rgba(251,253,255,0));padding:14px 16px 12px;z-index:10}
.title{max-width:100%;font-family:'Parisienne',cursive;font-size:34px;color:var(--gold);line-height:1;text-align:center;letter-spacing:.02em}
.title .cl{font-size:22px;vertical-align:super}
.sub{text-align:center;font-size:13px;color:var(--sub);margin:2px 0 12px;letter-spacing:.22em}
.row{display:flex;gap:6px;align-items:stretch}
input{flex:1 1 0;min-width:0;width:100%;font-family:var(--kyokasho);font-size:19px;padding:10px 12px;border:2px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);box-shadow:inset 0 1px 3px rgba(150,190,215,.15)}
input:focus{outline:none;border-color:var(--leaf)}
input::placeholder{color:#b9cdda;font-size:17px}
button{flex:0 0 auto;white-space:nowrap;font-family:var(--kyokasho);border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:16px;padding:0 12px;font-size:14px;cursor:pointer}
button:active{background:var(--sky2)}
.hint{font-size:11.5px;color:var(--sub);margin-top:7px;text-align:center}
main{padding:4px 14px}
.card{max-width:100%;background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px;
  display:flex;gap:14px;align-items:flex-start;box-shadow:0 3px 10px rgba(150,195,220,.18)}
.big{font-size:58px;line-height:1;min-width:70px;text-align:center;color:#3f5261}
.bs{font-size:46px;line-height:1.1}
.info{flex:1;min-width:0}
.bname{font-size:27px;font-weight:600;color:#5f93b3;margin-bottom:3px}
.bname span{font-size:15px;color:var(--sub)}
.yomi{font-size:16px;margin-bottom:7px;color:#4a5a66}
.meta{font-size:13px;color:var(--sub);line-height:1.8}
.meta b{color:var(--ink);font-weight:600}
.sep{border-left:1px dashed var(--line);padding-left:14px}
.miss{color:var(--sub);font-size:14px;line-height:1.7}
.glist{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.g{border:1px solid var(--line);background:var(--sky2);border-radius:12px;padding:5px 9px;font-size:24px;cursor:pointer;color:#3f5261}
.g small{font-size:10px;color:var(--sub);display:block;text-align:center}
h2{font-size:13px;color:var(--sub);margin:16px 0 8px;font-weight:600;letter-spacing:.18em;
  display:flex;align-items:center;gap:8px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
.rgrid{display:flex;flex-wrap:wrap;gap:6px}
.rb{border:1px solid var(--line);background:#fff;border-radius:14px;padding:7px 8px;cursor:pointer;text-align:center;min-width:54px;
  box-shadow:0 2px 5px rgba(150,195,220,.14)}
.rb:active{background:var(--sky2)}
.rb .rc{font-size:22px;line-height:1.15;color:#3f5261}
.rb .rn{font-size:9.5px;color:var(--sub)}
.mascot{display:block;margin:0 auto 2px;width:96px;height:96px;object-fit:contain}
.foot{text-align:center;font-family:'Parisienne',cursive;color:var(--gold);font-size:17px;margin-top:18px}
.btn-s{margin-top:10px;font-size:12.5px;padding:5px 12px;border-radius:12px}
</style>
</head>
<body>
<div class="frame"><div class="sheet">
<header>
  <img class="mascot" id="mascot" src="mascot.png" alt="">
  <div class="title">Bushu Search<span class="cl">☘</span></div>
  <div class="sub">ぶしゅさがし</div>
  <div class="row">
    <input id="q" placeholder="かんじ / ぶしゅ名" autocomplete="off" autocapitalize="off">
    <button id="clr">×</button>
    <button id="listBtn">一覧</button>
  </div>
  <div class="hint">例：業 ／ さんずい ／ 氵　※かんじはまとめて入力OK</div>
</header>
<main id="out"></main>
<div class="foot">May your kanji day be happy!</div>
</div></div>

const byNum = {}; RAD.forEach(r=>byNum[r.n]=r);
const kanMap = {}; KAN.forEach(k=>kanMap[k.k]=k);
const kanByRad = {}; KAN.forEach(k=>(kanByRad[k.r]=kanByRad[k.r]||[]).push(k));
const radCharMap = {};
RAD.forEach(r=>r.c.forEach(c=>{ if(!radCharMap[c]) radCharMap[c]=r; }));
const GRADE = g=> g==null?'':(g<=6?'小'+g:(g===8?'常用':'人名'));

const out=document.getElementById('out'), q=document.getElementById('q');

function kanjiCard(k){
  const ch=kanMap[k];
  if(!ch) return `<div class="card"><div class="big">${k}</div><div class="info sep"><div class="miss">この漢字のデータがありません。<br>（常用漢字・人名用漢字・頻出字を収録）</div></div></div>`;
  const r=byNum[ch.r];
  return `<div class="card">
    <div class="big">${k}<div class="meta" style="font-size:11px;margin-top:5px">${ch.s}画 ${GRADE(ch.g)}</div></div>
    <div class="info sep">
      <div class="bname">${r.c.join(' ')} <span>${r.name}</span></div>
      <div class="yomi">${r.y.join('・')}</div>
      <div class="meta"><b>部首</b> ${r.s}画（第${r.n}）／<b>総画</b> ${ch.s}画<br>
      <b>音</b> ${ch.on.join('・')||'—'}<br><b>訓</b> ${ch.kun.join('・')||'—'}</div>
      <button class="btn-s" onclick="showRad(${r.n})">同じ部首の漢字</button>
    </div></div>`;
}
function radCard(r){
  const all=kanByRad[r.n]||[], list=all.slice(0,80);
  return `<div class="card" style="display:block">
    <div style="display:flex;gap:14px;align-items:center">
      <div class="big bs">${r.c[0]}</div>
      <div class="info"><div class="bname">${r.name}</div>
      <div class="yomi">${r.y.join('・')}</div>
      <div class="meta">${r.s}画（第${r.n}）　字形：${r.c.join(' ')}</div></div>
    </div>
    <div class="glist">${list.map(k=>`<span class="g" onclick="setQ('${k.k}')">${k.k}<small>${k.s}</small></span>`).join('')}</div>
    ${all.length>80?'<div class="meta">…ほか</div>':''}
    ${list.length===0?'<div class="miss">収録データ内に該当漢字なし</div>':''}
  </div>`;
}
function showRad(n){ out.innerHTML=radCard(byNum[n]); window.scrollTo(0,0); }
function setQ(s){ q.value=s; render(); window.scrollTo(0,0); }

function showList(){
  let h='', cur=-1;
  RAD.forEach(r=>{
    if(r.s!==cur){ cur=r.s; h+=(cur>1?'</div>':'')+`<h2>${cur}画</h2><div class="rgrid">`; }
    h+=`<div class="rb" onclick="showRad(${r.n})"><div class="rc">${r.c[0]}</div><div class="rn">${r.y[0]||''}</div></div>`;
  });
  out.innerHTML=h+'</div>'; window.scrollTo(0,0);
}
document.getElementById('listBtn').onclick=showList;
document.getElementById('clr').onclick=()=>{q.value='';q.focus();render();};
function norm(s){ return s.replace(/[ぁ-ゖ]/g,c=>String.fromCharCode(c.charCodeAt(0)+0x60)); }
function render(){
  const v=q.value.trim();
  if(!v){ showList(); return; }
  const kanji=[...v].filter(c=>/[\u3400-\u9FFF\uF900-\uFAFF]/.test(c));
  const radHits=[...v].map(c=>radCharMap[c]).filter(Boolean);
  let h='';
  if(kanji.length){ h+=kanji.map(kanjiCard).join(''); }
  if(!kanji.length && radHits.length){ h+=radHits.map(radCard).join(''); }
  if(!kanji.length && !radHits.length){
    const key=norm(v);
    const hits=RAD.filter(r=> r.y.some(y=>norm(y).includes(key)) || norm(r.name).includes(key));
    h = hits.length ? hits.slice(0,12).map(radCard).join('')
      : '<div class="card"><div class="miss">見つかりませんでした。かんじ・ぶしゅ名（さんずい など）・ぶしゅ（氵 など）で検索してね。</div></div>';
  }
  out.innerHTML=h;
}
q.addEventListener('input',render);
showList();
