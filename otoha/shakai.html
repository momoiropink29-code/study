<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>にじいろ社会ノート｜11月テスト対策</title>
<style>
:root{
  --pink:#FF8FB1; --pink-d:#E86D93;
  --orange:#FFB067; --yellow:#FFD766;
  --green:#8FDCA6; --blue:#7FC9EC; --purple:#B4A8F5; --violet:#E29BE8;
  --ink:#5B4A57; --ink-soft:#96859A;
  --card:#FFFFFF; --line:#F3E4EE;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  color:var(--ink); font-size:16px; line-height:1.75;
  font-family:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN W4","Yu Gothic",system-ui,sans-serif;
  background:#FFF4FA;
  background-image:
    radial-gradient(circle at 12% 8%, #FFE3F0 0 22%, transparent 22%),
    radial-gradient(circle at 88% 22%, #E6E7FF 0 20%, transparent 20%),
    radial-gradient(circle at 20% 92%, #DFF5EA 0 24%, transparent 24%),
    linear-gradient(#FFF7FC,#F6F2FF);
  background-attachment:fixed;
  padding-bottom:env(safe-area-inset-bottom);
}
.wrap{max-width:560px;margin:0 auto;padding:0 15px 70px}

/* ===== ヘッダー ===== */
header{
  background:linear-gradient(100deg,#FFA9C6,#FFC79A,#FFE58A,#9BE5B4,#8FD3F4,#BDB2F7,#EBA6EE);
  padding:16px 0 20px; border-radius:0 0 30px 30px; position:relative; overflow:hidden;
  box-shadow:0 6px 0 rgba(255,175,205,.35);
}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:14px;
  background:radial-gradient(circle at 10px -2px,#fff 8px,transparent 9px) repeat-x;background-size:20px 14px}
.hd{max-width:560px;margin:0 auto;padding:0 15px;display:flex;align-items:center;gap:10px}
.hd button{background:none;border:none;padding:0;flex:1;text-align:left;cursor:pointer;font-family:inherit;color:#fff}
.hd h1{margin:0;font-size:20px;font-weight:800;letter-spacing:.04em;text-shadow:0 2px 0 rgba(230,120,160,.45)}
.hd .sub{margin:0;font-size:11px;font-weight:700;letter-spacing:.16em;color:#fff;opacity:.95}
.hd .best{background:#fff;border-radius:16px;padding:5px 11px;text-align:center;box-shadow:0 3px 0 rgba(232,109,147,.3)}
.hd .best small{display:block;font-size:9px;color:var(--ink-soft);letter-spacing:.1em}
.hd .best b{font-size:20px;color:var(--pink-d);line-height:1}

/* ===== カード・ボタン ===== */
.card{background:var(--card);border-radius:24px;padding:16px 17px;margin-top:15px;
  box-shadow:0 5px 0 #F3E1EC, 0 10px 22px rgba(190,150,180,.13)}
.card h2{margin:0 0 7px;font-size:15px;font-weight:800;display:flex;align-items:center;gap:6px}
.muted{color:var(--ink-soft);font-size:13.5px}
.btn{display:block;width:100%;border:none;border-radius:22px;padding:15px 18px;margin-top:12px;
  font:inherit;font-weight:800;font-size:16px;color:#fff;cursor:pointer;text-align:left;
  background:var(--pink); box-shadow:0 6px 0 var(--pink-d); transition:transform .08s, box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--pink-d)}
.btn .s{display:block;font-size:12.5px;font-weight:600;opacity:.95;margin-top:2px;line-height:1.5}
.btn.rainbow{background:linear-gradient(95deg,#FF8FB1,#FFB067,#FFD766,#8FDCA6,#7FC9EC,#B4A8F5);box-shadow:0 6px 0 #D9A0C6}
.btn.rainbow:active{box-shadow:0 2px 0 #D9A0C6}
.btn.honey{background:#FFC24D;box-shadow:0 6px 0 #E2A22C}
.btn.honey:active{box-shadow:0 2px 0 #E2A22C}
.btn.soft{background:#fff;color:var(--ink);box-shadow:0 5px 0 #EFE0EA;text-align:center;font-size:15px}
.btn.soft:active{box-shadow:0 1px 0 #EFE0EA}
.btn:disabled{background:#EFE7EF;color:#B7A8B7;box-shadow:0 5px 0 #E2D6E2}
.btn:disabled .badge{display:none}
button:focus-visible{outline:3px dashed var(--purple);outline-offset:3px}
.badge{display:inline-block;background:#fff;color:var(--pink-d);border-radius:99px;padding:0 9px;
  font-size:12px;font-weight:800;margin-left:6px;vertical-align:2px;box-shadow:0 2px 0 rgba(0,0,0,.06)}

/* ===== 単元ボタン ===== */
.unit{display:flex;align-items:center;gap:12px;width:100%;border:none;border-radius:22px;
  padding:12px 15px;margin-top:10px;font:inherit;cursor:pointer;text-align:left;background:#fff;
  box-shadow:0 5px 0 #EFE0EA; transition:transform .08s, box-shadow .08s}
.unit:active{transform:translateY(3px);box-shadow:0 2px 0 #EFE0EA}
.unit .ic{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}
.unit .nm{flex:1;font-weight:800;font-size:15px}
.unit .ct{display:block;font-size:11.5px;font-weight:600;color:var(--ink-soft)}
.unit .ar{color:#E7D4E2;font-weight:800;font-size:20px}

/* ===== ペット ===== */
.pet{border-radius:26px;overflow:hidden;margin-top:15px;background:#fff;
  box-shadow:0 6px 0 #F0DFEC, 0 12px 26px rgba(185,150,180,.16)}
.pet .stage{position:relative;height:190px}
.pet .stage>svg.bg{position:absolute;inset:0;width:100%;height:100%}
.pet .stage>svg.ch{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);height:158px;
  animation:bob 3.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-8px)}}
@keyframes wob{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.pet .info{padding:12px 16px 16px}
.pet .nm{font-weight:800;font-size:16px}
.pet .kd{font-size:11.5px;font-weight:700;color:#fff;background:var(--purple);border-radius:99px;padding:1px 9px;margin-left:5px}
.pet .stg{font-size:12px;color:var(--ink-soft);font-weight:600}
.bar{height:14px;background:#F3EAF3;border-radius:99px;overflow:hidden;margin:8px 0 5px;padding:3px}
.bar i{display:block;height:100%;border-radius:99px;transition:width .6s cubic-bezier(.3,1.4,.5,1);
  background:linear-gradient(90deg,#FF8FB1,#FFD766,#8FDCA6,#7FC9EC,#B4A8F5)}

/* ===== クイズ ===== */
.prog{display:flex;justify-content:space-between;font-size:12.5px;font-weight:800;color:var(--ink-soft);margin-top:18px;padding:0 4px}
.pbar{height:13px;background:#fff;border-radius:99px;padding:3px;margin:6px 0 14px;box-shadow:0 3px 0 #F0E2EC}
.pbar i{display:block;height:100%;border-radius:99px;transition:width .35s;
  background:linear-gradient(90deg,#FF8FB1,#FFD766,#8FDCA6,#7FC9EC,#B4A8F5)}
.qcard{background:#fff;border-radius:24px;padding:18px;position:relative;box-shadow:0 5px 0 #F3E1EC}
.qcard .tag{display:inline-block;font-size:11px;font-weight:800;color:#fff;border-radius:99px;padding:1px 11px;margin:0 0 8px}
.qcard .qt{margin:0;font-weight:800;font-size:17px;line-height:1.7}
.mark{position:absolute;top:-40px;right:2px;width:86px;height:86px;pointer-events:none;filter:drop-shadow(0 3px 4px rgba(180,140,170,.25))}
.opt{display:flex;align-items:center;gap:12px;width:100%;border:none;background:#fff;border-radius:20px;
  padding:14px;margin-top:11px;font:inherit;font-weight:800;font-size:15.5px;cursor:pointer;text-align:left;
  color:var(--ink);box-shadow:0 5px 0 #EFE0EA;transition:transform .08s,box-shadow .08s}
.opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 #EFE0EA}
.opt .k{width:28px;height:28px;flex:none;border-radius:50%;background:#F6EEF7;color:var(--ink-soft);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.opt.ok{background:#FFF0F5;box-shadow:0 5px 0 #FFC7DB;color:var(--pink-d)}
.opt.ok .k{background:var(--pink);color:#fff}
.opt.ng{background:#EFF7FD;box-shadow:0 5px 0 #C6E3F5}
.opt.dim{opacity:.45}
.opt .res{margin-left:auto;font-size:12px;color:var(--pink-d);font-weight:800}
.exp{margin-top:15px;background:#FFFBEB;border-radius:20px;padding:14px 16px;font-size:14.5px;
  box-shadow:0 4px 0 #FBEFC7}
.exp b{display:block;font-size:12px;color:#D9A017;margin-bottom:3px;font-weight:800}
.big{display:block;margin:10px auto 0}
.pop{animation:pop .3s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.sparkle{position:absolute;font-size:19px;pointer-events:none;animation:spk 1s ease-out forwards}
@keyframes spk{0%{transform:scale(.3) rotate(0);opacity:0}30%{opacity:1}100%{transform:scale(1.3) translateY(-26px) rotate(25deg);opacity:0}}

/* ===== 地図 ===== */
.mapbox{background:linear-gradient(#DCF1FB,#EAF6FF);border-radius:22px;margin-top:13px;padding:8px;
  box-shadow:0 5px 0 #D5E9F5}
.mapbox svg{display:block;width:100%;height:auto}
.figbox{background:linear-gradient(#FFF8FD,#FFFDF4);border-radius:22px;margin-top:13px;padding:8px;
  box-shadow:0 5px 0 #F0DCEA}
.figbox svg{display:block;width:100%;height:auto}
.figbox.wide{padding:6px 4px}
.jp{fill:#FFF7E9;stroke:#F0C7A8;stroke-width:2;stroke-linejoin:round}
.ring{fill:none;stroke:#FF6E9C;stroke-width:3;animation:pulse 1.7s ease-out infinite}
@keyframes pulse{0%{r:8;opacity:.95}100%{r:30;opacity:0}}

/* ===== リスト ===== */
table.list{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:13.5px;margin-top:4px}
table.list td{background:#FDF6FB;padding:9px 12px;vertical-align:top}
table.list td:first-child{border-radius:14px 0 0 14px;font-weight:800;white-space:nowrap}
table.list td:last-child{border-radius:0 14px 14px 0;color:var(--ink-soft);font-size:12.5px}
table.list .yomi{display:block;font-weight:600;font-size:10.5px;color:var(--ink-soft)}

textarea{width:100%;height:80px;font-size:11.5px;border:2px solid var(--line);border-radius:14px;padding:9px;font-family:monospace}
.center{text-align:center}
.link{background:none;border:none;color:var(--ink-soft);text-decoration:underline;font:inherit;
  font-size:13px;font-weight:700;cursor:pointer;display:block;margin:24px auto 0}
.score{font-size:66px;font-weight:800;line-height:1;margin:4px 0;
  background:linear-gradient(95deg,#FF8FB1,#FFB067,#FFD766,#8FDCA6,#7FC9EC,#B4A8F5);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.score span{font-size:22px}
.dex{display:flex;flex-wrap:wrap;gap:9px;margin-top:4px}
.dex .d{background:#FDF3F9;border-radius:18px;padding:8px 10px;text-align:center;width:78px;box-shadow:0 3px 0 #F2E2EE}
.dex .d svg{height:52px;display:block;margin:0 auto}
.dex .d span{font-size:10.5px;font-weight:800;display:block;margin-top:2px}
.dex .d.lock{filter:grayscale(1);opacity:.45}
.wlist{background:#FDF6FB;border-radius:16px;padding:10px 13px;margin-top:9px;font-size:13.5px}
.wlist b{color:var(--pink-d)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== v3 ついか ===== */
h2.sec{margin:26px 0 2px;font-size:15.5px;color:var(--ink-soft);letter-spacing:.04em}
/* まちがいなおし（キラキラ） */
.btn.naoshi{position:relative;overflow:hidden;
  background:linear-gradient(118deg,#FFB86B,#FFD166 45%,#FFAF7A);box-shadow:0 6px 0 #E09A3C}
.btn.naoshi:active{box-shadow:0 2px 0 #E09A3C}
.btn.naoshi .nhead{display:block;font-size:17px}
.btn.naoshi .s b{background:#fff;color:#D98A1E;border-radius:99px;padding:0 7px}
.btn.naoshi::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(100deg,transparent,#ffffff66,transparent);
  animation:shine 3.4s ease-in-out infinite}
@keyframes shine{0%{left:-60%}55%{left:130%}100%{left:130%}}
.btn.naoshi .nspark{display:inline-block;animation:twinkle 1.6s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0);opacity:.95}50%{transform:scale(1.25) rotate(14deg);opacity:1}}
.btn.naoshi:disabled{background:#EFE7EF;box-shadow:0 5px 0 #E2D6E2}
.btn.naoshi:disabled::after,.btn.naoshi:disabled .nspark{display:none}

/* 地名ずかんボタン */
.btn.zukan{background:linear-gradient(118deg,#9BD6F2,#B4A8F5 55%,#E29BE8);box-shadow:0 6px 0 #8E85C9}
.btn.zukan:active{box-shadow:0 2px 0 #8E85C9}

.btn.sky{background:#6FBEE8;box-shadow:0 6px 0 #4E9AC4}
.btn.sky:active{box-shadow:0 2px 0 #4E9AC4}
.btn.mint{background:#6CC895;box-shadow:0 6px 0 #4BA474}
.btn.mint:active{box-shadow:0 2px 0 #4BA474}
.unit.fin{opacity:.62}
.unit .ct em{font-style:normal;font-size:17px;font-weight:800;letter-spacing:.02em}
.unit.fin .ct{font-weight:800}
.unit .mini{display:block;height:5px;border-radius:3px;background:#F1E7F0;margin-top:5px;overflow:hidden;width:100%}
.unit .mini i{display:block;height:100%;border-radius:3px}
.bigbar{height:14px;border-radius:9px;background:#F3E7F2;overflow:hidden;box-shadow:inset 0 1px 2px #0000000d}
.bigbar i{display:block;height:100%;border-radius:9px;
  background:linear-gradient(90deg,#FF8FB1,#FFD766,#8FDCA6,#7FC9EC,#B4A8F5)}

/* ヘッダーの あめポイント */
.best.pts b{background:linear-gradient(90deg,#FF8FB1,#FFB067);-webkit-background-clip:text;
  background-clip:text;color:transparent}

/* もどるボタン */
.homebtn{display:block;width:100%;border:none;border-radius:999px;margin:16px auto 4px;
  padding:13px 18px;font-family:inherit;font-weight:800;font-size:15px;color:#9B7FA8;
  background:#fff;box-shadow:0 4px 0 #EFE0EA;cursor:pointer;max-width:320px;
  transition:transform .08s, box-shadow .08s}
.homebtn:active{transform:translateY(3px);box-shadow:0 1px 0 #EFE0EA}
.homebtn.quit{background:#FBF2F8;color:#A98BB4;font-size:14px;box-shadow:0 4px 0 #EDDCE8}

/* コツ・しんちょく */
.card.tips{background:linear-gradient(#FFFBEF,#FFF6FB)}
.tiplist{list-style:none;margin:0;padding:0}
.tiplist li{position:relative;padding-left:27px;font-size:13.5px;line-height:2;
  color:var(--ink-soft);margin-top:11px}
.tiplist .te{position:absolute;left:0;top:1px;font-size:15px}
.tiplist mark{background-color:transparent;color:var(--ink);font-weight:800;padding:0 3px;
  background-repeat:no-repeat;background-size:100% .5em;background-position:0 94%;
  box-decoration-break:clone;-webkit-box-decoration-break:clone}
.tiplist mark.m1{background-image:linear-gradient(#FFC9DD,#FFC9DD)}
.tiplist mark.m2{background-image:linear-gradient(#FFE199,#FFE199)}
.tiplist mark.m3{background-image:linear-gradient(#BEE7F8,#BEE7F8)}
.tip1{margin:0 0 10px;background:#FFF2D6;border-radius:16px;padding:11px 14px;
  font-size:14.5px;line-height:1.7;color:#8A6A1E;font-weight:700}
.tip1 b{font-size:16.5px;color:#C77B1A}
.card.stat h2{margin-bottom:9px}
.statline{margin:9px 0 2px;font-size:17px;font-weight:800;letter-spacing:.02em}
.statline b{font-size:26px;color:var(--pink-d);margin:0 2px}
.statline span{font-size:14.5px;color:var(--ink-soft);font-weight:700;margin-left:4px}
.statnote{margin:0;font-size:12.5px;color:var(--ink-soft);line-height:1.6}
.ptsline{margin:10px 0 0;background:linear-gradient(100deg,#FFF1F7,#FFF8E8);border-radius:14px;
  padding:9px 14px;font-size:13.5px;font-weight:700;color:#A3708B}
.ptsline b{font-size:20px;color:var(--pink-d);margin:0 3px}
h2.sec{position:relative}

/* そのほかボタン */
.btn.soft.wide{text-align:left;font-size:15.5px;padding:15px 18px;margin-top:11px}
.badge2{float:right;background:#FFEFF5;color:var(--pink-d);border-radius:99px;
  padding:1px 11px;font-size:12.5px;font-weight:800}
details.fold{margin-top:14px;background:var(--card);border-radius:22px;padding:4px 18px;
  box-shadow:0 5px 0 #F1E3EE}
details.fold summary{cursor:pointer;list-style:none;padding:14px 0;font-weight:800;font-size:15.5px}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary::after{content:"▾";float:right;color:var(--ink-soft)}
details.fold[open] summary::after{content:"▴"}
details.fold[open]{padding-bottom:16px}

/* 地名リスト */
.grow{display:flex;align-items:center;gap:10px;width:100%;border:none;background:#FDF6FB;
  border-radius:16px;padding:11px 13px;margin-top:7px;font-family:inherit;text-align:left;
  cursor:pointer;line-height:1.6}
.grow.on{background:#FFF0F7;box-shadow:0 0 0 2px #FFC7DB inset}
.grow .gn{font-weight:800;font-size:14.5px;flex:none;width:33%}
.grow .gn .yomi{display:block;font-size:10.5px;color:var(--ink-soft);font-weight:600}
.grow .gd{flex:1;font-size:12.5px;color:var(--ink-soft)}
.grow .gar{flex:none;font-size:14px;opacity:.6}
.mapbox.sel{margin-top:8px;position:relative}
.selname{position:absolute;left:16px;top:12px;margin:0;font-size:16px;font-weight:800;
  background:#ffffffcc;border-radius:999px;padding:4px 14px}
.selname span{display:block;font-size:10.5px;color:var(--ink-soft);font-weight:600}

/* ひつようラベル */
.need{display:inline-block;font-size:11.5px;font-weight:800;border-radius:999px;padding:3px 10px;margin-bottom:6px}
.need.k{background:#FFE6EF;color:#D4547E}
.need.a{background:#E6F6EC;color:#4F9E6C}
.need.j{background:#EDE8FD;color:#7566C9}

/* てがきパッド */
.padwrap{position:relative;margin-top:13px;background:#fff;border-radius:22px;
  box-shadow:0 5px 0 #EFE0EA;padding:8px;border:2px dashed #F0DCEA}
.padwrap canvas{display:block;width:100%;height:170px;touch-action:none;border-radius:16px;background:#fff}
.padwrap.tall canvas{height:230px}
.padhint{position:absolute;left:18px;top:14px;font-size:12.5px;color:#D9C6D6;pointer-events:none;font-weight:700}
.padclr{position:absolute;right:12px;bottom:12px;border:none;background:#FDF2F8;color:var(--pink-d);
  font-weight:800;font-size:13px;border-radius:999px;padding:7px 15px;box-shadow:0 3px 0 #F2DCE9;
  font-family:inherit;cursor:pointer}
.padclr:active{transform:translateY(2px);box-shadow:0 1px 0 #F2DCE9}

/* こたえ */
.ansbox{margin-top:14px;background:linear-gradient(#FFF4FA,#FFFBF2);border-radius:22px;
  padding:14px 18px;box-shadow:0 5px 0 #F4DEEA;text-align:center}
.ansbox small{display:block;font-size:11.5px;color:var(--ink-soft);font-weight:800;letter-spacing:.1em}
.ansbox b{display:block;font-size:32px;line-height:1.45;color:var(--pink-d);letter-spacing:.06em}
.ansbox b.long{font-size:19px;line-height:1.7;letter-spacing:.02em}
.yomi2{display:block;font-size:13px;color:var(--ink-soft);margin-top:2px}

/* 自己さいてん */
.jlead{text-align:center;font-size:13.5px;color:var(--ink-soft);font-weight:700;margin:16px 0 8px}
.judge{display:flex;gap:9px}
.judge .j{flex:1;border:none;border-radius:20px;padding:14px 4px 12px;font-family:inherit;
  font-weight:800;font-size:13.5px;color:var(--ink);cursor:pointer;line-height:1.3}
.judge .j b{display:block;font-size:26px;line-height:1.1;margin-bottom:3px}
.judge .ok{background:#FFEFF5;box-shadow:0 5px 0 #FFC7DB;color:var(--pink-d)}
.judge .mid{background:#FFF7E4;box-shadow:0 5px 0 #FBE2AE;color:#C08C2B}
.judge .ng{background:#EFF7FD;box-shadow:0 5px 0 #C6E3F5;color:#4F8DB5}
.judge .j:active{transform:translateY(3px);box-shadow:0 2px 0 #E8D8E4}

/* にたものチェック */
.qcard .qt.big{font-size:20px;line-height:1.7}
.qcard.center{text-align:center}
.pairbtn{display:block;width:100%;border:none;background:#fff;border-radius:22px;
  padding:19px 16px;margin-top:11px;font-family:inherit;font-weight:800;font-size:18px;
  color:var(--ink);box-shadow:0 5px 0 #EFE0EA;cursor:pointer;line-height:1.5}
.pairbtn:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 #EFE0EA}
.pairbtn.ok{background:#FFF0F5;box-shadow:0 5px 0 #FFC7DB;color:var(--pink-d)}
.pairbtn.ng{background:#EFF7FD;box-shadow:0 5px 0 #C6E3F5}
.pairbtn.dim{opacity:.4}

/* 計算 */
.numbox{margin-top:13px;background:#fff;border-radius:22px;padding:16px;text-align:center;
  box-shadow:0 5px 0 #E2EFE7;display:flex;align-items:baseline;justify-content:center;gap:8px}

function pickPool(list,n){
  const a=shuffle(list);
  a.sort((x,y)=>{
    const wx=S.wrong[x.id]!==undefined?0:1, wy=S.wrong[y.id]!==undefined?0:1;
    if(wx!==wy)return wx-wy;
    return lvOf(x.id)-lvOf(y.id);
  });
  return a.slice(0,n);
}

let strokes=[],drawing=false,cur=null;
function clearPad(){strokes=[];redraw();}
function padEl(){return document.getElementById("pad");}
function setupPad(){
  const c=padEl(); if(!c)return;
  const r=c.getBoundingClientRect();
  const dpr=Math.min(window.devicePixelRatio||1,2);
  c.width=Math.round(r.width*dpr); c.height=Math.round(r.height*dpr);
  const g=c.getContext("2d"); g.scale(dpr,dpr);
  redraw();
  const pos=e=>{const b=c.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top];};
  c.onpointerdown=e=>{if(answered)return;c.setPointerCapture(e.pointerId);drawing=true;cur=[pos(e)];strokes.push(cur);redraw();};
  c.onpointermove=e=>{if(!drawing)return;cur.push(pos(e));redraw();};
  c.onpointerup=c.onpointercancel=()=>{drawing=false;cur=null;};
}
function paint(g,w,h,sc,lw,bg,guide){
  g.clearRect(0,0,w,h);
  if(bg){g.fillStyle=bg; g.fillRect(0,0,w,h);}
  if(guide){
    g.save(); g.strokeStyle="#F2E6F0"; g.lineWidth=1.4; g.setLineDash([5,6]);
    g.beginPath(); g.moveTo(10,h/2); g.lineTo(w-10,h/2); g.stroke();
    for(let i=1;i<4;i++){g.beginPath();g.moveTo(w*i/4,10);g.lineTo(w*i/4,h-10);g.stroke();}
    g.restore();
  }
  g.strokeStyle="#4A3C48"; g.lineWidth=lw; g.lineCap="round"; g.lineJoin="round";
  strokes.forEach(s=>{
    if(s.length<2){g.beginPath();g.arc(s[0][0]*sc,s[0][1]*sc,lw/2,0,7);g.fillStyle="#4A3C48";g.fill();return;}
    g.beginPath(); g.moveTo(s[0][0]*sc,s[0][1]*sc);
    for(let i=1;i<s.length;i++)g.lineTo(s[i][0]*sc,s[i][1]*sc);
    g.stroke();
  });
}
function redraw(){
  const c=padEl(); if(!c)return;
  const r=c.getBoundingClientRect();
  paint(c.getContext("2d"),r.width,r.height,1,3.4,"#FFFFFF",true);
}
/* 親チェック用に小さくして保存 */
function padThumb(){
  if(!strokes.length)return "";
  const c=padEl(); if(!c)return "";
  const r=c.getBoundingClientRect();
  const W=340, sc=W/r.width, H=Math.round(r.height*sc);
  const o=document.createElement("canvas"); o.width=W; o.height=H;
  const g=o.getContext("2d");
  paint(g,W,H,sc,2.8,"#FFFFFF",false);
  try{return o.toDataURL("image/jpeg",0.55);}catch(e){return "";}
}

/* =========================================================
   9. ごほうび
   ========================================================= */
function stageOf(xp){let s=0;for(let i=0;i<LV.length;i++)if(xp>=LV[i])s=i;return s;}
function addXP(n){
  S.xp+=n; S.pts=(S.pts||0)+n;
  if(S.xp>=LV[LV.length-1]){
    const p=PETS[S.pet%PETS.length];
    if(!S.dex.includes(p.name))S.dex.push(p.name);
    const rest=PETS.map((_,i)=>i).filter(i=>!S.dex.includes(PETS[i].name));
    S.pet = rest.length ? rest[Math.random()*rest.length|0] : (S.pet+1)%PETS.length;
    S.xp=0;
    flashMsg="🎉 "+p.name+" が にじいろマスターに なりました！ 図かん "+S.dex.length+"／"+PETS.length+" だよ。"+(S.dex.length>=PETS.length?"ぜんいんコンプリート、すごい！🏆":"あたらしいなかまのたまごが とどいたよ🥚");
  }
  save();
}

/* ---- かきとり ---- */
function start(m){
  let pool;
  if(m.type==="unit")pool=ITEMS.filter(i=>i.unit===m.unit&&lvOf(i.id)<MASTER);
  else if(m.type==="review")pool=wrongIds().map(byId);
  else if(m.type==="osusume")pool=ITEMS.filter(i=>lvOf(i.id)<MASTER);
  if(!pool||!pool.length){flashMsg="このセットは ぜんぶ おぼえたよ！🏆 ほかのところを やってみよう。";render();return;}
  mode=m; deck=pickPool(pool,m.n||5); idx=0; answered=false; strokes=[];
  sess={ok:0,mid:0,ng:0}; sessLog=[];
  go("quiz");
}
function reveal(){answered=true;render();}
function judge(k){
  const it=deck[idx], id=it.id;
  if(k===2){
    S.m[id]=Math.min(MASTER,lvOf(id)+1);
    delete S.wrong[id];
    addXP(mode.type==="review"?3:2);
    const th=padThumb();
    if(th){S.proof.push({id:id,d:th,t:Date.now()}); if(S.proof.length>30)S.proof=S.proof.slice(-30);}
    sess.ok++;
  }else if(k===1){
    S.wrong[id]=1; sess.mid++;
    addXP(1);
  }else{
    S.m[id]=0; S.wrong[id]=1; sess.ng++;
  }
  sessLog.push({id:id,k:k});
  S.done++; save();
  if(idx+1<deck.length){idx++;answered=false;strokes=[];render();}
  else go("result");
}

/* ---- にたものチェック ---- */
function startPair(){
  const all=[];
  PAIRS.forEach((p,pi)=>p[2].forEach((h,hi)=>all.push({pi:pi,hi:hi})));
  pair={deck:shuffle(all).slice(0,10),i:0,ok:0,picked:null,t0:Date.now(),ms:0};
  go("pair");
}
function pairPick(side){
  if(pair.picked!==null)return;
  const d=pair.deck[pair.i], p=PAIRS[d.pi], h=p[2][d.hi];
  pair.picked=side;
  if(side===h[1]){pair.ok++;addXP(1);}
  save(); render();
  setTimeout(()=>{
    if(pair.i+1<pair.deck.length){pair.i++;pair.picked=null;render();}
    else{pair.ms=Date.now()-pair.t0;
      if(pair.ok===pair.deck.length){addXP(10);if(!S.pairBest||pair.ms<S.pairBest)S.pairBest=pair.ms;save();}
      go("pairend");}
  }, side===h[1]?620:1500);
}

/* ---- 人口みつどの計算 ---- */
function startKei(){
  kei={deck:shuffle(KEISAN.map((k,i)=>i)).slice(0,5),i:0,inp:"",res:null,ok:0};
  go("kei");
}
function keiTap(c){
  if(kei.res!==null)return;
  if(c==="C")kei.inp="";
  else if(c==="<")kei.inp=kei.inp.slice(0,-1);
  else if(kei.inp.length<7)kei.inp+=c;
  render();
}
function keiCheck(){
  if(kei.res!==null||kei.inp==="")return;
  const k=KEISAN[kei.deck[kei.i]];
  kei.res = (parseFloat(kei.inp)===k[1]);
  if(kei.res){kei.ok++;addXP(2);} save(); render();
}
function keiNext(){
  if(kei.i+1<kei.deck.length){kei.i++;kei.inp="";kei.res=null;render();}
  else{if(kei.ok===kei.deck.length){addXP(10);S.kBest=Math.max(S.kBest||0,kei.ok);save();}go("keiend");}
}

  const a=3+Math.random()*9|0, b=11+Math.random()*9|0;

  const el=document.getElementById("oyaIn");

  const p=S.proof[i]; if(!p)return;
  S.m[p.id]=0; S.wrong[p.id]=1;
  S.proof.splice(i,1); save(); render();
}

function fluff(cx,cy,r,n){
  const pts=[];
  for(let i=0;i<n;i++){const a=Math.PI*2*i/n-Math.PI/2;pts.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r]);}
  const amp=(2*r*Math.sin(Math.PI/n)*0.66).toFixed(1);
  let d="M"+pts[0][0].toFixed(1)+","+pts[0][1].toFixed(1);
  for(let i=1;i<=n;i++){const p=pts[i%n];d+="A"+amp+","+amp+" 0 0 1 "+p[0].toFixed(1)+","+p[1].toFixed(1);}
  return d+"Z";
}

      <p class="tip1">△ をつけるのは はずかしくない。<br><b>△が いちばん 点につながる。</b></p>
      <ul class="tiplist">
      <li><span class="te">🗣</span>にた2つ（過密と過疎、亜熱帯と冷帯）は <mark class="m1">かならず声に出して</mark> 区別する</li>
      <li><span class="te">✏️</span>地名は ひらがなで言えても ×。<mark class="m2">漢字で手を動かす</mark>こと</li>
      <li><span class="te">📝</span>記述で「気温と降水量にふれて」とあれば <mark class="m3">両方に1回ずつふれる</mark></li></ul></div>`;

    h+=`<button class="btn rainbow" onclick='start({type:"osusume",n:5})'>✍️ かきとり（5もん）
      <span class="s">まちがえたもの → まだおぼえていないもの の順に 5もん。ゆびで書いて、じぶんで丸つけ。</span></button>`;
    h+=`<button class="btn sky" onclick="startPair()">⚡ にたものチェック（10もん）
      <span class="s">「扇状地と三角州」みたいに まちがえやすい 2つを 見分ける練習。${S.pairBest?"ベスト "+fmtMs(S.pairBest):"タイムをきそおう！"}</span></button>`;
    h+=`<button class="btn naoshi" ${wc?"":"disabled"} onclick='start({type:"review",n:5})'>
      <span class="nhead"><span class="nspark">✨</span>🔁 まちがいなおし${wc?`<span class="badge">${wc}もん</span>`:""}</span>
      <span class="s">${wc?`ここが いちばん 点がのびるところ！ ◎をつけたら そつぎょう🎓 あめも <b>🍬3こ</b> ともらえる`:"△や×をつけると ここにたまるよ。"}</span></button>`;

    h+=`<div class="card stat"><h2>⭐ 社会 おぼえたじょうきょう</h2>
      <div class="bigbar"><i style="width:${pct}%"></i></div>
      <p class="statline">おぼえた <b>${tot-rem}</b> / ${tot}もん　<span>復習まち ${wc}もん</span></p>
      <p class="statnote">※おなじもんだいに 3回 ◎ をつけると「おぼえた」！</p>
      <p class="ptsline">これまでに ためた 🍬あめ <b>${(S.pts||0).toLocaleString("ja-JP")}</b>こ</p></div>`;

    h+=`<h2 class="sec">🎎 11／13のテストはんい</h2>`;
    ["bunka","jinko"].forEach(u=>h+=unitBtn(u));
    h+=`<button class="btn mint" onclick="startKei()">🧮 人口みつどの 計算（5もん）
      <span class="s">人口密度＝人口÷面積。数字を おして こたえよう。</span></button>`;

    h+=`<h2 class="sec">🗾 11／9の学力テストはんい</h2>`;
    ["kokudo","chikei","kikou","takahiku","atatakai","todofu","sekai"].forEach(u=>h+=unitBtn(u));

    h+=`<h2 class="sec">📊 グラフ・図を読む</h2>`;
    ["ame","zukei"].forEach(u=>h+=unitBtn(u));

    h+=`<h2 class="sec">✍️ 記述（文で答える）</h2>`;
    h+=unitBtn("kijutsu");

    h+=`<h2 class="sec">🗺 地図（漢字で書く）</h2>`;
    ["mSan","mHei","mKawa"].forEach(u=>h+=unitBtn(u));
    h+=`<button class="btn zukan" onclick="go('list')">📖 地名の一らんを 見ておぼえる
      <span class="s">名前をおすと、日本地図の どこにあるかが ★で出るよ 🗾✨</span></button>`;

    h+=`<div class="card"><h2>🏅 そだてた図かん（${S.dex.length}／${PETS.length}）</h2><div class="dex">`;
    PETS.forEach((p,i)=>{const got=S.dex.includes(p.name);
      h+=`<div class="d ${got?"":"lock"}">${creatureSVG(i,got?4:1,52,"")}<span>${got?p.name:"？？？"}</span></div>`;});
    h+=`</div></div>`;

    h+=`<h2 class="sec">🔧 そのほか</h2>`;
    h+=`<button class="btn soft wide" onclick="oyaGate()">👩 おうちの人チェック${S.proof.length?`<span class="badge2">${S.proof.length}まい</span>`:""}</button>`;
    h+=`<button class="btn soft wide" onclick="go('backup')">💾 バックアップ</button>`;

    h+=`<details class="fold"><summary>📋 テストの日と はんい</summary>
      <p class="muted" style="margin:10px 0 6px"><b>11／9（月）学力テスト</b><br>
      まとめ（地図／わたしたちのくらし／都道府県／世界の国々／日本の国土／日本の地形／高い土地と低い土地／日本の気候／あたたかい土地と寒い土地）</p>
      <p class="muted" style="margin:0"><b>11／13（金）社会科テスト</b><br>
      もんだい集 P.53〜65「9 日本の文化と生活」「10 日本の人口」</p></details>`;

    h+=`<p class="muted center" style="margin-top:16px">これまでに といたもんだい：${S.done}もん</p>`;
  }

  /* ================= バックアップ ================= */
  if(view==="backup"){
    h+=`<div class="card"><h2>💾 バックアップ</h2>
      <p class="muted" style="margin:0 0 6px">きろくは自動でほぞんされます。ほかのタブレットにうつすときは下をコピーしてね。</p>
      <textarea readonly>${JSON.stringify(Object.assign({},S,{proof:[]}))}</textarea>
      <button class="btn soft" onclick="restore()">はりつけて ふくげんする</button></div>`;
    h+=`<button class="homebtn" onclick="go('home')">🏠 ホームにもどる</button>`;
  }

  /* ================= 地名一覧 ================= */
  if(view==="list"){
    h+=`<p class="muted center" style="margin:4px 0 0">名前をおすと、地図のどこにあるかが出ます。</p>`;
    h+=`<div class="card"><h2>🏔️ 山地・山脈・高地</h2>${listTable("mSan")}</div>`;
    h+=`<div class="card"><h2>🌾 平野・盆地</h2>${listTable("mHei")}</div>`;
    h+=`<div class="card"><h2>💧 川</h2>${listTable("mKawa")}</div>`;
    h+=`<button class="homebtn" onclick="go('home')">🏠 ホームにもどる</button>`;
  }

  /* ================= かきとり ================= */
  if(view==="quiz"){
    const it=deck[idx],U=UNITS[it.unit];
    const label=mode.type==="review"?"🔁 まちがいなおし":mode.type==="osusume"?"✍️ かきとり":U.ic+" "+U.name;
    h+=`<div class="prog"><span>${label}</span><span>${idx+1} / ${deck.length}　🌸 ${sess.ok}</span></div>
        <div class="pbar"><i style="width:${(idx+(answered?1:0))/deck.length*100}%"></i></div>`;
    h+=`<div class="qcard"><span class="tag" style="background:${U.col}">${U.name}</span>
        ${NEEDLABEL[it.need]||""}<p class="qt">${it.text}</p></div>`;
    if(it.kind==="map")h+=`<div class="mapbox">${mapSVG(GEO[it.geo][3],GEO[it.geo][4])}</div>`;
    if(it.kind==="ame")h+=`<div class="figbox">${ameSVG(it.ame)}</div>`;
    if(it.kind==="fig")h+=`<div class="${it.fig==="kairyu"||it.fig==="fossa"?"mapbox":"figbox wide"}">${figSVG(it.fig)}</div>`;

    h+=`<div class="padwrap ${it.need==="kijutsu"?"tall":""}">
      <canvas id="pad"></canvas>
      <span class="padhint">ここに ゆびで 書いてね</span>
      <button class="padclr" onclick="clearPad()">けす</button></div>`;

    if(!answered){
      h+=`<button class="btn" onclick="reveal()" style="text-align:center">かけた！ こたえを見る 👀</button>`;
    }else{
      h+=`<div class="ansbox pop"><small>こたえ</small>
        <b class="${it.need==="kijutsu"?"long":""}">${it.ans}</b>
        ${it.yomi?`<span class="yomi2">${it.yomi}</span>`:""}</div>`;
      h+=`<div class="exp"><b>🍯 かいせつ</b>${it.exp}</div>`;
      h+=`<p class="jlead">じぶんの字と 見くらべよう。どうだった？</p>
        <div class="judge">
          <button class="j ok" onclick="judge(2)"><b>◎</b>かけた</button>
          <button class="j mid" onclick="judge(1)"><b>△</b>おしい</button>
          <button class="j ng" onclick="judge(0)"><b>×</b>かけなかった</button>
        </div>
        <p class="muted center" style="font-size:12.5px;margin:10px 0 0">
        ${it.need==="kanji"?"漢字でまちがえずに書けたときだけ ◎ にしてね。":"いみが合っていれば ◎ でOK。"}</p>`;
    }
    h+=`<button class="homebtn quit" onclick="go('home')">🏠 やめて ホームにもどる</button>`;
  }

  /* ================= けっか ================= */
  if(view==="result"){
    const full=sess.ok===deck.length;
    h+=`<div class="card center pop"><p class="muted" style="margin:0">かきとりの けっか</p>
      <p class="score">${sess.ok}<span> / ${deck.length}もん</span></p>
      <p style="margin:0;font-weight:800">${full?"🌸 ぜんもん ◎！ この調子！":sess.ok>=deck.length*0.6?"🔥 いいペース！ △と×を もう一回":"💪 △と×が のびしろ。まちがいなおしへ！"}</p>
      <p class="muted" style="margin:8px 0 0">◎ ${sess.ok}　△ ${sess.mid}　× ${sess.ng}</p>
      ${full?creatureSVG(S.pet,stageOf(S.xp),120,"big"):""}</div>`;
    const bad=sessLog.filter(x=>x.k<2);
    if(bad.length){
      h+=`<div class="card"><h2>📝 もう一度やるもんだい（${bad.length}）</h2>`;
      bad.forEach(x=>{const it=byId(x.id);
        h+=`<div class="wlist">${it.kind==="map"?"地図の★ → ":it.text+"<br>"}<b>こたえ：${it.ans}</b></div>`;});
      h+=`</div><button class="btn honey" onclick='start({type:"review",n:5})' style="text-align:center">🔁 いますぐ まちがいなおしをする</button>`;
    }
    h+=`<button class="btn" onclick='start(mode)' style="text-align:center">つぎの5もん</button>
        <button class="btn soft" onclick="go('home')">ホームにもどる</button>`;
  }

  /* ================= にたものチェック ================= */
  if(view==="pair"){
    const d=pair.deck[pair.i],p=PAIRS[d.pi],hint=p[2][d.hi];
    h+=`<div class="prog"><span>⚡ にたものチェック</span><span>${pair.i+1} / ${pair.deck.length}　🌸 ${pair.ok}</span></div>
        <div class="pbar"><i style="width:${(pair.i+(pair.picked!==null?1:0))/pair.deck.length*100}%"></i></div>`;
    h+=`<div class="qcard center"><p class="muted" style="margin:0 0 4px;font-size:13px">どっち？</p>
        <p class="qt big">${hint[0]}</p></div>`;
    [0,1].forEach(s=>{
      let cls="";
      if(pair.picked!==null)cls = s===hint[1]?"ok":(s===pair.picked?"ng":"dim");
      h+=`<button class="pairbtn ${cls}" ${pair.picked!==null?"disabled":""} onclick="pairPick(${s})">${p[s]}</button>`;
    });
    if(pair.picked!==null){
      const right=pair.picked===hint[1];
      h+=`<div class="exp pop" style="${right?"":"background:#EFF7FD"}"><b>${right?"🌸 せいかい":"😣 ざんねん"}</b>
        ${hint[0]} ＝ <b>${p[hint[1]]}</b></div>`;
    }
    h+=`<button class="homebtn quit" onclick="go('home')">🏠 やめて ホームにもどる</button>`;
  }
  if(view==="pairend"){
    const full=pair.ok===pair.deck.length;
    h+=`<div class="card center pop"><p class="muted" style="margin:0">にたものチェックの けっか</p>
      <p class="score">${pair.ok}<span> / ${pair.deck.length}</span></p>
      <p style="margin:0;font-weight:800">${full?"🌸 パーフェクト！ タイム "+fmtMs(pair.ms):"もう一回やると もっと速くなるよ"}</p>
      ${S.pairBest?`<p class="muted" style="margin:6px 0 0">ベストタイム ${fmtMs(S.pairBest)}</p>`:""}</div>`;
    h+=`<button class="btn sky" onclick="startPair()" style="text-align:center">もう一回ちょうせん</button>
        <button class="btn soft" onclick="go('home')">ホームにもどる</button>`;
  }

  /* ================= 計算 ================= */
  if(view==="kei"){
    const k=KEISAN[kei.deck[kei.i]];
    h+=`<div class="prog"><span>🧮 人口みつど</span><span>${kei.i+1} / ${kei.deck.length}　🌸 ${kei.ok}</span></div>
        <div class="pbar"><i style="width:${(kei.i+(kei.res!==null?1:0))/kei.deck.length*100}%"></i></div>`;
    h+=`<div class="qcard"><span class="tag" style="background:#8FDCA6">人口みつど</span><p class="qt">${k[0]}</p></div>`;
    h+=`<div class="numbox"><span class="numv">${kei.inp||"…"}</span><span class="numu">${k[2]}</span></div>`;
    if(kei.res===null){
      h+=`<div class="pad10">`;
      ["7","8","9","4","5","6","1","2","3","0","<","C"].forEach(c=>
        h+=`<button class="nk ${c==="C"||c==="<"?"fn":""}" onclick="keiTap('${c}')">${c==="<"?"⌫":c}</button>`);
      h+=`</div><button class="btn mint" onclick="keiCheck()" style="text-align:center">こたえあわせ</button>`;
    }else{
      h+=`<div class="ansbox pop"><small>こたえ</small><b>${k[1]}${k[2]}</b></div>
        <div class="exp"><b>${kei.res?"🌸 せいかい":"😣 おしい"}</b>${k[3]}</div>
        <button class="btn" onclick="keiNext()" style="text-align:center">${kei.i+1<kei.deck.length?"つぎのもんだいへ →":"けっかを見る"}</button>`;
    }
    h+=`<button class="homebtn quit" onclick="go('home')">🏠 やめて ホームにもどる</button>`;
  }
  if(view==="keiend"){
    h+=`<div class="card center pop"><p class="muted" style="margin:0">人口みつどの けっか</p>
      <p class="score">${kei.ok}<span> / ${kei.deck.length}</span></p>
      <p style="margin:0;font-weight:800">${kei.ok===kei.deck.length?"🌸 ぜんもん正かい！ 計算はバッチリ":"式は「人口÷面積」。もう一回！"}</p></div>`;
    h+=`<button class="btn mint" onclick="startKei()" style="text-align:center">もう一回ちょうせん</button>
        <button class="btn soft" onclick="go('home')">ホームにもどる</button>`;
  }

  /* ================= おうちの人チェック ================= */
  if(view==="oya"){
    if(!oyaOK){
      h+=`<div class="card"><h2>👩 おうちの人チェック</h2>
        <p class="muted" style="margin:0 0 10px">ここから先は おうちの人が見るページです。計算に答えてください。</p>
        <p style="font-size:22px;font-weight:800;margin:0 0 8px">${oyaQ.a} × ${oyaQ.b} = ?</p>
        <input id="oyaIn" class="oyain" type="number" inputmode="numeric" placeholder="こたえ">
        <button class="btn soft" onclick="oyaTry()">ひらく</button></div>
        <button class="homebtn" onclick="go('home')">🏠 ホームにもどる</button>`;
    }else{
      h+=`<div class="card"><h2>👩 おうちの人チェック（${S.proof.length}まい）</h2>
        <p class="muted" style="margin:0">乙葉さんが「◎ かけた」と自己採点したものです。<br>
        <b>字がちがう／漢字になっていない</b>ものは「×にもどす」を押すと、まちがいなおしに戻ります。</p></div>`;
      if(!S.proof.length){
        h+=`<div class="card center"><p class="muted" style="margin:0">チェックするものは ありません。</p></div>`;
      }else{
        S.proof.slice().reverse().forEach((p,ri)=>{
          const i=S.proof.length-1-ri, it=byId(p.id); if(!it)return;
          h+=`<div class="card proof">
            <p class="pq">${it.kind==="map"?"地図の★":it.text}</p>
            <img src="${p.d}" alt="手書き">
            <p class="pa">正かい：<b>${it.ans}</b> ${it.need==="kanji"?'<span class="need k">漢字ひっす</span>':""}</p>
            <div class="prow">
              <button class="pb ng" onclick="oyaNG(${i})">× にもどす</button>
              <button class="pb ok" onclick="oyaOKd(${i})">◎ でOK</button></div></div>`;
        });
        h+=`<button class="btn soft" onclick="oyaClear()">のこりぜんぶ「できていた」にする</button>`;
      }
      h+=`<button class="homebtn" onclick="go('home')">🏠 ホームにもどる</button>`;
    }
  }

  app.innerHTML=h;
  if(view==="quiz")setupPad();
}
function restore(){
  const t=prompt("バックアップの文字をはりつけて OK をおしてね。");
  if(!t)return;
  try{S=Object.assign(S,JSON.parse(t));S.proof=S.proof||[];save();alert("ふくげんしました！");render();}
  catch(e){alert("うまく読みこめませんでした。文字をぜんぶコピーできているか かくにんしてね。");}
}
window.addEventListener("resize",()=>{if(view==="quiz")setupPad();});
render();

</script>
