<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>にじいろ社会ノート｜日本の気候と地形</title>
<style>
:root{
  --pink:#FF8FB1; --pink-d:#E86D93;
  --orange:#FFB067; --yellow:#FFD766;
  --green:#8FDCA6; --blue:#7FC9EC; --purple:#B4A8F5; --violet:#E29BE8;
  --ink:#5B4A57; --ink-soft:#96859A;
  --card:#FFFFFF; --line:#F3E4EE;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  color:var(--ink); font-size:16px; line-height:1.75;
  font-family:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN W4","Yu Gothic",system-ui,sans-serif;
  background:#FFF4FA;
  background-image:
    radial-gradient(circle at 12% 8%, #FFE3F0 0 22%, transparent 22%),
    radial-gradient(circle at 88% 22%, #E6E7FF 0 20%, transparent 20%),
    radial-gradient(circle at 20% 92%, #DFF5EA 0 24%, transparent 24%),
    linear-gradient(#FFF7FC,#F6F2FF);
  background-attachment:fixed;
  padding-bottom:env(safe-area-inset-bottom);
}
.wrap{max-width:560px;margin:0 auto;padding:0 15px 70px}

/* ===== ヘッダー ===== */
header{
  background:linear-gradient(100deg,#FFA9C6,#FFC79A,#FFE58A,#9BE5B4,#8FD3F4,#BDB2F7,#EBA6EE);
  padding:16px 0 20px; border-radius:0 0 30px 30px; position:relative; overflow:hidden;
  box-shadow:0 6px 0 rgba(255,175,205,.35);
}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:14px;
  background:radial-gradient(circle at 10px -2px,#fff 8px,transparent 9px) repeat-x;background-size:20px 14px}
.hd{max-width:560px;margin:0 auto;padding:0 15px;display:flex;align-items:center;gap:10px}
.hd button{background:none;border:none;padding:0;flex:1;text-align:left;cursor:pointer;font-family:inherit;color:#fff}
.hd h1{margin:0;font-size:20px;font-weight:800;letter-spacing:.04em;text-shadow:0 2px 0 rgba(230,120,160,.45)}
.hd .sub{margin:0;font-size:11px;font-weight:700;letter-spacing:.16em;color:#fff;opacity:.95}
.hd .best{background:#fff;border-radius:16px;padding:5px 11px;text-align:center;box-shadow:0 3px 0 rgba(232,109,147,.3)}
.hd .best small{display:block;font-size:9px;color:var(--ink-soft);letter-spacing:.1em}
.hd .best b{font-size:20px;color:var(--pink-d);line-height:1}

/* ===== カード・ボタン ===== */
.card{background:var(--card);border-radius:24px;padding:16px 17px;margin-top:15px;
  box-shadow:0 5px 0 #F3E1EC, 0 10px 22px rgba(190,150,180,.13)}
.card h2{margin:0 0 7px;font-size:15px;font-weight:800;display:flex;align-items:center;gap:6px}
.muted{color:var(--ink-soft);font-size:13.5px}
.btn{display:block;width:100%;border:none;border-radius:22px;padding:15px 18px;margin-top:12px;
  font:inherit;font-weight:800;font-size:16px;color:#fff;cursor:pointer;text-align:left;
  background:var(--pink); box-shadow:0 6px 0 var(--pink-d); transition:transform .08s, box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--pink-d)}
.btn .s{display:block;font-size:12.5px;font-weight:600;opacity:.95;margin-top:2px;line-height:1.5}
.btn.rainbow{background:linear-gradient(95deg,#FF8FB1,#FFB067,#FFD766,#8FDCA6,#7FC9EC,#B4A8F5);box-shadow:0 6px 0 #D9A0C6}
.btn.rainbow:active{box-shadow:0 2px 0 #D9A0C6}
.btn.honey{background:#FFC24D;box-shadow:0 6px 0 #E2A22C}
.btn.honey:active{box-shadow:0 2px 0 #E2A22C}
.btn.soft{background:#fff;color:var(--ink);box-shadow:0 5px 0 #EFE0EA;text-align:center;font-size:15px}
.btn.soft:active{box-shadow:0 1px 0 #EFE0EA}
.btn:disabled{background:#EFE7EF;color:#B7A8B7;box-shadow:0 5px 0 #E2D6E2}
.btn:disabled .badge{display:none}
button:focus-visible{outline:3px dashed var(--purple);outline-offset:3px}
.badge{display:inline-block;background:#fff;color:var(--pink-d);border-radius:99px;padding:0 9px;
  font-size:12px;font-weight:800;margin-left:6px;vertical-align:2px;box-shadow:0 2px 0 rgba(0,0,0,.06)}

/* ===== 単元ボタン ===== */
.unit{display:flex;align-items:center;gap:12px;width:100%;border:none;border-radius:22px;
  padding:12px 15px;margin-top:10px;font:inherit;cursor:pointer;text-align:left;background:#fff;
  box-shadow:0 5px 0 #EFE0EA; transition:transform .08s, box-shadow .08s}
.unit:active{transform:translateY(3px);box-shadow:0 2px 0 #EFE0EA}
.unit .ic{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}
.unit .nm{flex:1;font-weight:800;font-size:15px}
.unit .ct{display:block;font-size:11.5px;font-weight:600;color:var(--ink-soft)}
.unit .ar{color:#E7D4E2;font-weight:800;font-size:20px}

/* ===== ペット ===== */
.pet{border-radius:26px;overflow:hidden;margin-top:15px;background:#fff;
  box-shadow:0 6px 0 #F0DFEC, 0 12px 26px rgba(185,150,180,.16)}
.pet .stage{position:relative;height:190px}
.pet .stage>svg.bg{position:absolute;inset:0;width:100%;height:100%}
.pet .stage>svg.ch{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);height:158px;
  animation:bob 3.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-8px)}}
@keyframes wob{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.pet .info{padding:12px 16px 16px}
.pet .nm{font-weight:800;font-size:16px}
.pet .kd{font-size:11.5px;font-weight:700;color:#fff;background:var(--purple);border-radius:99px;padding:1px 9px;margin-left:5px}
.pet .stg{font-size:12px;color:var(--ink-soft);font-weight:600}
.bar{height:14px;background:#F3EAF3;border-radius:99px;overflow:hidden;margin:8px 0 5px;padding:3px}
.bar i{display:block;height:100%;border-radius:99px;transition:width .6s cubic-bezier(.3,1.4,.5,1);
  background:linear-gradient(90deg,#FF8FB1,#FFD766,#8FDCA6,#7FC9EC,#B4A8F5)}

/* ===== クイズ ===== */
.prog{display:flex;justify-content:space-between;font-size:12.5px;font-weight:800;color:var(--ink-soft);margin-top:18px;padding:0 4px}
.pbar{height:13px;background:#fff;border-radius:99px;padding:3px;margin:6px 0 14px;box-shadow:0 3px 0 #F0E2EC}
.pbar i{display:block;height:100%;border-radius:99px;transition:width .35s;
  background:linear-gradient(90deg,#FF8FB1,#FFD766,#8FDCA6,#7FC9EC,#B4A8F5)}
.qcard{background:#fff;border-radius:24px;padding:18px;position:relative;box-shadow:0 5px 0 #F3E1EC}
.qcard .tag{display:inline-block;font-size:11px;font-weight:800;color:#fff;border-radius:99px;padding:1px 11px;margin:0 0 8px}
.qcard .qt{margin:0;font-weight:800;font-size:17px;line-height:1.7}
.mark{position:absolute;top:-40px;right:2px;width:86px;height:86px;pointer-events:none;filter:drop-shadow(0 3px 4px rgba(180,140,170,.25))}
.opt{display:flex;align-items:center;gap:12px;width:100%;border:none;background:#fff;border-radius:20px;
  padding:14px;margin-top:11px;font:inherit;font-weight:800;font-size:15.5px;cursor:pointer;text-align:left;
  color:var(--ink);box-shadow:0 5px 0 #EFE0EA;transition:transform .08s,box-shadow .08s}
.opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 #EFE0EA}
.opt .k{width:28px;height:28px;flex:none;border-radius:50%;background:#F6EEF7;color:var(--ink-soft);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.opt.ok{background:#FFF0F5;box-shadow:0 5px 0 #FFC7DB;color:var(--pink-d)}
.opt.ok .k{background:var(--pink);color:#fff}
.opt.ng{background:#EFF7FD;box-shadow:0 5px 0 #C6E3F5}
.opt.dim{opacity:.45}
.opt .res{margin-left:auto;font-size:12px;color:var(--pink-d);font-weight:800}
.exp{margin-top:15px;background:#FFFBEB;border-radius:20px;padding:14px 16px;font-size:14.5px;
  box-shadow:0 4px 0 #FBEFC7}
.exp b{display:block;font-size:12px;color:#D9A017;margin-bottom:3px;font-weight:800}
.big{display:block;margin:10px auto 0}
.pop{animation:pop .3s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.sparkle{position:absolute;font-size:19px;pointer-events:none;animation:spk 1s ease-out forwards}
@keyframes spk{0%{transform:scale(.3) rotate(0);opacity:0}30%{opacity:1}100%{transform:scale(1.3) translateY(-26px) rotate(25deg);opacity:0}}

/* ===== 地図 ===== */
.mapbox{background:linear-gradient(#DCF1FB,#EAF6FF);border-radius:22px;margin-top:13px;padding:8px;
  box-shadow:0 5px 0 #D5E9F5}
.mapbox svg{display:block;width:100%;height:auto}
.jp{fill:#FFF7E9;stroke:#F0C7A8;stroke-width:2;stroke-linejoin:round}
.ring{fill:none;stroke:#FF6E9C;stroke-width:3;animation:pulse 1.7s ease-out infinite}
@keyframes pulse{0%{r:8;opacity:.95}100%{r:30;opacity:0}}

/* ===== リスト ===== */
table.list{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:13.5px;margin-top:4px}
table.list td{background:#FDF6FB;padding:9px 12px;vertical-align:top}
table.list td:first-child{border-radius:14px 0 0 14px;font-weight:800;white-space:nowrap}
table.list td:last-child{border-radius:0 14px 14px 0;color:var(--ink-soft);font-size:12.5px}
table.list .yomi{display:block;font-weight:600;font-size:10.5px;color:var(--ink-soft)}

textarea{width:100%;height:80px;font-size:11.5px;border:2px solid var(--line);border-radius:14px;padding:9px;font-family:monospace}
.center{text-align:center}
.link{background:none;border:none;color:var(--ink-soft);text-decoration:underline;font:inherit;
  font-size:13px;font-weight:700;cursor:pointer;display:block;margin:24px auto 0}
.score{font-size:66px;font-weight:800;line-height:1;margin:4px 0;
  background:linear-gradient(95deg,#FF8FB1,#FFB067,#FFD766,#8FDCA6,#7FC9EC,#B4A8F5);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.score span{font-size:22px}
.dex{display:flex;flex-wrap:wrap;gap:9px;margin-top:4px}
.dex .d{background:#FDF3F9;border-radius:18px;padding:8px 10px;text-align:center;width:78px;box-shadow:0 3px 0 #F2E2EE}
.dex .d svg{height:52px;display:block;margin:0 auto}
.dex .d span{font-size:10.5px;font-weight:800;display:block;margin-top:2px}
.dex .d.lock{filter:grayscale(1);opacity:.45}
.wlist{background:#FDF6FB;border-radius:16px;padding:10px 13px;margin-top:9px;font-size:13.5px}
.wlist b{color:var(--pink-d)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="hd">
    <button onclick="go('home')">
      <p class="sub">9／14（月）しゃかいのテスト</p>
      <h1>にじいろ社会ノート</h1>
    </button>
    <div id="hdScore"></div>
  </div>
</header>
<div class="wrap" id="app"></div>

<script>
/* =========================================================
   1. データ
   ========================================================= */
const UNITS = {
  kokudo :{name:"国土のようす",           ic:"⛰️", col:"#FF8FB1", dk:"#E86D93"},
  ranking:{name:"山・川・湖・島",          ic:"🗻", col:"#FFB067", dk:"#E28E45"},
  kikou  :{name:"日本の気候",              ic:"🌈", col:"#FFD766", dk:"#DFB63F"},
  kubun  :{name:"気候区分と雨温図",        ic:"🗾", col:"#8FDCA6", dk:"#63B87D"},
  mSan   :{name:"地図｜山地・山脈・高地",  ic:"🏔️", col:"#7FC9EC", dk:"#54A6CC"},
  mHei   :{name:"地図｜平野・盆地",        ic:"🌾", col:"#B4A8F5", dk:"#8B7DDB"},
  mKawa  :{name:"地図｜川",                ic:"💧", col:"#E29BE8", dk:"#BE74C6"}
};

/* --- 4択問題 --- */
const Q = [
// 国土のようす
["kokudo","日本の国土がふくまれている大きな造山帯を何といいますか。",["環太平洋造山帯","アルプス・ヒマラヤ造山帯","環日本海造山帯","太平洋プレート帯"],0,"日本は環太平洋（かんたいへいよう）造山帯にふくまれるため、山地や火山が多く、地震も多い。"],
["kokudo","日本の国土のうち、山地はおよそ何分のいくつをしめていますか。",["約2分の1","約3分の1","約4分の3","約4分の1"],2,"国土の約4分の3が山地で、残りの約4分の1が平地。単元テストの選択問題で出る！"],
["kokudo","日本を地形的に大きく東西2つに分ける大きなみぞを何といいますか。",["日本海溝","フォッサマグナ","リアス海岸","中央構造線"],1,"フォッサマグナはラテン語で「大きなみぞ」。西のはしは糸魚川－静岡構造線。"],
["kokudo","フォッサマグナをさかいに、東側の山脈はどの方向に連なっていますか。",["東西","南北","ななめ45度","決まっていない"],1,"東側は南北に、西側は東西に。「東は南北・西は東西」とセットで覚える。"],
["kokudo","本州の中央部にならぶ3000m級の3つの山脈は、飛驒山脈・赤石山脈と、あと1つは何山脈ですか。",["越後山脈","奥羽山脈","木曽山脈","日高山脈"],2,"飛驒（ひだ）・木曽（きそ）・赤石（あかいし）。「ひ・き・あ」で覚えよう。"],
["kokudo","飛驒山脈・木曽山脈・赤石山脈をまとめて何とよびますか。",["日本アルプス","日本ロッキー","中央山脈","三大山地"],0,"3000m級が連なるので「日本アルプス」。飛驒＝北、木曽＝中央、赤石＝南アルプス。"],
["kokudo","日本アルプスにふくまれない山脈は次のうちどれですか。",["飛驒山脈","越後山脈","赤石山脈","木曽山脈"],1,"越後（えちご）山脈は日本アルプスではない。問題集P.45まとめ(1)そのまま！"],
["kokudo","高くけわしい山が細長く連なっている地形を何といいますか。",["高原","丘陵","山脈","高地"],2,"山脈＝高くけわしく細長い／高原＝表面が平ら／高地＝高さが低め／丘陵＝低く起伏が小さい。"],
["kokudo","山に囲まれた平地を何といいますか。",["平野","台地","盆地","三角州"],2,"盆地は山に囲まれた平地。平野は海に面した平地。"],
["kokudo","平野や盆地のなかで、まわりより高くなった台状の平地を何といいますか。",["高原","台地","丘陵","高地"],1,"台地は「平地」のなかま。高原・高地は「山地」のなかまなので注意！"],
["kokudo","日本で最も長い信濃川の河口に広がる平野を何といいますか。",["関東平野","越後平野","濃尾平野","石狩平野"],1,"信濃川－越後平野（新潟県）。川と平野のセットは超頻出！"],
["kokudo","川が山から平地に出たところに、土砂がつもってできた傾斜地を何といいますか。",["三角州","扇状地","台地","リアス海岸"],1,"扇状地（せんじょうち）＝山から平地に出たところ。甲府盆地の地形図で出る。"],
["kokudo","川が運んできた土や砂が、河口付近にたまってできる地形を何といいますか。",["扇状地","砂浜海岸","三角州","盆地"],2,"三角州（さんかくす）＝河口付近。「扇状地＝山のふもと」「三角州＝河口」で区別！広島市も三角州。"],
["kokudo","山地が海にしずみこんでできた、複雑に入り組んだ海岸を何といいますか。",["砂浜海岸","リアス海岸","磯浜海岸","人工海岸"],1,"リアス海岸。写真ではギザギザに入り組んだ海岸。三陸海岸の南部が代表例。"],
["kokudo","波によって運ばれた砂がたまってできた、出入りの少ない海岸を何といいますか。",["リアス海岸","断崖海岸","砂浜海岸","岩石海岸"],2,"砂浜（すなはま）海岸。写真ではまっすぐな海岸線。リアス海岸との見分けが出る！"],
["kokudo","青森県南部から宮城県にかけての、日本の代表的なリアス海岸がある海岸は何ですか。",["三陸海岸","九十九里浜","若狭湾","志摩半島"],0,"三陸（さんりく）海岸。南部がリアス海岸になっている。"],
["kokudo","東北地方の東側の海にある、深さ8000m以上の細長く深いみぞを何といいますか。",["フォッサマグナ","マリアナ海溝","日本海溝","南海トラフ"],2,"日本海溝（にほんかいこう）。8000m以上の深さがある。"],
["kokudo","日本で最も広い平野は何ですか。",["越後平野","石狩平野","濃尾平野","関東平野"],3,"関東平野は日本最大の平野。利根川の流域に広がる。"],
["kokudo","関東平野が広がる都道府県の数として正しいものはどれですか。",["1都6県","1府7県","1都5県","2府3県"],0,"関東地方の1都6県。問題集P.44(4)そのまま！"],
["kokudo","川と平野の組み合わせとして正しいものはどれですか。",["石狩川－筑紫平野","木曽川－大阪平野","利根川－関東平野","筑後川－庄内平野"],2,"石狩川－石狩平野／木曽川－濃尾平野／筑後川－筑紫平野／最上川－庄内平野／信濃川－越後平野。"],
["kokudo","木曽川が流れ、愛知県などに広がる平野はどれですか。",["濃尾平野","仙台平野","高知平野","筑紫平野"],0,"木曽川－濃尾（のうび）平野。"],
["kokudo","日本の火山について正しい文はどれですか。",["日本には火山がほとんどない","火山があるため温泉が多い","火山は九州にしかない","火山は地震とは関係がない"],1,"火山が多く被害もあるが、火山性の温泉が多いというよい面もある。"],
// 山・川・湖・島
["ranking","日本で最も高く、世界文化遺産に登録されている山は何ですか。",["北岳","富士山","槍ヶ岳","御岳"],1,"富士山（3776m）。山梨県と静岡県の境にある活火山。"],
["ranking","富士山の高さとして正しいものはどれですか。",["1233m","3776m","4755m","8848m"],1,"3776m。8848mはエベレストなのでひっかからない！"],
["ranking","富士山の山頂は2つの県にまたがっています。どことどこの県ですか。",["山梨県と静岡県","長野県と静岡県","山梨県と長野県","静岡県と岐阜県"],0,"山梨県と静岡県。記述で書けるように！"],
["ranking","日本で2番目に高い山は何ですか。",["奥穂高岳","間ノ岳","北岳","槍ヶ岳"],2,"①富士山3776 ②北岳3193（山梨県）③奥穂高岳・間ノ岳3190 ⑤槍ヶ岳3180。"],
["ranking","日本で最も長い川は何ですか。",["利根川","石狩川","信濃川","北上川"],2,"信濃川（367km）が長さ1位。利根川（322km）が2位。"],

  let text,choices,ans,exp,geo=null;
  if(item.kind==="map"){
    const g=GEO[item.geo];geo=g;
    const peers=shuffle(GEO.filter((x,i)=>x[2]===g[2]&&i!==item.geo)).slice(0,3).map(x=>x[0]);
    choices=shuffle([g[0],...peers]); ans=choices.indexOf(g[0]);
    text="地図の★のところは、なんという名前？";
    exp=g[0]+"（"+g[1]+"）… "+g[5];
  }else{
    const o=shuffle([0,1,2,3]);
    choices=o.map(i=>item.choices[i]); ans=o.indexOf(item.ans);
    text=item.text; exp=item.exp;
  }
  return {id:item.id,unit:item.unit,text,choices,ans,exp,geo};
}

   ========================================================= */
function fluff(cx,cy,r,n){
  const pts=[];
  for(let i=0;i<n;i++){const a=Math.PI*2*i/n-Math.PI/2;pts.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r]);}
  const amp=(2*r*Math.sin(Math.PI/n)*0.66).toFixed(1);
  let d="M"+pts[0][0].toFixed(1)+","+pts[0][1].toFixed(1);
  for(let i=1;i<=n;i++){const p=pts[i%n];d+="A"+amp+","+amp+" 0 0 1 "+p[0].toFixed(1)+","+p[1].toFixed(1);}
  return d+"Z";
}

function addXP(n){
  S.xp+=n;
  if(S.xp>=LV[LV.length-1]){
    const p=PETS[S.pet%PETS.length];
    if(!S.dex.includes(p.name))S.dex.push(p.name);
    const rest=PETS.map((_,i)=>i).filter(i=>!S.dex.includes(PETS[i].name));
    S.pet = rest.length ? rest[Math.random()*rest.length|0] : (S.pet+1)%PETS.length;
    S.xp=0;
    flashMsg="🎉 "+p.name+" が にじいろマスターに なりました！ 図かん "+S.dex.length+"／"+PETS.length+" だよ。"+(S.dex.length>=PETS.length?"ぜんいんコンプリート、すごい！🏆":"あたらしいなかまのたまごが とどいたよ🥚");
  }
  save();
}

function markWrong(id){S.wrong[id]=0;save();}
function markRight(id){if(S.wrong[id]===undefined)return;S.wrong[id]++;if(S.wrong[id]>=2)delete S.wrong[id];save();}
const wrongIds=()=>Object.keys(S.wrong).filter(id=>byId(id));
const wrongCount=()=>wrongIds().length;

/* =========================================================
   7. 画面
   ========================================================= */
let view="home",deck=[],idx=0,picked=null,right=0,mode=null,sessionWrong=[];
const app=document.getElementById("app");
function go(v){view=v;render();window.scrollTo(0,0);}

function start(m){
  let pool;
  if(m.type==="unit")pool=ITEMS.filter(i=>i.unit===m.unit);
  else if(m.type==="mogi")pool=shuffle(ITEMS).slice(0,20);
  else pool=wrongIds().map(byId);
  if(!pool.length)return;
  mode=m;deck=shuffle(pool).map(build);idx=0;picked=null;right=0;sessionWrong=[];
  go("quiz");
}
function choose(i){
  if(picked!==null)return;
  picked=i;
  const q=deck[idx];
  if(i===q.ans){right++;addXP(mode.type==="review"?3:2);markRight(q.id);}
  else{markWrong(q.id);sessionWrong.push(q.id);}
  S.done++;save();render();
}
function next(){
  if(idx+1<deck.length){idx++;picked=null;render();}
  else{
    if(mode.type==="mogi"){const pts=right*5;if(pts>S.best)S.best=pts;if(pts===100)addXP(30);save();}
    go("result");
  }
}

    h+=`<button class="btn rainbow" onclick='start({type:"mogi"})'>✏️ もぎテストにちょうせん（20もん×5点）
      <span class="s">ぜんぶの中からランダム。100点でボーナスあめ🍬30こ！</span></button>`;
    h+=`<button class="btn honey" ${wc?"":"disabled"} onclick='start({type:"review"})'>🔁 まちがいなおし${wc?`<span class="badge">${wc}もん</span>`:""}
      <span class="s">${wc?"まちがえたもんだいを自動であつめています。2回れんぞくで正かいするとそつぎょう！":"まちがえると ここに自動でたまるよ。"}</span></button>`;

    h+=`<div class="card"><h2>📋 テストのはんい</h2>
      <p class="muted" style="margin:0">「日本の気候と地形」＝もんだい集 P.40〜51（7 国土のようす／8 日本の気候区分）と、「日本の自然 かくにんプリント」の 山地・山脈・高地・平野・盆地・川 の名前。</p></div>`;

    h+=`<h2 style="margin:24px 0 0;font-size:16px">🎀 ことばのれんしゅう</h2>`;
    ["kokudo","ranking","kikou","kubun"].forEach(u=>h+=unitBtn(u));
    h+=`<h2 style="margin:24px 0 0;font-size:16px">🗺 地図のれんしゅう</h2>`;
    ["mSan","mHei","mKawa"].forEach(u=>h+=unitBtn(u));
    h+=`<button class="btn soft" onclick="go('list')">📖 地名の一らんを見ておぼえる</button>`;

    h+=`<div class="card"><h2>🏅 そだてた図かん（${S.dex.length}／${PETS.length}）</h2><div class="dex">`;
    PETS.forEach((p,i)=>{const got=S.dex.includes(p.name);
      h+=`<div class="d ${got?"":"lock"}">${creatureSVG(i,got?4:1,52,"")}<span>${got?p.name:"？？？"}</span></div>`;});
    h+=`</div></div>`;

    h+=`<div class="card"><h2>💡 100点へのコツ</h2><ul class="muted" style="margin:0;padding-left:1.2em">
      <li>雨温図は「①年へいきん気温 → ②冬の降水量」のじゅんに見る</li>
      <li>「扇状地＝山のふもと／三角州＝河口」はセットでおぼえる</li>
      <li>地図はゆびでなぞりながら、声に出して名前を言う</li>
      <li>もぎテストで3回れんぞく100点なら 本番もだいじょうぶ！</li></ul></div>`;

    h+=`<div class="card"><h2>💾 バックアップ</h2>
      <p class="muted" style="margin:0 0 6px">きろくは自動でほぞんされます。ほかのタブレットにうつすときは下をコピーしてね。</p>
      <textarea readonly>${JSON.stringify(S)}</textarea>
      <button class="btn soft" onclick="restore()">はりつけて ふくげんする</button></div>`;
    h+=`<p class="muted center" style="margin-top:16px">これまでにといた もんだい：${S.done}もん</p>`;
  }

  /* ---- 一覧 ---- */
  if(view==="list"){
    h+=`<div class="card"><h2>🏔️ 山地・山脈・高地（16）</h2>${listTable("mSan")}</div>`;
    h+=`<div class="card"><h2>🌾 平野・盆地（17）</h2>${listTable("mHei")}</div>`;
    h+=`<div class="card"><h2>💧 川（11）</h2>${listTable("mKawa")}</div>`;
    h+=`<button class="link" onclick="go('home')">ホームにもどる</button>`;
  }

  /* ---- クイズ ---- */
  if(view==="quiz"){
    const q=deck[idx],U=UNITS[q.unit];
    const label=mode.type==="mogi"?"✏️ もぎテスト":mode.type==="review"?"🔁 まちがいなおし":U.ic+" "+U.name;
    h+=`<div class="prog"><span>${label}</span><span>${idx+1} / ${deck.length}　🌸 ${right}</span></div>
        <div class="pbar"><i style="width:${(idx+(picked!==null?1:0))/deck.length*100}%"></i></div>`;
    h+=`<div class="qcard"><span class="tag" style="background:${U.col}">${U.name}</span>
        <p class="qt">${q.text}</p>${picked!==null?hanamaru(picked===q.ans):""}`;
    if(picked===q.ans)h+=`<span class="sparkle" style="left:14px;top:-6px">✨</span><span class="sparkle" style="right:76px;top:2px;animation-delay:.15s">🌟</span>`;
    h+=`</div>`;
    if(q.geo)h+=`<div class="mapbox">${mapSVG(q.geo[3],q.geo[4])}</div>`;
    q.choices.forEach((c,i)=>{
      let cls="";if(picked!==null)cls=i===q.ans?"ok":(i===picked?"ng":"dim");
      h+=`<button class="opt ${cls}" ${picked!==null?"disabled":""} onclick="choose(${i})">
        <span class="k">${"アイウエ"[i]}</span><span>${c}</span>${picked!==null&&i===q.ans?'<span class="res">せいかい🌸</span>':""}</button>`;
    });
    if(picked!==null){
      h+=`<div class="exp pop"><b>🍯 かいせつ</b>${q.exp}</div>
        <button class="btn" onclick="next()" style="text-align:center">${idx+1<deck.length?"つぎのもんだいへ →":"けっかを見る"}</button>`;
    }
    h+=`<button class="link" onclick="go('home')">ホームにもどる</button>`;
  }

  /* ---- 結果 ---- */
  if(view==="result"){
    const pts=right*5,full=right===deck.length;
    h+=`<div class="card center pop"><p class="muted" style="margin:0">${mode.type==="mogi"?"もぎテストのけっか":"れんしゅうのけっか"}</p>
      <p class="score">${mode.type==="mogi"?pts+'<span>点</span>':right+'<span> / '+deck.length+'もん</span>'}</p>
      <p style="margin:0;font-weight:800">${full?"🌸 ぜんもん正かい！ 本番も100点だね！":right/deck.length>=.8?"🔥 あとすこし！まちがいなおしでカンペキに":"💪 のびしろたっぷり！ かいせつを読んでもう一しゅう"}</p>
      ${full?creatureSVG(S.pet,stageOf(S.xp),120,"big"):""}</div>`;
    if(sessionWrong.length){
      h+=`<div class="card"><h2>📝 今回まちがえたもんだい（${sessionWrong.length}）</h2>
        <p class="muted" style="margin:0">まちがいなおしリストに 入れておいたよ！</p>`;
      sessionWrong.forEach(id=>{const it=byId(id);
        h+=`<div class="wlist">${it.kind==="map"?"地図の★ → ":it.text+"<br>"}<b>こたえ：${it.kind==="map"?GEO[it.geo][0]:it.choices[it.ans]}</b></div>`;});
      h+=`</div><button class="btn honey" onclick='start({type:"review"})' style="text-align:center">🔁 いますぐ まちがいなおしをする</button>`;
    }
    h+=`<button class="btn" onclick='start(mode)' style="text-align:center">もう一回ちょうせん</button>
        <button class="btn soft" onclick="go('home')">ホームにもどる</button>`;
  }
  app.innerHTML=h;
}
function restore(){
  const t=prompt("バックアップの文字をはりつけて OK をおしてね。");
  if(!t)return;
  try{S=Object.assign(S,JSON.parse(t));save();alert("ふくげんしました！");render();}
  catch(e){alert("うまく読みこめませんでした。文字をぜんぶコピーできているか かくにんしてね。");}
}
render();
</script>
</body>
</html>
