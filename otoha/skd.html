<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>乙葉のしゅくだい帳</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Parisienne&display=swap">
<style>
/* ぶしゅさがし と同じトーン：空色の額縁＋白い紙、教科書体、金の筆記体タイトル。背景はいつもキラキラ */
:root{
  color-scheme:light;
  --kyokasho:"HG教科書体","HGP教科書体","HGS教科書体","UD デジタル 教科書体 NK-R","UD Digi Kyokasho NK-R","YuKyokasho","游教科書体","Klee One","Hiragino Mincho ProN",serif;
  --sky:#bfe0f2; --sky2:#e8f4fb; --paper:#fbfdff; --line:#cfe6f4;
  --ink:#4a5a66; --char:#3f5261; --sub:#8fa7b6; --gold:#c9a961; --leaf:#8fc7e8; --blue:#5f93b3;
  --pink:#e9a2bf; --pink-d:#d17a9e; --pink-soft:#fbeef4;
  --lav:#b3a6e0; --lav-d:#8a7cc4; --lav-soft:#f1eefb;
  --mint:#86c9b0; --coral:#e07890; --gold-soft:#fbf5e6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--kyokasho);font-size:15px;line-height:1.6;min-height:100vh;
  padding:calc(8px + env(safe-area-inset-top,0px)) 8px calc(8px + env(safe-area-inset-bottom,0px))}
#sky{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.frame{position:relative;z-index:1;max-width:760px;margin:0 auto;background:rgba(232,244,251,.62);border-radius:26px;padding:10px;box-shadow:0 6px 18px rgba(120,170,200,.25)}
.sheet{background:rgba(251,253,255,.8);border-radius:20px;border:1px solid #fff;overflow:hidden}
#root{position:relative;padding:12px 14px 90px;display:flex;flex-direction:column;gap:12px}
h1,h2,h3{font-family:var(--kyokasho);margin:0;text-wrap:balance;line-height:1.3;font-weight:600}
button,input,select{font-family:var(--kyokasho)}
button{color:var(--ink);cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* ヘッダー */
.top{position:relative;text-align:center;padding-top:4px}
.mascot{display:block;margin:0 auto 2px;width:86px;height:86px;object-fit:contain}
.title{font-family:'Parisienne',cursive;font-size:34px;color:var(--gold);line-height:1}
.title .cl{font-size:20px;vertical-align:super}
.top .subt{font-size:12.5px;color:var(--sub);margin:4px 0 2px;letter-spacing:.22em}
.today{font-size:17px;color:var(--char)}
.today .wd-sat{color:var(--blue)} .today .wd-sun{color:var(--coral)}
.top .mamabtns{position:absolute;top:0;right:0;display:flex;gap:6px}

/* カード・見出し */
.card{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:0 3px 10px rgba(150,195,220,.18)}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.sec-h h2{font-size:13px;color:var(--sub);letter-spacing:.16em;display:flex;align-items:center;gap:8px;flex:1 1 auto}
.sec-h h2::after{content:"";flex:1;height:1px;background:var(--line);min-width:20px}
.sec-h .sub{color:var(--sub);font-size:12px;width:100%}

/* ボタン */
.btn{border:2px solid var(--line);background:#fff;border-radius:16px;padding:7px 14px;font-size:14px;transition:transform .1s}
.btn:active{transform:scale(.95);background:var(--sky2)}
.btn.aqua,.btn.on{background:var(--leaf);border-color:var(--leaf);color:#fff}
.btn.pink{background:var(--pink);border-color:var(--pink);color:#fff}
.btn.danger{border-color:var(--coral);color:var(--coral)}
.btn.small{padding:5px 12px;font-size:12.5px;border-radius:12px;border-width:1.5px}

/* きょう やること */
.todo{border:2px solid var(--leaf)}
.todo .sec-h h2{font-size:20px;color:var(--char);letter-spacing:.08em}
.todo .sec-h h2::before{content:"☘";color:var(--leaf);font-size:18px}
.todo-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.todo-item{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:start;padding:12px;border-radius:16px;background:var(--sky2)}
.ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:28px;color:#fff;line-height:1}
.ic.k{background:var(--leaf)} .ic.t{background:var(--pink)} .ic.h{background:var(--lav)}
.what{font-size:17px;color:var(--char)}
.what b{font-size:30px;color:var(--blue);font-weight:600}
.why{color:var(--sub);font-size:13px}
.todo-item.done{opacity:.6}
.todo-item.done .what{text-decoration:line-through}
.late{display:inline-block;background:var(--coral);color:#fff;border-radius:10px;padding:0 8px;font-size:12px;margin-left:6px;vertical-align:3px}
.ok{display:inline-block;background:var(--mint);color:#fff;border-radius:10px;padding:0 8px;font-size:12px;margin-left:6px;vertical-align:3px}
.todo-empty{padding:14px;text-align:center;font-size:18px;color:var(--blue)}
.offday{background:var(--lav-soft);color:var(--lav-d);border-radius:12px;padding:7px 12px;margin-bottom:10px}
.todo-item .btn{margin-top:8px}

/* 漢字カード */
.k-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end}
.k-label{font-size:12.5px;color:var(--sub);letter-spacing:.16em}
.k-title{font-size:40px;line-height:1.1;color:var(--char)}
.k-title small{font-size:14px;color:var(--sub);margin-right:8px}
.count{text-align:right}
.count .n{font-size:48px;line-height:1;color:var(--blue)}
.count .u{font-size:15px}
.count .d{font-size:12.5px;color:var(--sub)}
.count.urgent .n{color:var(--coral)}
.hint{font-size:12px;color:var(--sub);margin-top:12px}
.masu{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 10px}
.ms{width:50px;height:50px;border:2px solid var(--leaf);border-radius:6px;position:relative;padding:0;display:grid;place-items:center;font-size:24px;color:#fff;background:#fff;transition:transform .15s}
.ms::before,.ms::after{content:"";position:absolute;border:0 dashed rgba(143,199,232,.7)}
.ms::before{left:50%;top:4px;bottom:4px;border-left-width:1px}
.ms::after{top:50%;left:4px;right:4px;border-top-width:1px}
.ms:active{transform:scale(.88)}
.ms.f{background:var(--leaf)}
.ms.f::before,.ms.f::after{display:none}
.ms.plan{border-color:var(--gold);border-style:dashed;background:var(--gold-soft)}
.ms.pop{animation:pop .45s cubic-bezier(.3,1.8,.5,1)}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.remain{display:flex;gap:6px 14px;flex-wrap:wrap;align-items:baseline;font-size:14px}
.remain b{font-size:24px;color:var(--char)}
.stepper{display:flex;gap:8px;align-items:center;margin-top:10px}
.strip{display:flex;gap:5px;overflow-x:auto;padding:4px 0 8px;margin-top:12px}
.chip{flex:0 0 auto;min-width:48px;border-radius:12px;padding:6px 4px;text-align:center;border:1.5px solid var(--line);font-size:12px;line-height:1.3;background:#fff}
.chip .dd{font-size:19px;display:block;color:var(--char)}
.chip .q{display:block;font-size:11px;margin-top:2px}
.chip.sat{background:var(--sky2)} .chip.sat .dd{color:var(--blue)}
.chip.sun,.chip.hol{background:var(--pink-soft)} .chip.sun .dd,.chip.hol .dd{color:var(--coral)}
.chip.off{background:var(--lav-soft);color:var(--lav-d)}
.chip.today{border:2px solid var(--gold)}
.chip.due{border:2px dashed var(--coral)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--sub)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px;background:var(--c)}
.tip{margin:10px 0 0;font-size:13px;background:var(--gold-soft);color:#a0813a;border-radius:12px;padding:6px 10px}

/* テスト */
.tests{display:flex;flex-direction:column;gap:10px}
.trow{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center}
.cd{border-radius:16px;text-align:center;padding:6px 4px;background:var(--pink-soft);color:var(--pink-d);border:1px solid #f4d3e1}
.cd .n{font-size:28px;line-height:1.1}
.cd .u{font-size:11px}
.cd.far{background:var(--sky2);color:var(--blue);border-color:var(--line)}
.t1{color:var(--char);font-size:16px}
.t2{font-size:12.5px;color:var(--sub)}
.subj{display:inline-block;font-size:12px;border-radius:10px;padding:0 8px;margin-right:6px;background:var(--sky2);color:var(--blue);border:1px solid var(--line)}

/* カレンダー */
.cal-nav{display:flex;gap:8px;align-items:center}
.cal-nav .m{font-size:17px;min-width:110px;text-align:center;color:var(--char)}
.cal-wrap{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;min-width:320px}
.cal .h{text-align:center;font-size:12px;color:var(--sub);padding:2px 0}
.cal .h.sat{color:var(--blue)} .cal .h.sun{color:var(--coral)}
.cell{min-height:72px;border-radius:10px;background:#fff;border:1px solid var(--line);padding:3px;display:flex;flex-direction:column;gap:2px;text-align:left;font-size:11px;min-width:0}
.cell.pad{background:transparent;border:0}
.cell .dn{font-size:15px;color:var(--char)}
.cell.sat .dn{color:var(--blue)} .cell.sun .dn,.cell.hol .dn{color:var(--coral)}
.cell.off{background:var(--lav-soft)}
.cell.today{border:2px solid var(--gold);background:var(--gold-soft)}
.cell.past{opacity:.5}
.tag{display:block;border-radius:6px;padding:0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.6}
.tag.k{background:var(--leaf);color:#fff} .tag.t{background:var(--pink);color:#fff}
.tag.h{background:var(--lav-soft);color:var(--lav-d)} .tag.e{background:var(--gold-soft);color:#a0813a}
.tag.o{color:var(--lav-d)} .tag.p{color:var(--sub)}
button.cell{cursor:default}
.mama button.cell{cursor:pointer}

/* 予定 */
.seg{display:flex;border:1.5px solid var(--line);border-radius:14px;padding:3px;gap:3px;background:#fff}
.seg button{border:0;background:transparent;border-radius:10px;padding:5px 12px;font-size:12.5px;color:var(--sub)}
.seg button.on{background:var(--leaf);color:#fff}
.tl{display:flex;flex-direction:column}
.tl-day{display:grid;grid-template-columns:84px 1fr;gap:10px;padding:9px 0;border-top:1px dashed var(--line)}
.tl-day:first-child{border-top:0}
.tl-date{font-size:16px;color:var(--char)}
.tl-date .cdx{display:block;font-size:12px;color:var(--sub)}
.tl-date .cdx.soon{color:var(--coral)}
.tl-date.sat{color:var(--blue)} .tl-date.sun,.tl-date.hol{color:var(--coral)}
.tl-items{display:flex;flex-direction:column;gap:6px;min-width:0}
.ev{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.ev .k{font-size:12px;border-radius:10px;padding:1px 8px;flex:0 0 auto}
.ev .k.kanji{background:var(--leaf);color:#fff} .ev .k.test{background:var(--pink);color:#fff}
.ev .k.hw,.ev .k.off{background:var(--lav-soft);color:var(--lav-d)} .ev .k.event{background:var(--gold-soft);color:#a0813a}
.ev .txt{flex:1 1 160px;min-width:0;color:var(--char)}
.ev .note{display:block;font-size:12px;color:var(--sub)}
.ev .acts{display:flex;gap:6px}

/* 2学期の漢字 */
.total{display:flex;gap:6px 14px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}
.total b{font-size:30px;color:var(--blue);font-weight:600}
.bar{height:10px;border-radius:6px;background:var(--sky2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--leaf)}
.rounds{width:100%;border-collapse:collapse;font-size:14px;margin-top:12px}
.rounds th{font-size:12px;color:var(--sub);text-align:left;font-weight:400;padding:4px 6px;border-bottom:1px solid var(--line)}
.rounds td{padding:8px 6px;border-bottom:1px dashed var(--line);vertical-align:middle}
.rounds tr.cur td{background:var(--sky2)}
.rounds .rng{font-size:19px;white-space:nowrap;color:var(--char)}
.rounds .mini{width:70px}
.st{font-size:12px;white-space:nowrap}
.st.done{color:var(--mint)} .st.late{color:var(--coral)}
.tbl-wrap{overflow-x:auto}

/* ママ */
.mamabar{background:var(--gold-soft);color:#8a6d2a;border:1px solid #efe0b8;border-radius:16px;padding:9px 14px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.scrim{position:fixed;inset:0;background:rgba(74,90,102,.3);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheetp{background:var(--paper);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 20px rgba(120,170,200,.3)}
.sheetp h3{font-size:18px;margin-bottom:12px;color:var(--char)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid .full{grid-column:1/-1}
.fgrid label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--sub);min-width:0}
.fgrid input,.fgrid select{font-size:17px;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:14px;padding:9px 11px;min-width:0;width:100%}
.fbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.flash{background:var(--pink-soft);color:var(--pink-d);padding:8px 12px;border-radius:12px}
.muted{color:var(--sub)}
.settings{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:14px}
.settings select{padding:4px 6px;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-size:14px}
.foot{text-align:center;font-family:'Parisienne',cursive;color:var(--gold);font-size:17px;margin-top:6px}

/* ごほうび */
.burst{position:fixed;pointer-events:none;z-index:50;font-size:18px;animation:fly .9s ease-out forwards}
@keyframes fly{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--x),var(--y)) scale(1.1) rotate(160deg);opacity:0}}
.toast{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%);z-index:60;background:var(--paper);border:2px solid var(--line);border-radius:24px;padding:18px 28px;text-align:center;font-size:24px;color:var(--blue);box-shadow:0 14px 30px rgba(120,170,200,.35);animation:toast 1.8s cubic-bezier(.3,1.6,.5,1) forwards;pointer-events:none}
.toast small{display:block;font-size:14px;color:var(--gold)}
@keyframes toast{0%{transform:translate(-50%,-50%) scale(.5);opacity:0}15%{transform:translate(-50%,-50%) scale(1.06);opacity:1}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%)}}
.ms{color:var(--char);font-size:26px}
.ms.f{color:#fff}
.ms.f2{background:var(--gold);border-color:var(--gold);color:#fff}
.ms.f2::before,.ms.f2::after{display:none}
.ms.plan{border:2px dashed var(--gold);background:var(--gold-soft)}
.ms.f.plan{background:var(--leaf);color:#fff}
.laps{font-size:13px;color:var(--sub);margin-top:10px}
.laps b{font-size:18px;color:var(--char)}
.lap{display:inline-block;font-size:11.5px;border-radius:8px;padding:0 7px;margin-right:4px;vertical-align:2px}
.lap.l1{background:var(--leaf);color:#fff} .lap.l2{background:var(--gold);color:#fff}
.kline{margin:4px 0 2px;display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px}
.kc{font-size:26px;letter-spacing:.12em;color:var(--char);margin-right:8px}
.count .n2{font-size:15px;color:var(--char)} .count .n2 b{font-size:30px;color:var(--blue);font-weight:600}
.count .d b{font-weight:600;color:var(--char);font-size:15px}
.pts .pt-main{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.pt-n{font-size:44px;line-height:1.1;color:var(--gold)} .pt-n small{font-size:16px;margin-left:2px}
.pt-side{text-align:right;font-size:14px} .pt-side b{font-size:20px;color:var(--blue);font-weight:600}
.pt-mama{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:12.5px}
.setline{width:100%;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.setline input{width:56px;padding:4px 6px;border:1.5px solid var(--line);border-radius:10px;font-size:14px;color:var(--ink)}
.task-box{background:var(--sky2);border-radius:14px;padding:10px}
.tb-h{font-size:13px;color:var(--sub);margin-bottom:6px}
.task-row{display:grid;grid-template-columns:132px 1fr 56px auto auto;gap:6px;align-items:center;margin-bottom:6px}
.task-row input{font-size:15px;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:12px;padding:7px 8px;min-width:0;width:100%}
.pt-u{font-size:12px;color:var(--sub)}
.btn[disabled]{opacity:.45}
[hidden]{display:none!important}
.tag.tn{background:var(--mint);color:#fff}
.ev .k.tennis{background:var(--mint);color:#fff}
.setbox{margin-top:16px;border-top:1px dashed var(--line);padding-top:10px}
.setbox summary{cursor:pointer;color:var(--blue);font-size:14px;padding:4px 0}
.setbox .settings{margin-top:8px}
.sheetp .tl-items{margin:6px 0}
.cell{cursor:pointer}
.tag{text-align:left}
.tag.tn{background:#f2d36b;color:#5e4a10}
.ev .k.tennis{background:#f2d36b;color:#5e4a10}
.fgrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;box-sizing:border-box;text-align:left;min-height:44px}
input[type=date]::-webkit-date-and-time-value{text-align:left}
.task-row{grid-template-columns:150px minmax(0,1fr) 64px auto auto}
.task-row input{box-sizing:border-box}
.task-row .tr-pts{text-align:center;padding-left:4px;padding-right:4px}
@media (max-width:520px){.task-row{grid-template-columns:minmax(0,1fr) 64px auto auto}.task-row .tr-date{grid-column:1/-1}}
@media (max-width:480px){.task-row{grid-template-columns:1fr 56px auto auto}.task-row .tr-date{grid-column:1/-1}.pt-side{text-align:left}}
@media (max-width:480px){
  .ms{width:44px;height:44px}
  .tl-day{grid-template-columns:72px 1fr}
  .rounds .hide-s{display:none}
  .top .mamabtns{position:static;margin-top:8px;justify-content:center}
}
</style>
</head>

/* ===== キラキラ背景 ===== */
(function(){
  var c=document.getElementById("sky"),x=c.getContext("2d"),W,H,dpr,stars=[];
  var COLS=["255,255,255","255,255,255","143,199,232","201,169,97","233,162,191","179,166,224"];
  function size(){dpr=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);
    var n=Math.round(W*H/6500);stars=[];for(var i=0;i<n;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*3+1.2,p:Math.random()*6.28,s:Math.random()*1.6+.6,c:COLS[i%COLS.length],k:Math.random()<.35,v:Math.random()*.12+.03})}
  function spark(s,a){x.save();x.translate(s.x,s.y);x.globalAlpha=a;x.fillStyle="rgba("+s.c+",1)";
    if(s.k){var r=s.r*3;x.beginPath();x.moveTo(0,-r);x.quadraticCurveTo(0,0,r,0);x.quadraticCurveTo(0,0,0,r);x.quadraticCurveTo(0,0,-r,0);x.quadraticCurveTo(0,0,0,-r);x.fill();
      x.globalAlpha=a*.35;x.beginPath();x.arc(0,0,r*1.4,0,6.28);x.fillStyle="rgba("+s.c+",.5)";x.fill()}
    else{x.shadowColor="rgba("+s.c+",1)";x.shadowBlur=8;x.beginPath();x.arc(0,0,s.r*.7,0,6.28);x.fill()}
    x.restore()}
  function draw(t){x.clearRect(0,0,W,H);for(var i=0;i<stars.length;i++){var s=stars[i];s.y-=s.v;if(s.y<-10){s.y=H+10;s.x=Math.random()*W}
    var a=.35+.65*Math.pow(Math.sin(t/1000*s.s+s.p)*.5+.5,2);spark(s,a)}requestAnimationFrame(draw)}
  size();window.addEventListener("resize",size);requestAnimationFrame(draw);
})();

/* ===== アプリ ===== */
(function(){
"use strict";
var KEY="otoha-shukudai-v1";
/* 2学期の漢字（乙葉の漢字アプリ otoha/kanji.html と同じ順番・98字） */
var K2="提支採保護河基規制設限条件接張師枝似演貧築政税賞興因武眼財額紀燃粉断寄判往衛過潔境査航停貿易婦酸講再旧績均志測暴検製復授刊個破素独益義圧居型液禁賛絶告総桜仏妻舎鉱銅脈輸則肥版留墓幹団務祖在費余招格";
var W2=0.8; /* 文作りは練習より少し軽い */

function pad(n){return String(n).padStart(2,"0")}
function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function parse(s){var a=s.split("-").map(Number);return new Date(a[0],a[1]-1,a[2])}
function add(s,n){var d=parse(s);d.setDate(d.getDate()+n);return ymd(d)}
function diff(a,b){return Math.round((parse(b)-parse(a))/86400000)}
function dow(s){return parse(s).getDay()}
var WD="日月火水木金土";
function md(s){var d=parse(s);return (d.getMonth()+1)+"/"+d.getDate()+"("+WD[d.getDay()]+")"}
function dnum(s){return parse(s).getDate()}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function isDate(v){return typeof v==="string"&&/^\d{4}-\d\d-\d\d$/.test(v)}
var TODAY=ymd(new Date());

function charsFor(range){
  if(!range)return "";var p=range.replace(/[～~]/g,"〜").split("〜");if(p.length!==2)return "";
  var a=K2.indexOf(p[0].trim()),b=K2.indexOf(p[1].trim());
  return (a>=0&&b>=a)?K2.slice(a,b+1):"";
}

var state=JSON.parse(document.getElementById("app-state").textContent);
try{var ls=localStorage.getItem(KEY);if(ls){var p0=JSON.parse(ls);if(p0&&p0.items)state=p0}}catch(e){}
function migrate(st){
  var s=st.settings=st.settings||{};
  if(s.finishBefore==null)s.finishBefore=2;
  if(s.testPrep==null)s.testPrep=3;
  if(!s.pts)s.pts={l1:1,l2:1,bonus:5};
  if(s.settled==null)s.settled=0;
  if(!s.planFrom)s.planFrom=TODAY;
  st.items.forEach(function(it){
    if(it.kind==="kanji"){
      if(!it.chars)it.chars=charsFor(it.range);
      var n=it.chars?it.chars.length:(it.total||0);
      if(!Array.isArray(it.l1)){
        var d=Math.min(it.done||0,n),old=d>=n&&it.date<s.planFrom;
        it.l1=[];it.l2=[];
        for(var i=0;i<n;i++){it.l1.push(i<d?"-":null);it.l2.push(old?"-":null)}
      }
      delete it.done;
    }
    if(it.kind==="test"&&!Array.isArray(it.tasks))it.tasks=[];
    if(it.kind==="hw"&&it.finished===true)it.finished="-";
    if(it.kind!=="kanji"&&it.range){it.title=it.title?it.title+"・"+it.range:it.range;delete it.range}
  });
}
migrate(state);
var savedJson="";
var root=document.getElementById("root");

var HOL={"2026-09-21":"敬老の日","2026-09-22":"国民の休日","2026-09-23":"秋分の日","2026-10-12":"スポーツの日","2026-11-03":"文化の日","2026-11-23":"勤労感謝の日","2027-01-01":"元日","2027-01-11":"成人の日","2027-02-11":"建国記念の日","2027-02-23":"天皇誕生日","2027-03-21":"春分の日","2027-03-22":"振替休日"};

function offMap(){var m={};state.items.forEach(function(it){if(it.kind==="off")m[it.date]=it.title||"休校"});return m}
function dayType(s,om){if(om[s])return "off";if(HOL[s])return "hol";var w=dow(s);return w===0?"sun":w===6?"sat":"school"}
function wdClass(s){var w=dow(s);return HOL[s]||w===0?"sun":w===6?"sat":""}
function breakdown(from,toEx,om){var c={school:0,rest:0,off:0};for(var d=from;d<toEx;d=add(d,1)){var t=dayType(d,om);if(t==="school")c.school++;else if(t==="off")c.off++;else c.rest++}return c}
function bdText(c){var p=["学校の日 "+c.school+"日","土日祝 "+c.rest+"日"];if(c.off)p.push("休校 "+c.off+"日");return p.join("・")}
function cdText(n){return n===0?"今日":n===1?"明日":n<0?"済":"あと"+n+"日"}
function sorted(kind){return state.items.filter(function(i){return !kind||i.kind===kind}).sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0})}
function find(id){for(var i=0;i<state.items.length;i++)if(state.items[i].id===id)return state.items[i];return null}
function cnt(a){var n=0;(a||[]).forEach(function(v){if(v)n++});return n}

/* ===== 漢字の計画 =====
   書きはじめ＝前回の提出日（使い始めより前なら使い始めの日）
   書き終わり＝提出のN日前。1周目（練習）→2周目（文作り・少し軽い）の順に、毎日均等に割り振る */
function kanjiInfo(k){
  var ks=sorted("kanji"),idx=ks.indexOf(k);
  var start=idx>0?ks[idx-1].date:add(k.date,-7);
  if(start<state.settings.planFrom)start=state.settings.planFrom;
  var end=add(k.date,-(state.settings.finishBefore||0));
  if(end<start)end=add(k.date,-1);
  if(end<start)end=start;
  var nd=diff(start,end)+1,n=(k.l1||[]).length,totalW=n*(1+W2);
  var l1c=cnt(k.l1),l2c=cnt(k.l2),doneW=l1c+l2c*W2;
  function tgt(day){if(day<start)return 0;if(day>end)return totalW;return totalW*(diff(start,day)+1)/nd}
  var tT=tgt(TODAY),tY=tgt(add(TODAY,-1));
  /* やる順番：まだの練習 → まだの文作り */
  var seq=[];for(var i=0;i<n;i++)if(!k.l1[i])seq.push({lap:1,i:i,w:1});
  for(i=0;i<n;i++)if(!k.l2[i])seq.push({lap:2,i:i,w:W2});
  function take(w){var out=[],acc=0;for(var j=0;j<seq.length&&acc<w-0.15;j++){out.push(seq[j]);acc+=seq[j].w}return out}
  var todo=take(tT-doneW),behind=take(tY-doneW);
  var complete=l1c===n&&l2c===n&&n>0;
  var last=null;(k.l1||[]).concat(k.l2||[]).forEach(function(v){if(isDate(v)&&(!last||v>last))last=v});
  return {start:start,end:end,tgt:tgt,todo:todo,behind:behind.length,l1c:l1c,l2c:l2c,n:n,complete:complete,last:last,
    bonus:complete&&last&&last<=end};
}

/* ===== ポイント（チェックした日の記録から毎回計算） ===== */
function points(){
  var P=state.settings.pts,tot=0,today=0;
  function addp(v,d){if(!v||!isDate(d))return;tot+=v;if(d===TODAY)today+=v}
  sorted("kanji").forEach(function(k){
    (k.l1||[]).forEach(function(d){addp(P.l1,d)});(k.l2||[]).forEach(function(d){addp(P.l2,d)});
    var inf=kanjiInfo(k);if(inf.bonus)addp(P.bonus,inf.last);
  });
  sorted("test").forEach(function(t){(t.tasks||[]).forEach(function(x){addp(+x.pts||0,x.done)})});
  sorted("hw").forEach(function(h){addp(+h.pts||0,h.finished)});
  return {total:tot,today:today,unsettled:Math.max(0,tot-(state.settings.settled||0))};
}

var ui={unlocked:false,cal:null,past:false,sheet:null,del:null,flash:""};
var t0=parse(TODAY);ui.cal=[t0.getFullYear(),t0.getMonth()];

function persist(){var j=JSON.stringify(state);if(j===savedJson)return;try{localStorage.setItem(KEY,j);savedJson=j}catch(e){ui.flash="この端末に保存できませんでした"}}

function render(){
  persist();
  var om=offMap(),h=[],td=parse(TODAY);
  h.push('<header class="top"><img class="mascot" src="mascot.png" alt="" onerror="this.onerror=null;this.src=window.MASCOT_FB"><div class="title">Homework Diary<span class="cl">☘</span></div><div class="subt">乙葉のしゅくだい帳・5年2学期</div><div class="today num">'+(td.getMonth()+1)+'月'+td.getDate()+'日<span class="wd-'+(wdClass(TODAY)||"x")+'">（'+WD[td.getDay()]+'）</span></div>');
  h.push('<div class="mamabtns"><button class="btn small" data-act="add">＋ 予定を追加</button><button class="btn small" data-act="editlist">編集</button></div></header>');
  if(ui.flash)h.push('<div class="flash">'+esc(ui.flash)+'</div>');
  h.push(renderTodo(om));
  h.push(renderPoints());
  var nk=sorted("kanji").filter(function(k){return k.date>=TODAY})[0];
  if(nk)h.push(renderKanji(nk,om));
  h.push(renderTests(om));
  h.push(renderCal(om));
  h.push(renderTimeline());
  h.push('<div class="foot">May your study day sparkle!</div>');
  if(ui.sheet)h.push(ui.sheet.mode==="pin"?renderPin():renderSheet());
  root.innerHTML=h.join("");
  var pi=document.getElementById("pin-in");if(pi)pi.focus();
}

function charChips(list,k){
  var a=list.filter(function(u){return u.lap===1}).map(function(u){return k.chars[u.i]||"?"}).join(" ");
  var b=list.filter(function(u){return u.lap===2}).map(function(u){return k.chars[u.i]||"?"}).join(" ");
  var s="";if(a)s+='<span class="lap l1">練習</span><span class="kc">'+esc(a)+'</span>';
  if(b)s+='<span class="lap l2">文作り</span><span class="kc">'+esc(b)+'</span>';return s;
}

function renderTodo(om){
  var P=state.settings.pts;
  var h=['<section class="card todo"><div class="sec-h"><h2>きょう やること</h2><span class="sub">これだけやれば、前の日の夜にあわてない</span></div>'];
  if(dayType(TODAY,om)==="off")h.push('<div class="offday">今日は'+esc(om[TODAY])+'。時間があるから少し多めに進めよう</div>');
  var li=[];
  sorted("kanji").filter(function(k){return k.date>=TODAY}).forEach(function(k){
    var r=kanjiInfo(k);if(!r.todo.length)return;
    li.push('<li class="todo-item"><div class="ic k">漢</div><div><div class="what">漢字ノート '+esc(k.range)+'　<b class="num">'+r.todo.length+'</b>文字'+(r.behind>0?'<span class="late">おくれ '+r.behind+'文字分</span>':'')+'</div><div class="kline">'+charChips(r.todo,k)+'</div><div class="why">提出 '+md(k.date)+'・書いたら下のマスをタップ（1字 '+P.l1+'pt）</div></div></li>');
  });
  /* テストのやること（その日の分＋やり残し） */
  sorted("test").forEach(function(t){
    if(t.date<TODAY)return;
    var tasks=(t.tasks||[]).filter(function(x){return x.date===TODAY||(x.date<TODAY&&!x.done)||(x.done===TODAY)});
    tasks.forEach(function(x){
      var did=!!x.done,left=x.date<TODAY&&!did;
      li.push('<li class="todo-item'+(did?' done':'')+'"><div class="ic t">テ</div><div><div class="what">'+esc(x.text)+(left?'<span class="late">やり残し</span>':'')+(did?'<span class="ok">できた！</span>':'')+'</div><div class="why">'+esc(t.subject||"")+'テスト '+md(t.date)+'（'+cdText(diff(TODAY,t.date))+'）'+(x.pts?'・'+x.pts+'pt':'')+'</div><button class="btn small '+(did?'':'pink')+'" data-act="task" data-id="'+esc(t.id)+'" data-t="'+esc(x.id)+'">'+(did?'とりけす':'できた！'+(x.pts?' +'+x.pts+'pt':''))+'</button></div></li>');
    });
    var n=diff(TODAY,t.date);
    if(!(t.tasks||[]).length&&n>=1&&n<=(state.settings.testPrep||3)){
      var st=(t.studied||[]).indexOf(TODAY)>=0;
      li.push('<li class="todo-item'+(st?' done':'')+'"><div class="ic t">テ</div><div><div class="what">'+esc(t.subject||"")+'テストの勉強'+(st?'<span class="ok">やった！</span>':'')+'</div><div class="why">'+esc(t.title||"")+'・'+md(t.date)+'（'+cdText(n)+'）</div><button class="btn small '+(st?'':'pink')+'" data-act="study" data-id="'+esc(t.id)+'">'+(st?'とりけす':'今日やった！')+'</button></div></li>');
    }
  });
  sorted("hw").forEach(function(x){if(x.date>=TODAY&&diff(TODAY,x.date)<=3){
    var fin=!!x.finished;
    li.push('<li class="todo-item'+(fin?' done':'')+'"><div class="ic h">宿</div><div><div class="what">'+esc((x.subject?x.subject+"：":"")+(x.title||""))+(fin?'<span class="ok">おわった！</span>':'')+'</div><div class="why">しめきり '+md(x.date)+'（'+cdText(diff(TODAY,x.date))+'）'+(x.pts?'・'+x.pts+'pt':'')+'</div><button class="btn small '+(fin?'':'pink')+'" data-act="hwdone" data-id="'+esc(x.id)+'">'+(fin?'とりけす':'おわった！'+(x.pts?' +'+x.pts+'pt':''))+'</button></div></li>');
  }});
  if(!li.length)h.push('<div class="todo-empty">☘ 今日の分はおわり！ ☘</div>');
  else h.push('<ul class="todo-list">'+li.join("")+'</ul>');
  return h.join("")+'</section>';
}

function renderPoints(){
  var p=points();
  var h='<section class="card pts"><div class="pt-main"><div><div class="k-label">ためたポイント</div><div class="pt-n num">'+p.total+'<small>pt</small></div></div><div class="pt-side"><div>今日 <b class="num">+'+p.today+'</b>pt</div><div class="muted">ポイント制度にまだ入れていない分 <b class="num">'+p.unsettled+'</b>pt</div></div></div>';
  return h+'</section>';
}

function renderKanji(k,om){
  var r=kanjiInfo(k),n=r.n,P=state.settings.pts,phase2=r.l1c===n;
  var due=diff(TODAY,k.date),wd=Math.max(0,diff(TODAY,r.end)+1);
  var todoSet={};r.todo.forEach(function(u){todoSet[u.lap+"-"+u.i]=1});
  var h=['<section class="card"><div class="k-head"><div><div class="k-label">つぎの漢字ノート提出</div><h2 class="k-title"><small>'+esc(k.title)+'</small>'+esc(k.range)+'</h2></div>'];
  h.push('<div class="count'+(due<=1&&!r.complete?' urgent':'')+'"><div class="d">提出 <b>'+md(k.date)+'</b></div><div class="n2">'+(wd>0?'書く日 あと<b class="num">'+wd+'</b>日<span class="d">（'+(function(){var a=[];for(var d=TODAY;d<=r.end;d=add(d,1))a.push(dnum(d));return a.join("・")})()+'）</span>':(due>0?'今日からは見直しの日':'今日提出'))+'</div></div></div>');
  h.push('<div class="laps"><span class="lap l1">1周目 練習</span> <b class="num">'+r.l1c+'</b>/'+n+'　<span class="lap l2">2周目 文作り（1字2問）</span> <b class="num">'+r.l2c+'</b>/'+n+'</div>');
  h.push('<div class="hint">'+(phase2?'文作りがおわった字をタップ（1字 '+P.l2+'pt）':'練習がおわった字をタップ（1字 '+P.l1+'pt）。全部おわったら文作りへ')+'・金色の点線＝今日やる字</div><div class="masu">');
  for(var i=0;i<n;i++){
    var c=k.chars[i]||"",a=k.l1[i],b=k.l2[i];
    var cls=b?" f2":a?" f":"";
    if(todoSet["1-"+i]||todoSet["2-"+i])cls+=" plan";
    h.push('<button class="ms'+cls+'" data-act="masu" data-id="'+esc(k.id)+'" data-i="'+i+'" aria-label="'+esc(c)+(b?' 文作りまで済':a?' 練習済':'')+'">'+esc(c)+'</button>');
  }
  h.push('</div><div class="remain">'+(r.complete?(r.bonus?'<span class="ok">完成！予定どおりボーナス +'+P.bonus+'pt</span>':'<span class="ok">完成！</span>'):r.behind>0?'<span class="late">予定より '+r.behind+'文字分おくれ</span>':'<span class="ok">予定どおり</span>')+(!r.complete?'<span class="muted">'+md(r.end)+'までに2周おわれば ボーナス +'+P.bonus+'pt</span>':'')+'</div>');
  var c2=breakdown(TODAY,k.date,om);
  h.push('<div class="strip">');
  for(var d=TODAY;d<=k.date;d=add(d,1)){var t=dayType(d,om),q="";
    if(d===k.date)q="提出";else if(d<=r.end){var wv=d===TODAY?r.todo.length:Math.round(r.tgt(d)-r.tgt(add(d,-1)));q=wv>0?wv+"字":"";}else q="見直し";
    h.push('<div class="chip '+t+(d===TODAY?' today':'')+(d===k.date?' due':'')+'"><span class="dd num">'+dnum(d)+'</span>'+WD[dow(d)]+(t==="off"?'<span class="q">休校</span>':t==="hol"?'<span class="q">祝</span>':'')+'<span class="q">'+q+'</span></div>');}
  h.push('</div><div class="legend"><span style="--c:var(--leaf)">提出まで '+bdText(c2)+'</span></div>');
  return h.join("")+'<p class="tip">提出日には「漢字ドリル」も持っていく</p></section>';
}

function renderTests(om){
  var up=sorted("test").filter(function(x){return x.date>=TODAY}).slice(0,4);
  var h=['<section class="card"><div class="sec-h"><h2>つぎのテスト</h2></div>'];
  if(!up.length)h.push('<p class="muted">テストの予定はありません</p>');

function submitSheet(){
  var f=document.getElementById("f");if(!f)return;
  var fd=new FormData(f),old=ui.sheet.mode==="edit"?ui.sheet.item:null;
  var kind=old&&old.kind==="kanji"?"kanji":fd.get("kind"),date=fd.get("date");
  if(!date){ui.flash="日付を入れてください";render();return}
  var it={id:old?old.id:(kind[0]+Date.now().toString(36)),kind:kind,date:date};
  var note=(fd.get("note")||"").trim();if(note)it.note=note;
  if(kind==="kanji"){
    it.title=old.title;it.range=(fd.get("range")||"").trim()||old.range;
    var ch=it.range===old.range?old.chars:(charsFor(it.range)||old.chars);
    it.chars=ch;var keep=ch===old.chars;
    it.l1=keep?old.l1.slice():ch.split("").map(function(){return null});
    it.l2=keep?old.l2.slice():ch.split("").map(function(){return null});
  } else {
    var sj=fd.get("subject");if(kind!=="off"&&sj&&sj!=="未選択")it.subject=sj;
    var tt=(fd.get("title")||"").trim();if(tt)it.title=tt;
    if(kind==="off"&&!it.title)it.title="休校";
    if(kind==="hw"){it.pts=Math.max(0,parseInt(fd.get("pts"),10)||0);if(old&&old.finished)it.finished=old.finished}
    if(kind==="test"){
      if(old&&old.studied)it.studied=old.studied;
      it.tasks=[];
      root.querySelectorAll("#task-rows .task-row").forEach(function(r,i){
        var text=r.querySelector(".tr-text").value.trim();if(!text)return;
        var d=r.querySelector(".tr-date").value||date;
        it.tasks.push({id:r.getAttribute("data-tid")||("x"+Date.now().toString(36)+i),date:d,text:text,pts:Math.max(0,parseInt(r.querySelector(".tr-pts").value,10)||0),done:r.getAttribute("data-done")||null});
      });
      it.tasks.sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0});
    }
  }
  if(old){var i=state.items.indexOf(old);if(i>=0)state.items[i]=it}else state.items.push(it);
  ui.sheet=ui.sheet.back||null;ui.del=null;ui.flash="";render();
}

var EM=["✦","✧","☘","♡","✿"];
function burst(x,y,n){for(var i=0;i<(n||10);i++){var s=document.createElement("span");s.className="burst";s.textContent=EM[i%EM.length];
  var a=Math.random()*6.28,r=50+Math.random()*60;s.style.left=x+"px";s.style.top=y+"px";s.style.setProperty("--x",Math.cos(a)*r+"px");s.style.setProperty("--y",Math.sin(a)*r+"px");
  s.style.color=["#8fc7e8","#c9a961","#e9a2bf","#b3a6e0","#86c9b0"][i%5];document.body.appendChild(s);setTimeout(function(el){el.remove()}.bind(null,s),950)}}
function toast(msg,sub){var t=document.createElement("div");t.className="toast";t.innerHTML=esc(msg)+(sub?'<small>'+esc(sub)+'</small>':'');document.body.appendChild(t);setTimeout(function(){t.remove()},1900);burst(window.innerWidth/2,window.innerHeight*.3,24)}
function popAt(sel){var el=root.querySelector(sel);if(!el)return;el.classList.add("pop");var r=el.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,10)}

root.addEventListener("click",function(ev){
  var b=ev.target.closest("[data-act]");if(!b||!root.contains(b))return;
  var a=b.getAttribute("data-act"),id=b.getAttribute("data-id");
  if(a==="scrim"){if(ev.target===b){ui.sheet=null;ui.del=null;render()}return}
  if(a==="add"){gate({mode:"add",item:newItem(TODAY)});return}
  if(a==="cell"){gate({mode:"day",date:b.getAttribute("data-date")});return}
  if(a==="edit"){var e2=find(id);if(e2){ui.del=null;var bk=ui.sheet&&(ui.sheet.mode==="list"||ui.sheet.mode==="day")?ui.sheet:null;gate({mode:"edit",item:e2,back:bk})}return}
  if(a==="editlist"){gate({mode:"list",past:false});return}
  if(a==="list-past"){ui.sheet.past=b.getAttribute("data-v")==="1";render();return}
  if(a==="pin-ok"){submitPin();return}
  if(a==="sheet-close"){ui.sheet=ui.sheet&&ui.sheet.back||null;ui.del=null;render();return}
  if(a==="task-add"){var rows=document.getElementById("task-rows"),dt=(document.getElementById("f-date")||{}).value||"";rows.insertAdjacentHTML("beforeend",taskRow(null,dt));return}
  if(a==="task-del"){var row=b.closest(".task-row");if(row)row.remove();return}
  if(a==="cal"){var d=+b.getAttribute("data-d"),m=ui.cal[1]+d,y=ui.cal[0];if(m<0){m=11;y--}if(m>11){m=0;y++}ui.cal=[y,m];render();return}
  if(a==="past"){ui.past=b.getAttribute("data-v")==="1";render();return}
  /* 乙葉が記録するところ */
  if(a==="masu"){
    var k=find(id),i=+b.getAttribute("data-i");if(!k)return;
    var before=kanjiInfo(k),n=before.n,P=state.settings.pts,gained=0;
    if(before.l1c<n){ if(k.l1[i]){k.l1[i]=null}else{k.l1[i]=TODAY;gained=P.l1} }
    else { if(k.l2[i]){k.l2[i]=null}else{k.l2[i]=TODAY;gained=P.l2} }
    var after=kanjiInfo(k);render();
    if(gained){popAt('[data-act="masu"][data-id="'+id+'"][data-i="'+i+'"]');
      if(after.complete&&!before.complete)toast("完成！ "+k.range,after.bonus?"予定どおりボーナス +"+P.bonus+"pt":"よくがんばったね");
      else if(after.l1c===n&&before.l1c<n)toast("練習ぜんぶおわり！","つぎは文作り ☘");
      else if(!after.todo.length&&before.todo.length)toast("今日の分クリア！","+"+gained+"pt");}
    return}
  if(a==="task"){var t=find(id),tid=b.getAttribute("data-t");if(!t)return;var x=(t.tasks||[]).filter(function(z){return z.id===tid})[0];if(!x)return;
    x.done=x.done?null:TODAY;render();if(x.done)toast("できた！",x.pts?"+"+x.pts+"pt":"えらい ☘");return}
  if(a==="study"){var s1=find(id);if(!s1)return;var st=(s1.studied||[]).slice(),p=st.indexOf(TODAY);if(p>=0)st.splice(p,1);else st.push(TODAY);s1.studied=st.slice(-30);render();if(p<0)toast("えらい！","テスト勉強やったね");return}
  if(a==="hwdone"){var w=find(id);if(!w)return;w.finished=w.finished?null:TODAY;render();if(w.finished)toast("おわった！",w.pts?"+"+w.pts+"pt":"すごい ♡");return}
  /* ここから下は暗証番号を入れたあとだけ */
  if(a==="add-on"){ui.sheet={mode:"add",item:newItem(b.getAttribute("data-date"))};render();return}
  if(a==="settle"){state.settings.settled=points().total;render();return}
  if(a==="pin-change"){ui.sheet={mode:"pin",change:true};render();return}
  if(a==="del"){ui.del=id;render();return}
  if(a==="del-no"){ui.del=null;render();return}
  if(a==="del-yes"){state.items=state.items.filter(function(x){return x.id!==id});ui.del=null;ui.sheet=ui.sheet&&ui.sheet.back||null;render();return}
  if(a==="sheet-ok"){submitSheet();return}
});

  if(/^set-/.test(t.id)){
    if(t.id==="set-fb")state.settings.finishBefore=+t.value;
    if(t.id==="set-tp")state.settings.testPrep=+t.value;
    if(t.id==="set-p1")state.settings.pts.l1=Math.max(0,+t.value||0);
    if(t.id==="set-p2")state.settings.pts.l2=Math.max(0,+t.value||0);
    if(t.id==="set-pb")state.settings.pts.bonus=Math.max(0,+t.value||0);
    persist();return}
  if(t.id==="f-kind"){var k=t.value;root.querySelectorAll("[data-for]").forEach(function(el){el.hidden=el.getAttribute("data-for").split(",").indexOf(k)<0})}
});
root.addEventListener("submit",function(ev){ev.preventDefault();if(ev.target.id==="f")submitSheet();if(ev.target.id==="pinf")submitPin()});
document.addEventListener("keydown",function(ev){if(ev.key==="Escape"&&ui.sheet){ui.sheet=null;render()}});
render();
})();
</script>
</body>
</html>
