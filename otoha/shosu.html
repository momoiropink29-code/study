<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小数まほう学校 — 乙葉</title>
<style>
:root{
  --sky1:#221a3a; --sky2:#3d2c66; --ink:#fdfbff;
  --mint:#8ef2d0; --sakura:#ffb3d1; --lemon:#ffe38a; --lav:#c9b6ff;
  --dim:rgba(253,251,255,.62);
  --panel:rgba(255,255,255,.07);
  --line:rgba(255,255,255,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  min-height:100dvh;
  background:radial-gradient(120% 80% at 20% 0%, #4a3577 0%, var(--sky2) 40%, var(--sky1) 100%);
  color:var(--ink);
  font-family:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN W4","YuGothic","Yu Gothic",system-ui,sans-serif;
  padding:18px 16px 60px; line-height:1.6;
}
.wrap{max-width:560px;margin:0 auto}

/* hero */
.hero{padding:6px 2px 18px}
.hero h1{font-size:26px;margin:0 0 2px;letter-spacing:.02em}
.hero p{margin:0;color:var(--dim);font-size:13.5px}
.spell{
  margin:16px 0 4px;padding:16px 14px;border-radius:20px;
  background:var(--panel);border:1px solid var(--line);
  font-size:26px;text-align:center;letter-spacing:.04em;
  font-variant-numeric:tabular-nums;
}
.spell .dot{display:inline-block;color:var(--lemon);animation:hop 2.4s ease-in-out infinite}
@keyframes hop{0%,55%{transform:translate(0,0)}70%,100%{transform:translate(1.15em,-.5em)}}
@media (prefers-reduced-motion:reduce){.spell .dot{animation:none}}
.spell small{display:block;font-size:12.5px;color:var(--dim);margin-top:8px;letter-spacing:0}

/* crystals */
.bar{display:flex;align-items:center;gap:10px;margin:14px 0 6px;font-size:14px;color:var(--dim)}
.bar b{color:var(--lemon);font-size:17px}

/* module list */
.mods{display:grid;gap:10px;margin-top:14px}
.mod{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:14px 14px;border-radius:18px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);font:inherit;cursor:pointer;
}
.mod:active{transform:scale(.985)}
.mod .icon{font-size:24px;width:34px;text-align:center;flex:none}
.mod .t{flex:1;min-width:0}
.mod .t strong{display:block;font-size:16px;font-weight:600}
.mod .t span{display:block;font-size:12.5px;color:var(--dim)}
.mod .star{font-size:16px;flex:none;opacity:.35}
.mod.cleared{border-color:rgba(142,242,208,.55)}
.mod.cleared .star{opacity:1}
.mod.focus{border-color:var(--sakura);background:rgba(255,179,209,.13)}

/* quiz */
.q-head{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--dim);margin-bottom:10px}
.back{background:none;border:none;color:var(--dim);font:inherit;padding:4px 0;cursor:pointer}
.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px 16px}
.qtext{font-size:17px;margin:0 0 14px;white-space:pre-wrap}
.big{font-size:30px;text-align:center;margin:10px 0 18px;font-variant-numeric:tabular-nums;letter-spacing:.03em}

.opts{display:grid;gap:9px}
.opt{
  padding:14px;border-radius:15px;border:1px solid var(--line);
  background:rgba(255,255,255,.05);color:var(--ink);font:inherit;font-size:17px;
  text-align:center;cursor:pointer;font-variant-numeric:tabular-nums;
}
.opt.ok{background:rgba(142,242,208,.22);border-color:var(--mint)}
.opt.ng{background:rgba(255,179,209,.2);border-color:var(--sakura)}

.inputs{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.inputs label{font-size:14px;color:var(--dim)}
input[type=text]{
  width:120px;padding:12px;border-radius:14px;border:1px solid var(--line);
  background:rgba(0,0,0,.22);color:var(--ink);font:inherit;font-size:22px;text-align:center;
  font-variant-numeric:tabular-nums;
}
input:focus{outline:2px solid var(--lav);outline-offset:1px}

/* point placement */
.digits{display:flex;justify-content:center;align-items:flex-end;gap:0;margin:6px 0 18px;flex-wrap:wrap}
.digit{font-size:34px;font-variant-numeric:tabular-nums;padding:0 1px}
.gap{
  width:26px;height:44px;border:none;background:none;cursor:pointer;
  border-radius:8px;color:var(--dim);font-size:26px;line-height:1;
}
.gap:active,.gap.sel{background:rgba(255,227,138,.25);color:var(--lemon)}

.go{
  display:block;width:100%;margin-top:16px;padding:15px;border-radius:16px;border:none;
  background:linear-gradient(100deg,var(--lav),var(--sakura));color:#241a3f;
  font:inherit;font-size:17px;font-weight:700;cursor:pointer;
}
.go[disabled]{opacity:.45}

.fb{margin-top:14px;padding:14px;border-radius:16px;font-size:14.5px;display:none}
.fb.show{display:block}
.fb.right{background:rgba(142,242,208,.16);border:1px solid rgba(142,242,208,.5)}
.fb.wrong{background:rgba(255,179,209,.14);border:1px solid rgba(255,179,209,.5)}
.fb h4{margin:0 0 6px;font-size:15px}
.fb p{margin:0;color:var(--ink)}
.fb .rule{margin-top:8px;font-size:13.5px;color:var(--lemon)}

.done{text-align:center;padding:30px 10px}
.done .num{font-size:52px;color:var(--lemon);font-variant-numeric:tabular-nums}
.hide{display:none}
.note{font-size:12.5px;color:var(--dim);margin-top:22px;text-align:center}

/* ===== ごほうび ===== */
.nav{display:flex;gap:8px;margin:12px 0 4px}
.nav button{
  flex:1;padding:11px;border-radius:999px;border:1px solid var(--line);
  background:rgba(255,255,255,.05);color:var(--ink);font:inherit;font-size:13.5px;cursor:pointer;
}
.nav button.on{background:linear-gradient(100deg,var(--lav),var(--sakura));color:#241a3f;border-color:transparent;font-weight:700}

.petmini{
  display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:20px;
  background:linear-gradient(160deg,rgba(201,182,255,.18),rgba(255,179,209,.12));
  border:1px solid var(--line);margin-top:14px;
}
.petmini .face{font-size:30px;line-height:1}
.petmini .t{flex:1;min-width:0}
.petmini .t strong{display:block;font-size:15px}
.petmini .t span{font-size:12px;color:var(--dim)}

/* もこもこブロブ */
.stage{position:relative;display:grid;place-items:center;padding:26px 0 10px}
.blob{
  width:190px;height:190px;display:grid;place-items:center;
  border-radius:46% 54% 52% 48% / 50% 46% 54% 50%;
  background:radial-gradient(circle at 34% 28%, rgba(255,255,255,.55), rgba(201,182,255,.30) 45%, rgba(255,179,209,.18) 75%);
  box-shadow:0 0 0 10px rgba(255,255,255,.05), 0 0 34px rgba(201,182,255,.45),
             inset 0 -10px 24px rgba(255,255,255,.25);
  animation:morph 9s ease-in-out infinite, float 4.5s ease-in-out infinite;
}
@keyframes morph{
  0%,100%{border-radius:46% 54% 52% 48% / 50% 46% 54% 50%}
  50%{border-radius:56% 44% 46% 54% / 44% 56% 44% 56%}
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.blob .face{font-size:78px;line-height:1;filter:drop-shadow(0 6px 12px rgba(0,0,0,.35))}
.blob.lv3{box-shadow:0 0 0 12px rgba(255,227,138,.12), 0 0 48px rgba(255,227,138,.55), inset 0 -10px 24px rgba(255,255,255,.3)}

.sparkles{position:absolute;inset:0;pointer-events:none}
.sparkles i{position:absolute;font-style:normal;font-size:14px;opacity:0;animation:twinkle 3.2s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.6)}50%{opacity:1;transform:scale(1.15)}}
@media (prefers-reduced-motion:reduce){.blob,.sparkles i{animation:none}.sparkles i{opacity:.8}}

.petname{text-align:center;font-size:20px;margin:6px 0 2px}
.petsub{text-align:center;font-size:12.5px;color:var(--dim);margin:0 0 12px}
.lvbar{height:9px;border-radius:999px;background:rgba(0,0,0,.28);overflow:hidden;margin:0 auto 6px;max-width:240px}
.lvbar i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--lemon));border-radius:999px}

.shop{display:grid;gap:10px;margin-top:16px}
.buy{
  display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;
  border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;cursor:pointer;text-align:left;
}
.buy .icon{font-size:26px}
.buy .t{flex:1}
.buy .t strong{display:block;font-size:15px}
.buy .t span{font-size:12px;color:var(--dim)}
.buy .cost{color:var(--lemon);font-size:14px;white-space:nowrap}
.buy[disabled]{opacity:.4}

.dex{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
.cell{
  aspect-ratio:1;display:grid;place-items:center;border-radius:16px;font-size:24px;
  background:rgba(255,255,255,.05);border:1px solid var(--line);cursor:pointer;
}
.cell.got{background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.3), rgba(201,182,255,.14))}
.cell.locked{color:rgba(253,251,255,.18)}
.cell.rare.got{border-color:var(--lemon);box-shadow:0 0 14px rgba(255,227,138,.35)}
.cell.on{outline:2px solid var(--mint)}

.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
  background:rgba(34,26,58,.96);border:1px solid var(--line);border-radius:16px;
  padding:12px 18px;font-size:14px;max-width:88%;text-align:center;z-index:9;
  box-shadow:0 8px 28px rgba(0,0,0,.4);
}
.mini{font-size:12px;color:var(--dim);text-align:center;margin-top:16px}
textarea{width:100%;height:80px;border-radius:12px;background:rgba(0,0,0,.25);color:var(--ink);border:1px solid var(--line);font-size:12px;padding:8px;margin-top:8px}

/* まほうのすみか */
.home2{margin-top:26px;border-top:1px solid var(--line);padding-top:20px}
.home2 h2{font-size:17px;margin:0 0 12px;font-weight:600}
.nest{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px 16px;text-align:center}
.petbox{display:flex;flex-direction:column;align-items:center;gap:6px}
.pet{
  width:104px;height:104px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:46px;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.28),rgba(255,255,255,.05));
  border:1px solid var(--line);
}
.pet.st2{box-shadow:0 0 0 4px rgba(201,182,255,.25);font-size:52px}
.pet.st3{box-shadow:0 0 0 4px rgba(255,227,138,.3),0 0 24px rgba(255,227,138,.35);font-size:58px}
.petname{font-size:16px;font-weight:600}
.petlv{font-size:12.5px;color:var(--dim)}
.gauge{width:150px;height:6px;border-radius:3px;background:rgba(0,0,0,.3);overflow:hidden;margin-top:4px}
.gauge i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--lemon))}
.shop{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
.buy{padding:12px 8px;border-radius:15px;border:1px solid var(--line);background:rgba(255,255,255,.05);
  color:var(--ink);font:inherit;font-size:14px;cursor:pointer;line-height:1.35}
.buy span{display:block;font-size:11.5px;color:var(--lemon)}
.buy[disabled]{opacity:.4}
.msg{margin-top:12px;font-size:13.5px;color:var(--mint);min-height:20px}
.roster{display:flex;gap:8px;overflow-x:auto;margin-top:14px;padding-bottom:4px}
.roster button{flex:none;width:52px;height:52px;border-radius:50%;font-size:24px;cursor:pointer;
  border:1px solid var(--line);background:rgba(255,255,255,.05)}
.roster button.on{border-color:var(--lemon);background:rgba(255,227,138,.18)}
.dex{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-top:12px}
.dex div{aspect-ratio:1;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.18);
  display:flex;align-items:center;justify-content:center;font-size:20px;color:rgba(255,255,255,.2)}
.tools{display:flex;gap:8px;margin-top:14px}
.tools button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);
  background:none;color:var(--dim);font:inherit;font-size:12.5px;cursor:pointer}
#bk{width:100%;margin-top:10px;height:70px;border-radius:12px;border:1px solid var(--line);
  background:rgba(0,0,0,.25);color:var(--ink);font-size:11px;padding:8px;display:none}
</style>
</head>
<body>
<div class="wrap">

<!-- ホーム -->
<section id="home">
  <div class="hero">
    <h1>小数まほう学校</h1>
    <p>小数点をあやつれたら、小数はぜんぶ味方になる。</p>
  </div>

  <div class="spell">
    3 ÷ 0<span class="dot">.</span>06 → 300 ÷ 6 = 50
    <small>わる数を整数にすると、答えが見える</small>
  </div>

  <div class="bar">光の粒 <b id="crystal">0</b></div>

  <div class="nav">
    <button id="t1" class="on">べんきょう</button>
    <button id="t2">ペット</button>
    <button id="t3">ずかん</button>
  </div>

  <div id="petmini"></div>
  <div class="mods" id="mods"></div>

  <p class="note">1日ぜんぶやらなくていい。2つ選べば十分。</p>

  <div class="home2">
    <h2>まほうのすみか</h2>
    <div class="nest">
      <div class="petbox" id="petbox"></div>
      <div class="shop">
        <button class="buy" id="egg1">たまごをもらう<span>50つぶ</span></button>
        <button class="buy" id="egg2">レアのたまご<span>150つぶ</span></button>
        <button class="buy" id="feed">えさをあげる<span>30つぶ</span></button>
        <button class="buy" id="dexbtn">ずかんを見る<span id="dexn"></span></button>
      </div>
      <p class="msg" id="msg"></p>
      <div class="roster" id="roster"></div>
      <div class="dex hide" id="dex"></div>
      <div class="tools">
        <button id="exp">バックアップを書き出す</button>
        <button id="imp">読みこむ</button>
      </div>
      <textarea id="bk" spellcheck="false"></textarea>
    </div>
  </div>
</section>

<!-- クイズ -->
<section id="quiz" class="hide">
  <div class="q-head">
    <button class="back" id="back">← もどる</button>
    <span id="prog"></span>
  </div>
  <div class="card">
    <p class="qtext" id="qtext"></p>
    <div id="body"></div>
    <button class="go" id="go">こたえる</button>
    <div class="fb" id="fb"><h4 id="fbh"></h4><p id="fbp"></p><p class="rule" id="fbr"></p></div>
  </div>
</section>

<!-- ペット -->
<section id="pet" class="hide">
  <div class="bar">光の粒 <b id="crystal2">0</b></div>
  <div class="nav">
    <button id="p1">べんきょう</button>
    <button id="p2" class="on">ペット</button>
    <button id="p3">ずかん</button>
  </div>
  <div id="petview"></div>
  <div class="shop" id="shop"></div>
  <p class="mini">たまごは光の粒でもらえる。まいにち少しずつ育つよ。</p>
</section>

<!-- ずかん -->
<section id="dex" class="hide">
  <div class="bar">あつめた精霊 <b id="dexcount">0</b> / 30</div>
  <div class="nav">
    <button id="d1">べんきょう</button>
    <button id="d2">ペット</button>
    <button id="d3" class="on">ずかん</button>
  </div>
  <div class="dex" id="dexgrid"></div>
  <p class="petsub" id="dexinfo" style="margin-top:14px"></p>
  <p class="mini">きろくのバックアップ（コピーして保存 / はりつけて復元）</p>
  <textarea id="bk"></textarea>
  <button class="go" id="restore" style="margin-top:8px">はりつけた記録から復元</button>
</section>

<!-- おわり -->
<section id="end" class="hide">
  <div class="done">
    <div class="num" id="score"></div>
    <p id="endmsg"></p>
    <button class="go" id="again">ホームへ</button>
  </div>
</section>

</div>
<script>
/* ---------- 保存（使えない環境ではメモリに退避） ---------- */
const KEY='otoha_shosu_v1';
let save={crystal:0,cleared:{},wrong:[]};
try{const s=localStorage.getItem(KEY); if(s) save=Object.assign(save,JSON.parse(s));}catch(e){}
function store(){try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){}}

/* ---------- 問題 ---------- */
const M=[
{id:'naoshi',icon:'🩹',name:'テストの直し',sub:'9/3のテストでまちがえた8問',q:[
 {t:'in',q:'3 ÷ 0.06 =',a:'50',
  fb:'両方を100倍して 300÷6 = 50。',rule:'わる数が1より小さいと、答えはわられる数より大きくなる。'},
 {t:'in',q:'5.6 ÷ 8.75 =',a:'0.64',
  fb:'両方を100倍して 560÷875 = 0.64。',rule:'わる数のほうが大きいと、答えは1より小さくなる。'},
 {t:'in',q:'12 ÷ 2.5 =',a:'4.8',
  fb:'両方を10倍して 120÷25 = 4.8。',rule:'わる数の小数点を動かした分だけ、わられる数も同じだけ動かす。'},
 {t:'in',q:'2.8 × 1.4 =',a:'3.92',
  fb:'28×14 = 392。小数点は合わせて2つ分なので 3.92。',rule:'かけ算は「小数点の数をたす」。'},
 {t:'in',q:'5.45 × 29.6 − 4.95 × 29.6 =',a:'14.8',
  fb:'(5.45−4.95)×29.6 = 0.5×29.6。0.5倍は半分だから 14.8。',rule:'0.5をかける＝半分にする。'},
 {t:'ch',q:'5.6mの重さが1.4gのはり金。\n1mあたりの重さを出す式は？',o:['1.4 ÷ 5.6','5.6 ÷ 1.4'],a:0,
  fb:'1mあたり＝mの数でわる。1.4÷5.6 = 0.25g。',rule:'「1◯あたり」は、◯の数でわる。'},
 {t:'ch',q:'同じはり金で、1gあたりの長さを出す式は？',o:['1.4 ÷ 5.6','5.6 ÷ 1.4'],a:1,
  fb:'1gあたり＝gの数でわる。5.6÷1.4 = 4m。',rule:'ほしいのが長さなら、長さ ÷ 重さ。'},
 {t:'in',q:'海水1kgに塩が30.4g。\n288.8gの塩をとるには何kgの海水？',a:'9.5',unit:'kg',
  fb:'288.8 ÷ 30.4 = 9.5kg。',rule:'「1kgあたり30.4g」だから、ほしい量 ÷ 1あたりの量。'}
]},

{id:'ten',icon:'✨',name:'小数点ダンス',sub:'わり算は、わる数を整数にしてから',q:[
 {t:'ch',q:'3 ÷ 0.06 を筆算にするには？',o:['30 ÷ 0.6','300 ÷ 6','3 ÷ 6'],a:1,
  fb:'0.06を6にするには100倍。3も100倍して300。',rule:'わる数を整数にする分だけ、両方うごかす。'},
 {t:'ch',q:'0.9 ÷ 0.34 を筆算にするには？',o:['9 ÷ 3.4','90 ÷ 34','0.9 ÷ 34'],a:1,
  fb:'0.34→34は100倍。0.9も100倍で90。',rule:'動かすのはいつも「両方」。'},
 {t:'ch',q:'7.15 ÷ 3.2 を筆算にするには？',o:['71.5 ÷ 32','715 ÷ 32','7.15 ÷ 32'],a:0,
  fb:'3.2→32は10倍。7.15も10倍で71.5。',rule:'10倍なら10倍、100倍なら100倍。ずらす数は同じ。'},
 {t:'ch',q:'23.48 ÷ 2.8 を筆算にするには？',o:['234.8 ÷ 28','2348 ÷ 28','23.48 ÷ 28'],a:0,
  fb:'2.8→28は10倍。23.48も10倍で234.8。',rule:'わられる数の小数点は、そのまま上にあげる。'},
 {t:'ch',q:'4.8 ÷ 4.92 を筆算にするには？',o:['48 ÷ 49.2','480 ÷ 492','4.8 ÷ 492'],a:1,
  fb:'4.92→492は100倍。4.8も100倍で480。',rule:'わられる数の位が足りないときは0をつけたす。'}
]},

{id:'size',icon:'⚖️',name:'大きくなる？小さくなる？',sub:'計算する前に答えを予想する',q:[
 {t:'ch',q:'8 ÷ 0.4 の答えは？',o:['8より大きい','8より小さい'],a:0,
  fb:'8の中に0.4は20個ある。答えは20。',rule:'1より小さい数でわると、答えは大きくなる。'},
 {t:'ch',q:'8 ÷ 1.6 の答えは？',o:['8より大きい','8より小さい'],a:1,
  fb:'8÷1.6 = 5。',rule:'1より大きい数でわると、答えは小さくなる。'},
 {t:'ch',q:'8 × 0.4 の答えは？',o:['8より大きい','8より小さい'],a:1,
  fb:'8×0.4 = 3.2。',rule:'1より小さい数をかけると、答えは小さくなる。'},
 {t:'ch',q:'3 ÷ 0.06 の答えは？',o:['3より小さい','3と5のあいだ','3よりずっと大きい'],a:2,

/* ---------- 画面 ---------- */
const $=id=>document.getElementById(id);
let cur=null,idx=0,ok=0,answered=false,sel=null;

function home(){
  ['quiz','end','pet','dex'].forEach(s=>$(s).classList.add('hide'));
  $('home').classList.remove('hide');
  $('crystal').textContent=save.crystal;
  renderPetMini();
  const box=$('mods'); box.innerHTML='';
  M.forEach((m,i)=>{
    const b=document.createElement('button');
    b.className='mod'+(save.cleared[m.id]?' cleared':'')+(i===0?' focus':'');
    b.innerHTML=`<span class="icon">${m.icon}</span><span class="t"><strong>${m.name}</strong><span>${m.sub}</span></span><span class="star">⭐️</span>`;
    b.onclick=()=>start(m);
    box.appendChild(b);
  });
  window.scrollTo(0,0);
}

function start(m){
  cur=m; idx=0; ok=0;
  ['home','end','pet','dex'].forEach(s=>$(s).classList.add('hide'));
  $('quiz').classList.remove('hide');
  render();
}

function norm(s){return String(s).trim().replace(/[０-９．]/g,c=>'0123456789.'[('０１２３４５６７８９．').indexOf(c)]).replace(/^\./,'0.').replace(/^(-?\d+)\.0*$/,'$1');}
function same(a,b){const x=parseFloat(norm(a)),y=parseFloat(norm(b));return !isNaN(x)&&Math.abs(x-y)<1e-9;}

function render(){
  answered=false; sel=null;
  const q=cur.q[idx];
  $('prog').textContent=`${cur.name} ${idx+1} / ${cur.q.length}`;
  $('qtext').textContent=q.q;
  $('fb').className='fb';
  const go=$('go'); go.textContent='こたえる'; go.disabled=false;
  const b=$('body'); b.innerHTML='';

  if(q.t==='ch'){
    const d=document.createElement('div'); d.className='opts';
    q.o.forEach((o,i)=>{
      const btn=document.createElement('button'); btn.className='opt'; btn.textContent=o;
      btn.onclick=()=>{if(answered)return;sel=i;[...d.children].forEach(c=>c.classList.remove('ok'));btn.classList.add('ok');};
      d.appendChild(btn);
    });
    b.appendChild(d);
  } else if(q.t==='pt'){
    const d=document.createElement('div'); d.className='digits';
    for(let i=0;i<q.d.length;i++){
      if(i>0){
        const g=document.createElement('button'); g.className='gap'; g.textContent='·'; g.dataset.i=i;
        g.onclick=()=>{if(answered)return;sel=i;[...d.querySelectorAll('.gap')].forEach(x=>x.classList.remove('sel'));g.classList.add('sel');};
        d.appendChild(g);
      }
      const s=document.createElement('span'); s.className='digit'; s.textContent=q.d[i]; d.appendChild(s);
    }
    b.appendChild(d);
    const p=document.createElement('p'); p.style.cssText='text-align:center;font-size:13px;color:var(--dim);margin:0';
    p.textContent='小数点を打つ場所をタップ'; b.appendChild(p);
  } else if(q.t==='two'){
    const d=document.createElement('div'); d.className='inputs';
    d.innerHTML=`<label>${q.l1}</label><input type="text" inputmode="decimal" id="i1">
                 <label>${q.l2}</label><input type="text" inputmode="decimal" id="i2">`;
    b.appendChild(d);
  } else {
    const d=document.createElement('div'); d.className='inputs';
    d.innerHTML=`<input type="text" inputmode="decimal" id="i1">${q.unit?`<label>${q.unit}</label>`:''}`;
    b.appendChild(d);
  }
  window.scrollTo(0,0);
}

$('go').onclick=()=>{
  const q=cur.q[idx];
  if(answered){ next(); return; }
  let right=false;
  if(q.t==='ch'){ if(sel===null)return; right=(sel===q.a);
    [...document.querySelectorAll('.opt')].forEach((c,i)=>{c.classList.remove('ok');if(i===q.a)c.classList.add('ok');if(i===sel&&!right)c.classList.add('ng');});
  } else if(q.t==='pt'){ if(sel===null)return; right=(sel===q.a);
  } else if(q.t==='two'){ right = same($('i1').value,q.a) && same($('i2').value,q.a2);
  } else { right = same($('i1').value,q.a); }

  answered=true;
  const fb=$('fb');
  fb.className='fb show '+(right?'right':'wrong');
  $('fbh').textContent = right?'せいかい ✨':'おしい！ここを見よう';
  let ans = q.t==='pt' ? q.d.slice(0,q.a)+'.'+q.d.slice(q.a)
          : q.t==='ch' ? q.o[q.a]
          : q.t==='two'? `${q.l1} ${q.a} / ${q.l2} ${q.a2}`
          : q.a+(q.unit||'');
  $('fbp').textContent = (right?'':`こたえ： ${ans}\n`)+q.fb;
  $('fbr').textContent = '📌 '+q.rule;
  if(right){ ok++; save.crystal+=10; store(); }
  $('go').textContent = idx+1<cur.q.length ? 'つぎへ →' : 'けっかを見る';
};

function next(){
  idx++;
  if(idx<cur.q.length){ render(); return; }
  const full = ok===cur.q.length;
  if(full){ save.cleared[cur.id]=true; save.crystal+=30; }
  store();
  $('quiz').classList.add('hide'); $('end').classList.remove('hide');
  $('score').textContent=`${ok} / ${cur.q.length}`;
  $('endmsg').textContent = full ? '全問せいかい！光の粒を30個ボーナス ✨'
    : ok>=cur.q.length-1 ? 'あと1問！もう一回やれば⭐️がつくよ。'
    : 'まちがえた所が今日の宝物。ルールを1つだけ覚えて、もう一回。';
  window.scrollTo(0,0);
}

/* ---------- まほうの精霊 30種 ---------- */
const SP=[

 {id:23,n:'みつばち',e:'🐝',t:'モコモコ'},{id:24,n:'はりねずみ',e:'🦔',t:'モコモコ'},
 {id:25,n:'ユニコーン',e:'🦄',t:'キラキラ',r:1},{id:26,n:'こりゅう',e:'🐉',t:'キラキラ',r:1},
 {id:27,n:'フェアリークイーン',e:'🧚',t:'キラキラ',r:1},{id:28,n:'ひかりのとり',e:'🕊️',t:'ふわふわ',r:1},
 {id:29,n:'スイーツの精',e:'🍰',t:'モコモコ',r:1},{id:30,n:'にじの精',e:'🌈',t:'キラキラ',r:1}
];
const sp=id=>SP.find(s=>s.id===id);
save.pets=save.pets||{}; save.active=save.active||null;

function stage(lv){return lv>=7?3:lv>=4?2:1}
function fullname(s,lv){const st=stage(lv);return st===1?'ぷち'+s.n:st===2?s.n:s.n+'だいせいれい';}
function toast(msg){
  const d=document.createElement('div'); d.className='toast'; d.textContent=msg;
  document.body.appendChild(d); setTimeout(()=>d.remove(),2600);
}
function sparkleHTML(){
  const pos=[[10,18],[78,12],[88,58],[16,72],[46,4],[62,84]];
  return '<div class="sparkles">'+pos.map((p,i)=>
    `<i style="left:${p[0]}%;top:${p[1]}%;animation-delay:${i*0.42}s">✧</i>`).join('')+'</div>';
}

function renderPetMini(){
  const box=$('petmini');
  if(!save.active){ box.innerHTML=
    `<div class="petmini"><span class="face">🥚</span><span class="t">
     <strong>まだ相棒がいないよ</strong><span>光の粒50でたまごがもらえる</span></span></div>`;
    return;
  }
  const p=save.pets[save.active], s=sp(save.active);
  box.innerHTML=`<div class="petmini"><span class="face">${s.e}</span><span class="t">
    <strong>${fullname(s,p.lv)}</strong><span>Lv.${p.lv} ／ ${s.t}の精霊</span></span></div>`;
}

function renderPet(){
  $('crystal2').textContent=save.crystal;
  const v=$('petview');
  if(!save.active){
    v.innerHTML=`<div class="stage"><div class="blob"><span class="face">🥚</span>${sparkleHTML()}</div></div>
      <p class="petname">たまごを かえそう</p>
      <p class="petsub">問題を解くと光の粒がたまるよ（1問10・全問正解＋30）</p>`;
  }else{
    const p=save.pets[save.active], s=sp(save.active), st=stage(p.lv);
    v.innerHTML=`<div class="stage"><div class="blob${st===3?' lv3':''}">
        <span class="face" style="font-size:${58+st*12}px">${s.e}</span>${sparkleHTML()}</div></div>
      <p class="petname">${fullname(s,p.lv)}</p>
      <p class="petsub">Lv.${p.lv} ／ ${s.t}の精霊${st<3?'（Lv.'+(st===1?4:7)+'でしんか）':' ・ さいこうLv'}</p>
      <div class="lvbar"><i style="width:${p.lv/9*100}%"></i></div>`;
  }
  const shop=$('shop'); shop.innerHTML='';
  const items=[
    {i:'🥚',n:'ふつうのたまご',s:'24種のどれかがかえる',c:50,f:()=>hatch(false)},
    {i:'🌟',n:'レアなたまご',s:'レア6種が出やすい',c:150,f:()=>hatch(true)},
    {i:'🍬',n:'ひかりのえさ',s:'Lvが1あがる（最大9）',c:30,f:feed}
  ];
  items.forEach(it=>{
    const b=document.createElement('button'); b.className='buy';
    b.innerHTML=`<span class="icon">${it.i}</span><span class="t"><strong>${it.n}</strong><span>${it.s}</span></span><span class="cost">${it.c}</span>`;
    const lvmax = it.c===30 && save.active && save.pets[save.active].lv>=9;
    b.disabled = save.crystal<it.c || (it.c===30 && (!save.active||lvmax));
    b.onclick=()=>{ if(save.crystal<it.c)return; save.crystal-=it.c; it.f(); store(); renderPet(); };
    shop.appendChild(b);
  });
}

function hatch(rare){
  const pool=SP.filter(s=> rare? true : !s.r);
  const unowned=pool.filter(s=>!save.pets[s.id]);
  let pick;
  if(rare && Math.random()<0.6){
    const ru=SP.filter(s=>s.r&&!save.pets[s.id]); pick=ru.length?ru[Math.floor(Math.random()*ru.length)]:null;
  }
  if(!pick) pick = unowned.length? unowned[Math.floor(Math.random()*unowned.length)]
                                : pool[Math.floor(Math.random()*pool.length)];
  if(save.pets[pick.id]){ save.crystal+=40; toast(`${pick.n}はもういるので、光の粒を40こもらった`); return; }
  save.pets[pick.id]={lv:1}; save.active=pick.id;
  toast(`${pick.e} ぷち${pick.n} がうまれた！${pick.r?' ✨レア✨':''}`);
}
function feed(){
  const p=save.pets[save.active]; if(!p||p.lv>=9)return;
  const before=stage(p.lv); p.lv++;
  if(stage(p.lv)>before) toast(`しんか！ ${fullname(sp(save.active),p.lv)} になった ✨`);
}

function renderDex(){
  const g=$('dexgrid'); g.innerHTML='';
  SP.forEach(s=>{
    const got=!!save.pets[s.id];
    const c=document.createElement('button');
    c.className='cell'+(got?' got':' locked')+(s.r?' rare':'')+(save.active===s.id?' on':'');
    c.textContent=got?s.e:'？';
    c.onclick=()=>{
      if(!got){ $('dexinfo').textContent='まだ会えていない精霊'; return; }
      save.active=s.id; store(); renderDex();
      $('dexinfo').textContent=`${fullname(s,save.pets[s.id].lv)}（Lv.${save.pets[s.id].lv}・${s.t}）を相棒にした`;
    };
    g.appendChild(c);
  });
  $('dexcount').textContent=Object.keys(save.pets).length;
  $('bk').value=JSON.stringify(save);
}

function show(which){
  ['home','pet','dex','quiz','end'].forEach(s=>$(s).classList.add('hide'));
  $(which).classList.remove('hide');
  if(which==='pet')renderPet(); if(which==='dex')renderDex();
  window.scrollTo(0,0);
}
['t1','p1','d1'].forEach(i=>$(i).onclick=home);
['t2','p2','d2'].forEach(i=>$(i).onclick=()=>show('pet'));
['t3','p3','d3'].forEach(i=>$(i).onclick=()=>show('dex'));
$('restore').onclick=()=>{
  try{ const o=JSON.parse($('bk').value); if(!o||typeof o!=='object')throw 0;
    save=Object.assign({crystal:0,cleared:{},pets:{},active:null},o); store(); renderDex(); toast('記録を復元した');
  }catch(e){ toast('その文字では復元できない。コピーしなおしてね'); }
};

$('back').onclick=home;
$('again').onclick=home;
home();
</script>
