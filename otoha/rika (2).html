<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ふわもこ理科ノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Parisienne&display=swap" rel="stylesheet">
<style>
:root{
  --kyokasho:"UD デジタル 教科書体 NK-R","UD Digi Kyokasho NK-R","YuKyokasho","游教科書体","Klee One","Hiragino Maru Gothic ProN",serif;
  --sky:#bfe0f2; --sky2:#e8f4fb; --paper:#fbfdff; --line:#cfe6f4;
  --ink:#4a5a66; --sub:#8fa7b6; --gold:#c9a961;
  --blue:#7fc4ea; --blue-d:#58a3cc; --pink:#ffa9c6; --pink-d:#e886a8;
  --mint:#9fdcc4; --mint-d:#6dbb9d; --lav:#c3b7f2; --lav-d:#9d8fdc; --honey:#ffd27a; --honey-d:#e4ad45;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;background-color:#bcdcf0;background:var(--sky);color:var(--ink);font-family:var(--kyokasho);font-size:16px;line-height:1.75;
  padding:max(8px,env(safe-area-inset-top)) 8px max(12px,env(safe-area-inset-bottom));min-height:100vh}
body.home{background:radial-gradient(circle at 15% 10%,#e3f3fc 0 18%,transparent 19%),radial-gradient(circle at 90% 35%,#fbe8f2 0 14%,transparent 15%),radial-gradient(circle at 20% 85%,#eaf7ff 0 20%,transparent 21%),linear-gradient(#cfe9f7,#bcdcf0);background-color:#bcdcf0;background-attachment:fixed}

/* キラキラ */
#kira{position:fixed;inset:0;pointer-events:none;z-index:0;display:none}
body.home #kira{display:block}
#kira i{position:absolute;color:#fff;font-style:normal;text-shadow:0 0 4px #fff,0 0 10px #8fd0f5,0 0 16px #ffc6dc;animation:tw 2.6s ease-in-out infinite;opacity:0}
@keyframes tw{0%,100%{opacity:0;transform:scale(.4) rotate(0)}50%{opacity:1;transform:scale(1) rotate(20deg)}}

.frame{position:relative;z-index:1;max-width:620px;margin:0 auto;background:var(--sky2);border-radius:28px;padding:10px;box-shadow:0 6px 18px rgba(120,170,200,.25)}
.sheet{background:var(--paper);border-radius:22px;border:1px solid #fff;padding:0 0 26px;overflow:hidden}
header{position:relative;padding:14px 16px 20px;text-align:center;
  background:linear-gradient(180deg,#e6f5fd,#fbfdff)}
header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:12px;
  background:radial-gradient(circle at 10px 12px,var(--paper) 9px,transparent 10px) repeat-x;background-size:20px 12px}
.htop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hb{border:none;background:#fff;border-radius:16px;padding:4px 12px;font:inherit;font-size:13px;color:var(--sub);
  box-shadow:0 4px 0 var(--line);cursor:pointer;transition:transform .08s,box-shadow .08s}
.hb:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.stars{background:#fff;border-radius:16px;padding:3px 12px;font-size:14px;font-weight:600;color:var(--gold);box-shadow:0 4px 0 #f1e6c8}
.title{font-family:'Parisienne',cursive;font-size:38px;color:var(--gold);line-height:1;margin-top:6px}
.title .cl{font-size:22px;vertical-align:super}
.sub{font-size:12.5px;color:var(--sub);letter-spacing:.2em;margin-top:2px}
main{padding:6px 16px}

/* ふわふわ画像 */
.hero{display:flex;align-items:center;gap:14px;margin:6px 0 4px}
.puff{position:relative;width:150px;height:150px;flex:none;animation:floaty 3.6s ease-in-out infinite}
.puff .b{position:absolute;border-radius:50%;background:#fff;box-shadow:0 4px 10px rgba(130,185,215,.25)}
.puff .img{position:absolute;inset:17px;border-radius:50%;overflow:hidden;background:var(--sky2);border:3px solid #fff}
.puff img{width:100%;height:100%;object-fit:cover;display:block}
.puff .chg{position:absolute;right:-4px;bottom:2px;z-index:3;border:none;background:var(--pink);color:#fff;font:inherit;font-size:11px;
  border-radius:12px;padding:2px 8px;box-shadow:0 3px 0 var(--pink-d);cursor:pointer}
.puff .chg:active{transform:translateY(2px);box-shadow:0 1px 0 var(--pink-d)}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-10px) rotate(2deg)}}
.puff.sm{width:120px;height:120px;margin:0 auto}
.puff.sm .img{inset:14px}
.count{flex:1;background:#fff;border-radius:26px;padding:12px 14px;text-align:center;box-shadow:0 5px 0 var(--line)}
.count small{display:block;font-size:12.5px;color:var(--sub)}
.count b{font-size:44px;line-height:1.1;color:var(--blue-d);font-weight:600}
.count b span{font-size:18px;margin-left:2px}
.count .dt{font-size:13px;color:var(--ink)}

/* カード */
.card{background:#fff;border-radius:24px;padding:15px 16px;margin-top:14px;box-shadow:0 5px 0 #dcecf6,0 10px 20px rgba(150,195,220,.14)}
.card h2{margin:0 0 6px;font-size:16px;font-weight:600;color:#5f93b3;display:flex;align-items:center;gap:6px}
.muted{color:var(--sub);font-size:13.5px}
.menu{list-style:none;margin:8px 0 0;padding:0}
.menu li{display:flex;align-items:flex-start;gap:10px;background:var(--sky2);border-radius:18px;padding:10px 12px;margin-top:8px;font-size:14.5px}
.menu .ck{width:28px;height:28px;flex:none;border-radius:50%;background:#fff;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff}
.menu li.done .ck{background:var(--mint);border-color:var(--mint)}
.menu li.done{background:#eef9f3}
.menu .tx{flex:1}
.menu .tx small{display:block;color:var(--sub);font-size:12px;line-height:1.5}

/* ボタン（へこむ） */
.btn{display:block;width:100%;border:none;border-radius:22px;padding:14px 18px;margin-top:12px;font:inherit;font-weight:600;font-size:17px;
  color:#fff;cursor:pointer;text-align:center;background:var(--blue);box-shadow:0 6px 0 var(--blue-d);transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(5px);box-shadow:0 1px 0 var(--blue-d)}
.btn.pink{background:var(--pink);box-shadow:0 6px 0 var(--pink-d)}
.btn.pink:active:not(:disabled){box-shadow:0 1px 0 var(--pink-d)}
.btn.mint{background:var(--mint);box-shadow:0 6px 0 var(--mint-d)}
.btn.mint:active:not(:disabled){box-shadow:0 1px 0 var(--mint-d)}
.btn.honey{background:var(--honey);box-shadow:0 6px 0 var(--honey-d);color:#7a5a16}
.btn.honey:active:not(:disabled){box-shadow:0 1px 0 var(--honey-d)}
.btn.rainbow{background:linear-gradient(95deg,#9fd8f5,#b9c9f7,#f5b9d6,#ffd9a8,#b8e8cf);box-shadow:0 6px 0 #9dc3dc;color:#4a5a66}
.btn.rainbow:active:not(:disabled){box-shadow:0 1px 0 #9dc3dc}
.btn.lav{background:var(--lav);color:#fff;box-shadow:0 6px 0 var(--lav-d)}
.btn.lav:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 var(--lav-d)}
.btn.soft{background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--line);font-size:15px}
.btn.soft:active:not(:disabled){box-shadow:0 1px 0 var(--line)}
.btn:disabled{background:#edf2f5;color:#b5c4ce;box-shadow:0 5px 0 #dde6ec;cursor:default}
.btn .s{display:block;font-size:12.5px;font-weight:400;opacity:.95;line-height:1.5}
.row2{display:flex;gap:10px}.row2 .btn{flex:1}
button:focus-visible,input:focus-visible{outline:3px dashed var(--lav);outline-offset:3px}

.unit{display:flex;align-items:center;gap:12px;width:100%;border:none;border-radius:22px;padding:11px 14px;margin-top:10px;font:inherit;
  cursor:pointer;text-align:left;background:#fff;color:var(--ink);box-shadow:0 5px 0 #dcecf6;transition:transform .08s,box-shadow .08s}
.unit:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 #dcecf6}
.unit .ic{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.unit .nm{flex:1;font-weight:600;font-size:15.5px;line-height:1.4}
.unit .ct{display:block;font-size:11.5px;font-weight:400;color:var(--sub)}
.unit .ar{color:#c7dcea;font-size:20px}
.unit:disabled{opacity:.55;cursor:default}

/* クイズ */
.prog{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);margin-top:14px;padding:0 4px}
.pbar{height:14px;background:#fff;border-radius:99px;padding:3px;margin:6px 0 14px;box-shadow:0 3px 0 #dcecf6}
.pbar i{display:block;height:100%;border-radius:99px;transition:width .35s;background:linear-gradient(90deg,#9fd8f5,#c3b7f2,#ffa9c6,#ffd27a,#9fdcc4)}
.qcard{background:#fff;border-radius:24px;padding:16px;position:relative;box-shadow:0 5px 0 #dcecf6}
.tag{display:inline-block;font-size:11.5px;color:#fff;border-radius:99px;padding:1px 11px;margin:0 0 8px}
.qt{margin:0;font-weight:600;font-size:17.5px;line-height:1.8}
.fig{display:block;width:100%;max-width:340px;height:auto;margin:10px auto 0;background:linear-gradient(#f4fafe,#fbfdff);border-radius:18px}
.figrow{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin-top:8px}
.figrow svg{width:31%;min-width:96px;max-width:130px;height:auto;background:#f4fafe;border-radius:14px}
table.t{border-collapse:separate;border-spacing:0;margin:10px auto 0;font-size:13.5px;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 0 0 1.5px var(--line)}
.tw{overflow-x:auto;max-width:100%}
table.t th{background:#e3f2fb;font-weight:600;padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:5px 8px;text-align:center;border-top:1px solid #eef5fa;white-space:nowrap}
table.t td:first-child{background:#f6fbfe;font-weight:600}
.opt{display:flex;align-items:center;gap:12px;width:100%;border:none;background:#fff;border-radius:20px;padding:13px 14px;margin-top:11px;
  font:inherit;font-weight:600;font-size:16px;cursor:pointer;text-align:left;color:var(--ink);box-shadow:0 5px 0 #dcecf6;transition:transform .08s,box-shadow .08s}
.opt:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 #dcecf6}
.opt .k{width:30px;height:30px;flex:none;border-radius:50%;background:var(--sky2);color:var(--blue-d);display:flex;align-items:center;justify-content:center;font-size:14px}
.opt.ok{background:#fff1f6;box-shadow:0 5px 0 #ffc9dc;color:var(--pink-d)}
.opt.ok .k{background:var(--pink);color:#fff}
.opt.ng{background:#eef5fa;box-shadow:0 5px 0 #cfe0ec}
.opt.dim{opacity:.45}
.exp{margin-top:14px;background:#fffbea;border-radius:20px;padding:13px 15px;font-size:15px;box-shadow:0 4px 0 #f7ebc2}
.exp b{display:block;font-size:12.5px;color:#c99a1c;margin-bottom:2px}
.exp.ng{background:#eef6fc;box-shadow:0 4px 0 #d3e6f3}
.exp.ng b{color:var(--blue-d)}
.mark{position:absolute;top:-34px;right:4px;width:82px;height:82px;pointer-events:none}
.pop{animation:pop .32s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.sparkle{position:fixed;font-size:20px;pointer-events:none;z-index:50;animation:spk 1s ease-out forwards;color:#ffc2d8}
@keyframes spk{0%{transform:scale(.3);opacity:0}30%{opacity:1}100%{transform:scale(1.3) translateY(-30px) rotate(30deg);opacity:0}}

/* 書く */
.hint{background:#f3f0ff;border-radius:16px;padding:8px 12px;font-size:13.5px;margin-top:10px;color:#6c5fb0}
.padwrap{position:relative;margin-top:12px;border-radius:18px;overflow:hidden;background:#fff;
  background-image:repeating-linear-gradient(#fff 0 47px,#cfe6f4 47px 48px);box-shadow:0 0 0 2px var(--line)}
.padwrap canvas{display:block;width:100%;touch-action:none;cursor:crosshair}
.padwrap .ph{position:absolute;left:14px;top:10px;font-size:13px;color:#b9cdda;pointer-events:none}
.padbar{display:flex;gap:8px;margin-top:10px}
.padbar .btn{margin-top:0;padding:9px 10px;font-size:14.5px;flex:1}
.model{margin-top:14px;background:#fff1f6;border-radius:20px;padding:13px 15px;box-shadow:0 4px 0 #ffd3e2}
.model b{display:block;font-size:12.5px;color:var(--pink-d)}
.model .ans{font-size:18px;font-weight:600;line-height:1.7}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:4px 0 12px}
.card h2.fold{cursor:pointer;user-select:none}
.tri{display:inline-block;color:var(--sub);font-size:11px;transition:transform .18s;margin-right:2px}
.tri.op{transform:rotate(90deg)}
.lg{width:100%;font:inherit;font-size:11px;line-height:1.5;border:1px solid var(--line);border-radius:12px;padding:8px;color:var(--ink);background:#fff;min-height:160px}
.chl{font-size:13px;color:var(--sub);margin-top:10px}
.rec{float:right;font-size:12px;color:var(--sub);font-weight:600}
.keys{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.key{border:none;font:inherit;font-size:14px;background:#fff;color:var(--ink);border-radius:14px;padding:5px 11px;box-shadow:0 3px 0 #f2cddb;cursor:pointer}
.key:active{transform:translateY(2px);box-shadow:0 1px 0 #f2cddb}
.key.on{background:var(--pink);color:#fff;box-shadow:0 3px 0 var(--pink-d)}
.self{display:flex;gap:8px}
.self .btn{flex:1;font-size:15px;padding:12px 6px}
.numin{display:flex;gap:8px;align-items:center;margin-top:14px}
.numin input{flex:1;min-width:0;font:inherit;font-size:24px;text-align:center;padding:8px;border:2px solid var(--line);border-radius:16px;color:var(--ink)}
.numin input:focus{outline:none;border-color:var(--blue)}
.numin span{font-size:17px}

.score{font-size:68px;line-height:1;margin:6px 0;font-weight:600;background:linear-gradient(95deg,#7fc4ea,#c3b7f2,#ffa9c6);-webkit-background-clip:text;background-clip:text;color:transparent}
.score span{font-size:22px}
.center{text-align:center}
.link{background:none;border:none;color:var(--sub);text-decoration:underline;font:inherit;font-size:13px;cursor:pointer;display:block;margin:22px auto 0}
.points{margin:0;padding-left:1.1em;font-size:15px}
.points li{margin-top:6px}
.points b{color:#d56d93;font-weight:600}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.gal div{background:var(--sky2);border-radius:14px;padding:6px;font-size:11.5px;line-height:1.45}
.gal img{width:100%;border-radius:10px;display:block;background:#fff}
.wl{background:var(--sky2);border-radius:14px;padding:9px 12px;margin-top:8px;font-size:13.5px}
.foot{text-align:center;font-family:'Parisienne',cursive;color:var(--gold);font-size:17px;margin-top:18px}
ruby rt{font-size:.5em}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="kira"></div>
<div class="frame"><div class="sheet">
<header>
  <div class="htop">
    <button class="hb" onclick="go('home')">ホーム</button>
    <span class="stars" id="hdStar">⭐ 0</span>
  </div>
  <div class="title">Rika Note<span class="cl">☁</span></div>
  <div class="sub">ふわもこ理科ノート</div>
</header>
<main id="app"></main>
<div class="foot">Flow, flow, you can do it!</div>
</div></div>
<input type="file" id="imgIn" accept="image/*" hidden>

<script>
/* =========================================================
   0. 保存
   ========================================================= */
const KEY="otoha_rika_v1";
let S={stars:0,done:{},stat:{},wrong:[],gal:[],img:{},unlockAll:false,best:{},pick:{us:[],t:"all",cond:"all",n:20,ord:"weak",sc:"now"},plog:[],ptms:{},open:{}};
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));if(v)S=Object.assign(S,v);}catch(e){}
  S.pick=Object.assign({us:[],t:"all",cond:"all",n:20,ord:"weak",sc:"now"},S.pick||{});
  S.plog=S.plog||[];S.ptms=S.ptms||{};S.open=S.open||{};}
function save(){
  for(let i=0;i<30;i++){
    try{localStorage.setItem(KEY,JSON.stringify(S));return;}
    catch(e){ if(S.plog.length>60){S.plog.splice(0,40);} else if(S.gal.length){S.gal.shift();} else return; }
  }
}
load();

/* =========================================================
   1. 図（SVG）
   ========================================================= */
const C={str:"#7d8fa0",dash:"#b8cfdd",ball:"#ffb8cf",ballS:"#e98aab",arw:"#58a3cc",tx:"#4a5a66",ceil:"#9fb4c3"};
const svg=(w,h,b,cls="fig")=>`<svg class="${cls}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" font-family="inherit">${b}</svg>`;
const tx=(x,y,t,o={})=>`<text x="${x}" y="${y}" font-size="${o.s||12}" fill="${o.c||C.tx}" text-anchor="${o.a||'middle'}" font-weight="${o.w||400}">${t}</text>`;
const ln=(x1,y1,x2,y2,o={})=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${o.c||C.str}" stroke-width="${o.w||2}" ${o.d?'stroke-dasharray="4 4"':''} stroke-linecap="round"/>`;
const ball=(x,y,r=9)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${C.ball}" stroke="${C.ballS}" stroke-width="2"/><circle cx="${x-r*.35}" cy="${y-r*.35}" r="${r*.28}" fill="#fff" opacity=".8"/>`;
function head(x1,y1,x2,y2,c){const a=Math.atan2(y2-y1,x2-x1),s=7;
  return `<path d="M${x2} ${y2}L${x2-s*Math.cos(a-.45)} ${y2-s*Math.sin(a-.45)}L${x2-s*Math.cos(a+.45)} ${y2-s*Math.sin(a+.45)}Z" fill="${c}"/>`;}
const arw=(x1,y1,x2,y2,c=C.arw,both=true)=>ln(x1,y1,x2,y2,{c,w:2})+head(x1,y1,x2,y2,c)+(both?head(x2,y2,x1,y1,c):"");
const ceil=(x1,x2,y)=>ln(x1,y,x2,y,{c:C.ceil,w:3})+Array.from({length:Math.floor((x2-x1)/10)},(_,i)=>ln(x1+5+i*10,y,x1+i*10,y-6,{c:C.ceil,w:1.2})).join("");
const P=(cx,cy,L,deg)=>[cx+L*Math.sin(deg*Math.PI/180),cy+L*Math.cos(deg*Math.PI/180)];
const arc=(cx,cy,r,d1,d2,c=C.arw)=>{const[a,b]=P(cx,cy,r,d1),[e,f]=P(cx,cy,r,d2);return `<path d="M${a} ${b}A${r} ${r} 0 0 ${d2>d1?0:1} ${e} ${f}" fill="none" stroke="${c}" stroke-width="2"/>`;};

/* ふりこの各部分 */
function figBasic(){
  const cx=150,cy=24,L=135,dg=25,[rx,ry]=P(cx,cy,L,dg),[lx,ly]=P(cx,cy,L,-dg);
  const n=[Math.cos(dg*Math.PI/180),-Math.sin(dg*Math.PI/180)];
  const o1=[cx+16*n[0],cy+16*n[1]],o2=[rx+16*n[0],ry+16*n[1]];
  return svg(300,215,
    ceil(115,185,cy)+ln(cx,cy,cx,cy+L+12,{c:C.dash,w:1.5,d:1})+ln(cx,cy,lx,ly)+ln(cx,cy,rx,ry)+ball(lx,ly,11)+ball(rx,ry,11)+
    `<circle cx="${cx}" cy="${cy}" r="4" fill="#ffa9c6"/>`+
    tx(78,46,"支点（してん）",{c:"#d56d93",w:600})+ln(110,42,146,27,{c:"#d56d93",w:1.2})+
    arw(o1[0],o1[1],o2[0],o2[1])+tx(247,92,"ふりこの長さ",{c:C.arw,w:600})+
    arc(cx,cy,52,0,dg)+tx(70,104,"ふれはば",{c:C.arw,w:600})+ln(96,99,156,78,{c:C.arw,w:1.2,d:1})+
    `<path d="M${lx} ${ly+20}Q${cx} ${ly+44} ${rx} ${ry+20}" fill="none" stroke="#e98aab" stroke-width="2.5"/>`+head(cx,ly+36,rx,ry+20,"#e98aab")+head(cx,ly+36,lx,ly+20,"#e98aab")+
    tx(cx,ly+54,"1往復（行って もどる）",{c:"#d56d93",w:600,s:11.5})+tx(lx-2,ly-16,"おもり",{s:11})
  );
}
/* ふりこの長さ ア〜ウ */
function figLen(){
  const x=120,top=16,cy=128,r=11;
  return svg(220,160,ceil(70,170,top)+ln(x,top,x,cy)+ball(x,cy,r)+

function todayStr(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
const md=s=>{const [y,m,d]=s.split("-").map(Number);const w="日月火水木金土"[new Date(y,m-1,d).getDay()];return `${m}/${d}（${w}）`;};
const daysTo=s=>{const [y,m,d]=s.split("-").map(Number);const t=new Date();t.setHours(0,0,0,0);return Math.round((new Date(y,m-1,d)-t)/864e5);};
function curTest(){const t=todayStr();return TESTS.find(x=>x.date>=t)||TESTS[TESTS.length-1];}
function todayPlan(test){const t=todayStr();const p=test.plan;let cur=null;p.forEach(x=>{if(x.d<=t)cur=x;});return cur||p[0];}
const planOf=d=>curTest().plan.find(x=>x.d===d);
const unlocked=(test,u)=>{if(S.unlockAll)return true;const tp=todayPlan(test);if(tp.us.includes(u))return true;
  const p=test.plan.find(x=>x.src==="core"&&x.us.includes(u));return !p||p.d<=frontier(test);};
/* さきどり：前の日までぜんぶできていれば、次の日のメニューも開く */
function frontier(test){const t=todayStr();const nd=test.plan.find(x=>!allDone(x.d));
  return !nd?"9999":(nd.d>t?nd.d:t);}
const isWeekend=d=>{const [y,m,dd]=d.split("-").map(Number);const w=new Date(y,m-1,dd).getDay();return w===0||w===6;};
const TASKS={core:["pt","app","paper"],wp:["app","wp"],final:["ever","test","wp"]};
/* np:1 の日（キャンプなど）は 紙のタスクを出さない */
const tasksOf=p=>TASKS[p.src].filter(k=>!(p.np&&(k==="paper"||k==="wp")));

function pickSet(pool,cap){const ok=q=>(S.stat[q.id]||{}).ok>0;

const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
function mix(list){ // 書く問題が固まらないようにまぜる
  const w=shuf(list.filter(q=>q.t==="w")),o=shuf(list.filter(q=>q.t!=="w"));if(!w.length)return o;
  const out=[],step=Math.max(1,Math.floor(o.length/(w.length)));let k=0;
  o.forEach((q,i)=>{out.push(q);if((i+1)%step===0&&k<w.length)out.push(w[k++]);});while(k<w.length)out.push(w[k++]);return out;}
function startUnit(u){ptClose("unit:"+u); // 1回18問まで。書く問題は必ず入れ、まだ正解していない問題を優先
  const all=Q.filter(q=>q.u===u),MAX=18,ok=q=>(S.stat[q.id]||{}).ok>0;
  const ws=shuf(all.filter(q=>q.t==="w")).sort((x,y)=>ok(x)-ok(y)).slice(0,6);
  const os=shuf(all.filter(q=>q.t!=="w")).sort((x,y)=>ok(x)-ok(y)).slice(0,MAX-ws.length);
  begin(mix([...ws,...os]),{u,d:sess&&sess.d,kind:"unit"});}
function startAll(d){const test=curTest(),ids=Object.keys(test.units),pool=Q.filter(q=>ids.includes(q.u));

function makePad(cv,H,onChange){
  const dpr=window.devicePixelRatio||1,W=cv.parentElement.clientWidth;cv.width=W*dpr;cv.height=H*dpr;cv.style.height=H+"px";
  const g=cv.getContext("2d");g.scale(dpr,dpr);g.lineCap="round";g.lineJoin="round";g.lineWidth=3.6;g.strokeStyle="#3c4b57";
  let strokes=[],cur=null,locked=false,len=0;
  const pos=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top];};
  const redraw=()=>{g.clearRect(0,0,W,H);len=0;strokes.forEach(s=>{g.beginPath();s.forEach((p,i)=>{i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]);if(i)len+=Math.hypot(p[0]-s[i-1][0],p[1]-s[i-1][1]);});if(s.length===1)g.lineTo(s[0][0]+.1,s[0][1]);g.stroke();});onChange();};
  cv.onpointerdown=e=>{if(locked)return;cv.setPointerCapture(e.pointerId);cur=[pos(e)];strokes.push(cur);g.beginPath();g.moveTo(...cur[0]);e.preventDefault();};
  cv.onpointermove=e=>{if(!cur)return;const p=pos(e),l=cur[cur.length-1];len+=Math.hypot(p[0]-l[0],p[1]-l[1]);cur.push(p);g.lineTo(...p);g.stroke();g.beginPath();g.moveTo(...p);e.preventDefault();};
  cv.onpointerup=cv.onpointercancel=()=>{if(cur){cur=null;onChange();}};
  return{ink:()=>len,clear:()=>{strokes=[];redraw();},undo:()=>{strokes.pop();redraw();},lock:()=>{locked=true;},
    snap:()=>{const t=document.createElement("canvas"),s=Math.min(1,420/W);t.width=W*s;t.height=H*s;const x=t.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,t.width,t.height);x.drawImage(cv,0,0,t.width,t.height);return t.toDataURL("image/jpeg",.6);}};
}

   <div class="card"><h2>📊 たんげんべつの記録</h2>
    <p class="muted" style="margin:0">出題＝これまでに答えた回数。<b>未＝1回も出題されていない問題数</b>。書く問題は本人の自己採点（◎＝正解）です。</p>
    ${TESTS.map(t=>`<div class="chl">${t.id===test.id?"🌊 いまのテスト":"📘 おわったテスト"}　${t.name}</div>
     ${T(["たんげん","問題数","出題","正解","正答率","未"],Object.entries(t.units).map(([k,u])=>{
       let ok=0,ng=0,non=0;const qs=Q.filter(q=>q.u===k);
       qs.forEach(q=>{const x=S.stat[q.id];if(!x){non++;return;}ok+=x.ok;ng+=x.ng;});
       const n=ok+ng;return [u.ic+" "+u.name,qs.length+"問",n+"回",ok+"回",n?Math.round(ok/n*100)+"%":"―",
         non?`<b style="color:#d56d93">${non}</b>`:"0"];}))}`).join("")}</div>
   ${(()=>{const top=Q.filter(q=>(S.stat[q.id]||{ng:0}).ng>0).sort((a,b)=>weakOf(b)-weakOf(a)).slice(0,10);
     return top.length?`<div class="card"><h2>⚠️ にがてTOP10<span class="muted" style="margin-left:auto;font-size:12px">ぜんぶのテストから</span></h2>
      <p class="muted" style="margin:0">まちがいが多く、正解が少ない順です。</p>
      ${top.map(q=>{const x=S.stat[q.id],u=ALLUNITS[q.u]||{ic:""};return `<div class="wl"><span class="rec">○${x.ok} ×${x.ng}</span>${u.ic} ${q.q.replace(/<[^>]+>/g,"").slice(0,54)}…</div>`;}).join("")}</div>`:"";})()}
   <div class="card"><h2>📅 がくしゅうプラン</h2>${test.plan.map(p=>{const d=S.done[p.d]||{},N={"pt": "ポイント", "app": "アプリ", "paper": "学校", "wp": "ウィンパス", "ever": "ぜんぶ見直し", "test": "まとめテスト"};return `<div class="wl">${md(p.d)}${p.camp?" 🏕":""} ${p.src==="core"?p.us.map(u=>test.units[u].name).join("・"):p.src==="wp"?"ウィンパス（2周目）":"総ざらい"}<br>${tasksOf(p).map(k=>N[k]+(d[k]?"✓":"・")).join(" ")}</div>`;}).join("")}</div>
   <div class="card"><h2>⚙️ せってい</h2>
    <button class="btn soft" onclick="S.unlockAll=!S.unlockAll;save();go('parent')">先の単元を ${S.unlockAll?"日付どおりにもどす":"ぜんぶひらく"}</button>
    <button class="btn soft" onclick="pickImg('home')">ホームの画像をかえる</button>
    <button class="btn soft" onclick="pickImg('prize')">けっか画面の画像をかえる</button>
    <button class="btn soft" onclick="if(confirm('画像を初期にもどしますか？')){S.img={};save();go('parent')}">画像を初期にもどす</button>
    <button class="btn soft" onclick="if(confirm('きろくをすべて消しますか？（もとにもどせません）')){localStorage.removeItem(KEY);location.reload()}">きろくをすべて消す</button></div>
   <button class="btn soft" onclick="go('home')">もどる</button>`;
}

go("home");
</script>
</body>
</html>
