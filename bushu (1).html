<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ぶしゅさがし</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Parisienne&display=swap" rel="stylesheet">
<style>
:root{
  --kyokasho:"HG教科書体","HGP教科書体","HGS教科書体","UD デジタル 教科書体 NK-R","UD Digi Kyokasho NK-R","YuKyokasho","游教科書体","Klee One","Hiragino Mincho ProN",serif;
  --sky:#bfe0f2; --sky2:#e8f4fb; --paper:#fbfdff; --line:#cfe6f4;
  --ink:#4a5a66; --sub:#8fa7b6; --gold:#c9a961; --leaf:#8fc7e8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--kyokasho);padding:8px;min-height:100vh}
.frame{background:var(--sky2);border-radius:26px;padding:10px;box-shadow:0 6px 18px rgba(120,170,200,.25)}
.sheet{background:var(--paper);border-radius:20px;border:1px solid #fff;padding:0 0 26px;overflow:hidden;max-width:100%}
header{position:sticky;top:0;background:linear-gradient(180deg,var(--paper) 80%,rgba(251,253,255,0));padding:12px 14px 10px;z-index:10}
.mascot{display:block;margin:0 auto 2px;width:86px;height:86px;object-fit:contain}
.title{max-width:100%;font-family:'Parisienne',cursive;font-size:32px;color:var(--gold);line-height:1;text-align:center}
.title .cl{font-size:20px;vertical-align:super}
.sub{text-align:center;font-size:12.5px;color:var(--sub);margin:2px 0 10px;letter-spacing:.22em}
.row{display:flex;gap:6px;align-items:stretch}
input{flex:1 1 0;min-width:0;width:100%;font-family:var(--kyokasho);font-size:19px;padding:10px 12px;border:2px solid var(--line);border-radius:16px;background:#fff;color:var(--ink)}
input:focus{outline:none;border-color:var(--leaf)}
input::placeholder{color:#b9cdda;font-size:16px}
button{flex:0 0 auto;white-space:nowrap;font-family:var(--kyokasho);border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:16px;padding:0 12px;font-size:14px;cursor:pointer}
button.on{background:var(--leaf);border-color:var(--leaf);color:#fff}
.hint{font-size:11.5px;color:var(--sub);margin-top:7px;text-align:center}
main{padding:4px 14px}
.card{max-width:100%;background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:0 3px 10px rgba(150,195,220,.18)}
.crow{display:flex;gap:14px;align-items:flex-start}
.big{font-size:56px;line-height:1;min-width:68px;text-align:center;color:#3f5261}
.bs{font-size:46px}
.info{flex:1;min-width:0;border-left:1px dashed var(--line);padding-left:14px}
.bname{font-size:26px;font-weight:600;color:#5f93b3;line-height:1.2}
.bname .nm{font-size:13px;color:var(--sub);margin-left:4px}
.imi{background:var(--sky2);border-radius:12px;padding:7px 10px;font-size:14px;margin:7px 0;line-height:1.5}
.meta{font-size:12.5px;color:var(--sub);line-height:1.8}
.meta b{color:var(--ink);font-weight:600}
.miss{color:var(--sub);font-size:14px;line-height:1.7}
.glist{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.g{border:1px solid var(--line);background:var(--sky2);border-radius:12px;padding:5px 9px;font-size:24px;cursor:pointer;color:#3f5261;line-height:1.1}
.g small{font-size:9.5px;color:var(--sub);display:block;text-align:center}
h2{font-size:13px;color:var(--sub);margin:16px 0 8px;font-weight:600;letter-spacing:.16em;display:flex;align-items:center;gap:8px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
.rgrid{display:flex;flex-wrap:wrap;gap:6px}
.rb{border:1px solid var(--line);background:#fff;border-radius:14px;padding:7px 6px;cursor:pointer;text-align:center;min-width:58px;box-shadow:0 2px 5px rgba(150,195,220,.14)}
.rb:active{background:var(--sky2)}
.rb .rc{font-size:24px;line-height:1.1;color:#3f5261}
.rb .rn{font-size:9.5px;color:var(--sub);line-height:1.3;margin-top:2px}
.rb .ex{font-size:11px;color:#9dbfd4;margin-top:1px}
.filters{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:7px}
.filters button{padding:5px 10px;font-size:12.5px;border-radius:12px;border-width:1.5px}
.cmp{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.cmpb{flex:1 1 46%;min-width:150px;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:10px;cursor:pointer;display:flex;gap:10px;align-items:center}
.cmpb .cf{font-size:32px;line-height:1;color:#3f5261}
.cmpb .ct{font-size:12.5px;color:var(--sub);line-height:1.5}
.cmpb .ct b{color:var(--ink);font-size:14px}
.lead{font-size:13px;color:var(--sub);margin:2px 0 8px}
.btn-s{margin-top:10px;font-size:12.5px;padding:5px 12px;border-radius:12px}
.foot{text-align:center;font-family:'Parisienne',cursive;color:var(--gold);font-size:16px;margin-top:16px}
</style>
</head>
<body>
<div class="frame"><div class="sheet">
<header>
  <img class="mascot" id="mascot" src="mascot.png" alt="">
  <div class="title">Bushu Search<span class="cl">☘</span></div>
  <div class="sub">ぶしゅさがし</div>
  <div class="row">
    <input id="q" placeholder="かんじ / ぶしゅ名" autocomplete="off" autocapitalize="off">
    <button id="clr">×</button>
    <button id="listBtn">一覧</button>
  </div>
  <div class="filters" id="filters"></div>
  <div class="hint">例：業 ／ さんずい ／ 氵　※かんじはまとめて入力OK</div>
</header>
<main id="out"></main>
<div class="foot">May your kanji day be happy!</div>
</div></div>

const kanMap={}; KAN.forEach(k=>kanMap[k.k]=k);
let FILT='syo';
const GRADE=g=> g==null?'':(g<=6?'小'+g:(g===8?'常用':'人名'));
const out=document.getElementById('out'), q=document.getElementById('q');
function kanjiOf(e){
  if(FILT==='all') return e.k;
  if(FILT==='syo') return e.k.filter(c=>(kanMap[c].g||9)<=6);
  return e.k.filter(c=>kanMap[c].g===FILT);
}
const FILT_LABEL=()=> FILT==='all'?'':(FILT==='syo'?'小学校の漢字':FILT+'年生の漢字');
const FILTS=[['syo','小学校の漢字だけ'],[1,'1年'],[2,'2年'],[3,'3年'],[4,'4年'],[5,'5年'],[6,'6年'],['all','ぜんぶ']];
function drawFilters(){
  document.getElementById('filters').innerHTML=FILTS.map(([v,l])=>
    `<button data-v="${v}" class="${String(FILT)===String(v)?'on':''}">${l}</button>`).join('');
  document.querySelectorAll('#filters button').forEach(b=>b.onclick=()=>{
    const v=b.dataset.v; FILT=(v==='syo'||v==='all')?v:parseInt(v,10);
    drawFilters(); render();
  });
}

function entCard(e){
  const list=kanjiOf(e), show=list.slice(0,90);
  return `<div class="card">
    <div class="crow">
      <div class="big bs">${e.f}<div class="meta" style="font-size:11px;margin-top:6px">${e.s}画</div></div>
      <div class="info">
        <div class="bname">${e.y.join('・')}<span class="nm">${e.nm}</span></div>
        ${e.m?`<div class="imi">${e.m}</div>`:''}
        <div class="meta">部首の画数 ${e.s}画　／　この部首の漢字 ${list.length}字</div>
      </div>
    </div>
    <div class="glist">${show.map(c=>`<span class="g" onclick="setQ('${c}')">${c}<small>${GRADE(kanMap[c].g)||kanMap[c].s+'画'}</small></span>`).join('')}</div>
    ${list.length>90?'<div class="meta">…ほか</div>':''}
    ${show.length===0?`<div class="miss">${FILT_LABEL()||'この部首の漢字'}はありません</div>`:''}
  </div>`;
}
function kanjiCard(c){
  const k=kanMap[c];
  if(!k) return `<div class="card"><div class="crow"><div class="big">${c}</div><div class="info"><div class="miss">この漢字のデータがありません。<br>（常用漢字・人名用漢字・頻出字を収録）</div></div></div></div>`;
  const e=ENT[k.e];
  return `<div class="card">
    <div class="crow">
      <div class="big">${c}<div class="meta" style="font-size:11px;margin-top:5px">${k.s}画 ${GRADE(k.g)}</div></div>
      <div class="info">
        <div class="bname">${e.f}　${e.y.join('・')}<span class="nm">${e.nm}</span></div>
        ${e.m?`<div class="imi">${e.m}</div>`:''}
        <div class="meta"><b>部首</b> ${e.f}（${e.s}画）／<b>総画</b> ${k.s}画<br>
        <b>音</b> ${k.on.join('・')||'—'}<br><b>訓</b> ${k.kun.join('・')||'—'}</div>
        <button class="btn-s" onclick="showEnt(${k.e})">同じ部首の漢字</button>
      </div>
    </div></div>`;
}
function showEnt(i){ out.innerHTML=entCard(ENT[i]); window.scrollTo(0,0); }
function setQ(s){ q.value=s; render(); window.scrollTo(0,0); }
function showList(){
  let h='',cur=-1;
  ENT.forEach((e,i)=>{
    const n=kanjiOf(e).length;
    if(n===0) return;
    if(e.s!==cur){ cur=e.s; h+=(h?'</div>':'')+`<h2>${cur}画</h2><div class="rgrid">`; }
    h+=`<div class="rb" onclick="showEnt(${i})"><div class="rc">${e.f}</div><div class="rn">${e.y[0]}</div><div class="ex">${kanjiOf(e).slice(0,2).join('')||'　'}</div></div>`;
  });
  out.innerHTML=h+(h?'</div>':''); window.scrollTo(0,0);
}
function norm(s){ return s.replace(/[ぁ-ゖ]/g,c=>String.fromCharCode(c.charCodeAt(0)+0x60)); }
function render(){
  const v=q.value.trim();
  if(!v){ showList(); return; }
  const kanji=[...v].filter(c=>/[\u3400-\u9FFF\uF900-\uFAFF]/.test(c) && kanMap[c]);
  const other=[...v].filter(c=>!kanMap[c]);
  let h='';
  if(kanji.length) h+=kanji.map(kanjiCard).join('');
  if(!kanji.length){
    const fh=ENT.map((e,i)=>i).filter(i=>[...v].some(c=>ENT[i].f===c));
    if(fh.length) h+=fh.map(i=>entCard(ENT[i])).join('');
    else{
      const key=norm(v);
      const exact=ENT.map((e,i)=>i).filter(i=>ENT[i].y.some(y=>norm(y)===key));
      const loose=ENT.map((e,i)=>i).filter(i=>!exact.includes(i) &&
        (ENT[i].y.some(y=>norm(y).includes(key))||norm(ENT[i].nm).includes(key)||norm(ENT[i].m).includes(key)));
      const hits=exact.concat(loose);
      if(!hits.length){
        h='<div class="card"><div class="miss">見つかりませんでした。かんじ・ぶしゅ名（さんずい など）・ぶしゅ（氵 など）で検索してね。</div></div>';
      }else{
        if(hits.length>1){
          h+=`<div class="lead">「${v}」は ${hits.length} つあります。えらんでね。</div><div class="cmp">`+
            hits.slice(0,8).map(i=>{const e=ENT[i];const ex=kanjiOf(e).slice(0,3).join('・')||'—';
              return `<div class="cmpb" onclick="showEnt(${i})"><div class="cf">${e.f}</div>
                <div class="ct"><b>${e.y.join('・')}</b><br>${e.s}画　${e.nm}<br>${ex}</div></div>`;}).join('')+'</div>';
        }
        h+=hits.slice(0,8).map(i=>entCard(ENT[i])).join('');
      }
    }
  }
  out.innerHTML=h;
}
document.getElementById('listBtn').onclick=showList;
document.getElementById('clr').onclick=()=>{q.value='';q.focus();render();};
q.addEventListener('input',render);
drawFilters();
showList();
</script>
